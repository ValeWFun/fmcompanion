let WATCH = {}, DETAIL_ID = null, COMPARE = [];
const API = () => (window.pywebview && window.pywebview.api) || null;

function profileOf(p){
  if(p.is_gk) return "tw";
  const g = (p.pos_groups||["unk"])[0];
  if(g==="def") return ((Number(p.pos_mask)||0) & 16) ? "iv" : "av";
  return ["mid","off","st"].includes(g) ? g : null;
}
const DETAIL_METRICS_FIELD = [
  ["goals_p90","Tore/90"],["assists_p90","Vorlagen/90"],["xg_p90","xG/90"],
  ["xa_p90","xA/90"],["shots_p90","Schüsse/90"],["press_p90","Pressing/90"],
  ["prog_p90","Progr. Pässe/90"],["int_p90","Abgefangen/90"],
  ["keyp_p90","Schlüsselp./90"],["loss_p90","Ballsicherheit",true],
  ["dribbles_p90","Dribblings/90"],["duel_pct","ZWK-Quote %"],
  ["header_pct","Kopfball %"],["pass_pct","Pass %"],["rating","Ø-Note"]];
const DETAIL_METRICS_GK = [
  ["note_resid","Note über Erwartung"],["gp_shot","Verhindert je 100 Sch."],
  ["save_pct","Paradenquote %"],["conceded_p90","GEG/90",true],
  ["pass_pct","Pass %"],["rating","Ø-Note"]];

const cohortFor = p => { const pr=profileOf(p); return PLAYERS.filter(q=>profileOf(q)===pr); };

function pctOf(vals, v, invert){
  const s=[...vals].sort((a,b)=>a-b), n=s.length;
  if(n<4) return null;
  let lo=0, hi=0;
  for(const x of s){ if(x<v)lo++; if(x<=v)hi++; }
  const pct = 100*(lo+0.5*(hi-lo))/n;
  return invert ? 100-pct : pct;
}
const barColor = r => r>=65?"var(--pos)":(r<=35?"var(--neg)":"var(--blue)");

function metricBars(p, cohort){
  const mets = p.is_gk ? DETAIL_METRICS_GK : DETAIL_METRICS_FIELD;
  return mets.map(([k,label,inv])=>{
    // Fehlende Werte bleiben draußen statt als 0 mitzulaufen – sonst stünde
    // ein Torwart ohne Paraden-Daten im 5. Perzentil der Paradenquote.
    const pct = p[k]==null ? null : pctOf(cohort.filter(q=>q[k]!=null).map(q=>+q[k]), +p[k], inv);
    if(pct==null) return `<div class="pbar"><span class="plab">${label}</span><div class="ptrack"></div><b class="muted">–</b></div>`;
    const r=Math.round(pct);
    return `<div class="pbar"${inv?' title="weniger ist besser (invertiert)"':''}>
      <span class="plab">${label}</span>
      <div class="ptrack"><i style="width:${r}%;background:${barColor(r)}"></i></div>
      <b>${r}</b></div>`;
  }).join("");
}

// Preislot: Marktwert und geschätzter Fair Value als zwei Balken auf
// gemeinsamer Skala – der Abstand ist die Aussage, nicht die einzelne Zahl.
// Fehlt der Marktwert oder trägt das Modell nicht, entfällt der Block
// vollständig (Abwesenheit statt Platzhalter).
function preislot(p){
  const markt = marktMio(p);
  const abl = p.transfer_fee!=null ? p.transfer_fee/1e6 : null;     // D2
  // Torhüter: Marktwert (und Ablöse) ja, Fair Value bewusst nicht
  if(p.fair_urteil==null && !(p.is_gk && markt!=null)) return "";
  const fair = p.fair_urteil==null ? null : p.fair_value_m;
  const max = Math.max(markt||0, fair||0, abl||0) || 1;
  const kl = urteilKlasse(p);
  const farbe = /u-.unter/.test(kl) ? "var(--pos)" : /u-.ueber/.test(kl) ? "var(--neg)" : "var(--muted)";
  const balken = (label, wert, col) => `<div class="pbar">
       <span class="plab">${label}</span>
       <div class="ptrack"><i style="width:${Math.max(1,Math.round(100*wert/max))}%;background:${col}"></i></div>
       <span class="tval">${fmtMio(wert)}</span></div>`;
  return `<div class="dsec">Preislot</div>
   <div class="lot">
     ${markt!=null ? balken("Marktwert", markt, "var(--blue)") : ""}
     ${fair!=null ? balken("Fair Value", fair, p.value_reliable===false ? "var(--dim)" : farbe) : ""}
     ${abl!=null ? balken(istEigen(p) ? "unsere Forderung" : "Ablöseforderung", abl, "var(--text)") : ""}
     ${fair!=null ? `<div class="lotdelta"><span class="urteil ${kl}">${p.fair_urteil}</span>
        <span class="muted" style="font-weight:400;font-size:11.5px">${fairSatz(p.value_delta_pct)}</span></div>
     <div class="lotnote">Schätzwert aus Leistung, Alter, Liga und Position${
        modellStatus() ? ` · Modell: ${modellStatus()}` : ""}.</div>
     <div class="lotwarn">${esc2((VALUE_MODEL && VALUE_MODEL.hinweis)
        || `Der Schätzwert liegt typischerweise um Faktor ${streuung()} neben dem Markt – das Urteil trennt nur Extremfälle.`)}</div>
     ${p.value_reliable===false ? `<div class="lotwarn">unsichere Stichprobe (&lt; ${FAIR_MIN_MIN} Min.) – das Urteil behauptet nichts</div>` : ""}`
     : `<div class="lotnote">${FAIR_LEER_GK}.</div>`}
   </div>`;
}

// Persönlichkeit im Drawer: Beschreibung und Medienumgang wörtlich, die zwei
// Achsen als Balken, darunter die Hinweise. Ohne Scouting-Wissen bleibt nur
// der Vermerk – Abwesenheit statt Platzhalter.
function charakterBlock(p){
  if(p.pers_score==null && !p.pers_medien && !p.foot && !p.info) return "";
  const stamm = [p.foot ? `starker Fuß: ${esc2(p.foot)}` : "",
                 p.info ? `Status: ${esc2(infoText(p.info))}` : ""].filter(Boolean).join(" · ");
  if(p.pers_score==null)
    return `<div class="dsec">Persönlichkeit</div>
      <div class="muted" style="font-size:12px">noch nicht gescoutet${p.pers_medien?` · Medienumgang: ${esc2(p.pers_medien)}`:""}${stamm?` · ${stamm}`:""}</div>`;
  const bar=(label,v)=>`<div class="pbar"><span class="plab">${label}</span>
      <div class="ptrack"><i style="width:${v}%;background:${persInk(v)}"></i></div><b>${v}</b></div>`;
  const hin=(p.pers_hinweise||[]).map(h=>`<div class="lotnote">· ${esc2(h)}</div>`).join("");
  return `<div class="dsec">Persönlichkeit</div>
    <div style="font-size:12.5px;margin-bottom:4px"><b style="color:${persInk(p.pers_score)}">${esc2(p.pers_label)}</b>
      <span class="muted">· ${esc2(p.pers_stufe)} ${p.pers_score}${
        p.pers_stand?` · Stand ${monatJahr(p.pers_stand)}`:""}${p.pers_medien?` · Medien: ${esc2(p.pers_medien)}`:""}${stamm?` · ${stamm}`:""}</span></div>
    ${bar("Entwicklung", p.pers_dev)}${bar("Mentalität", p.pers_ment)}${hin}
    <div class="lotnote">aus der sichtbaren Beschreibung im Spielerprofil – kein Bestandteil des Scores</div>`;
}

function spark(vals, last){
  if(vals.length<2) return `<span class="muted">zu wenig Snapshots</span>`;
  const W=150,H=26,P=2;
  const mn=Math.min(...vals), mx=Math.max(...vals);
  const X=i=>P+(W-2*P)*i/(vals.length-1);
  const Y=v=>mx===mn?H/2:P+(H-2*P)*(1-(v-mn)/(mx-mn));
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}"><polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="1.5"/></svg><b>${last}</b>`;
}

function openDetail(id){
  if(id==null) return;
  DETAIL_ID=id;
  document.getElementById("overlay").classList.add("on");
  document.getElementById("drawer").classList.add("open");
  renderDetail();
}
function closeAll(){
  DETAIL_ID=null;
  document.getElementById("overlay").classList.remove("on");
  document.getElementById("drawer").classList.remove("open");
}

async function renderDetail(){
  const p = PLAYERS.find(q=>q.id===DETAIL_ID);
  const d = document.getElementById("drawer");
  if(!p){ d.innerHTML="<p class='muted'>Spieler nicht im aktuellen Datensatz.</p>"; return; }
  const cohort = cohortFor(p);
  const w = WATCH[p.id]||{};
  const sc = p.score!=null
    ? `<span class="pill" style="background:rgba(var(${p.score>=50?'--heat-pos':'--heat-neg'}),.4)">${p.score}</span>` : "";
  d.innerHTML = `
   <div class="dhead"><h2>${p.name}</h2>${sc}<button class="xbtn" onclick="closeAll()">✕</button></div>
   <div class="dsub">${p.profile_label||"?"} · ${p.pos_label||"?"} · ${p.age?p.age+" J · ":""}${p.minutes||0} Min${p.value_m!=null?` · <b>${p.value_m} M€</b>`:""}${p.value_score!=null?` · Eff ${p.value_score}`:""} ·
     ${p.league?`${p.league} (K ${p.league_coeff})`:"Liga unbekannt"}${p.exp_at?` · <span title="Export-Stand">Export ${p.exp_at.slice(0,10)}</span>`:""}</div>
   ${p.pl_text || p.homegrown ? `<div class="dhg" title="Bezogen auf unseren Verein zum Exportzeitpunkt">${
      p.pl_text ? `Meldeliste · ${plZelle(p)}` : ""}${p.homegrown ? `<div class="muted">Eigengewächs: ${esc2(p.homegrown)}${
      p.homegrown_stand ? ` · Stand ${datumKurz(p.homegrown_stand)}` : ""}</div>` : ""}</div>` : ""}
   ${preislot(p)}
   ${charakterBlock(p)}
   <div class="dsec">Merkliste</div>
   <div class="wbtns">
     ${["beobachten","kaufen","verkaufen"].map(s=>
       `<button class="wbtn ${w.status===s?'on':''}" onclick="setWatch(${p.id},'${s}')">${s}</button>`).join("")}
   </div>
   <input class="wnote" id="wnote" placeholder="Notiz…" value="${(w.note||"").replace(/"/g,'&quot;')}" onchange="saveNote(${p.id})">
   <div class="dsec">Perzentile – ${p.profile_label||"?"} (${cohort.length} Spieler im Vergleich)</div>
   ${metricBars(p, cohort)}
   <button class="wbtn" style="margin-top:10px" onclick="addCompare(${p.id})">+ zum Vergleich</button>
   <div class="dsec">Verlauf über Snapshots</div>
   <div id="dHist" class="muted">lade…</div>
   <div class="dsec">Saison-Historie (alle Records)</div>
   <div id="dSeas" class="muted">lade…</div>
   ${p.eid?`<div class="dsec">Marktwert-Verlauf</div><div id="dValue" class="muted">lade…</div>`:""}`;
  const api=API();
  if(!api){
    document.getElementById("dHist").textContent="nur in der App verfügbar";
    document.getElementById("dSeas").textContent="nur in der App verfügbar";
    return;
  }
  const [hist, seas] = await Promise.all([api.history(p.id), api.seasons(p.id)]);
  const hh = (hist||[]).slice(-14);
  document.getElementById("dHist").innerHTML = [
    ["minutes","Minuten",v=>v],["goals","Tore",v=>v],
    ["xg","xG",v=>(+v).toFixed(2)],["rating","Note",v=>(+v).toFixed(2)]
  ].map(([k,l,f])=>{
    const vals=hh.map(r=>+r[k]||0);
    return `<div class="sparkrow"><span class="plab">${l}</span>${spark(vals, f(vals[vals.length-1]??0))}</div>`;
  }).join("") + `<div class="muted" style="font-size:11.5px;margin-top:4px">${hh.length} Snapshots</div>`;
  if(!(seas||[]).length){
    document.getElementById("dSeas").textContent="keine Records";
  } else {
    const rows=seas.map(r=>`<tr class="${r.is_current?'cur':''}">
      <td>${r.is_current?"▶ zählt mit":"älter"}</td>
      <td>${r.minutes||0}</td><td>${r.apps||0}</td><td>${r.goals||0}</td>
      <td>${r.assists||0}</td><td>${(+r.xg||0).toFixed(2)}</td>
      <td>${r.rating?(+r.rating).toFixed(2):"–"}</td></tr>`).join("");
    document.getElementById("dSeas").innerHTML=`<table class="seas"><thead>
      <tr><th>Wettbewerb</th><th>Min</th><th>Eins</th><th>Tore</th><th>Vorl</th><th>xG</th><th>Note</th></tr>
      </thead><tbody>${rows}</tbody></table>
      <div class="muted" style="font-size:11.5px;margin-top:4px">FM speichert je Wettbewerb –
      die Saison des Spielers ist die Summe dieser Zeilen. Nach einem Vereinswechsel
      mitten in der Saison stehen auch die Records des Vorvereins darunter.</div>`;
  }
  const dv=document.getElementById("dValue");
  if(dv){
    let vh=[]; try{ vh=await api.value_history(p.eid)||[]; }catch(e){}
    const vals=vh.map(r=>+r.value/1e6).filter(v=>!isNaN(v));
    if(vals.length<2) dv.innerHTML=`<span class="muted">${vals.length?`${vals[0].toFixed(1)} M€ (nur 1 Import – Verlauf entsteht mit weiteren Exporten)`:"noch kein Export-Wert"}</span>`;
    else { const first=vals[0], last=vals[vals.length-1], d=last-first;
      dv.innerHTML=`<div class="sparkrow"><span class="plab">Marktwert</span>${spark(vals, last.toFixed(1)+" M€")}</div>
        <div class="muted" style="font-size:11.5px">${vh.length} Importe · ${d>=0?"+":""}${d.toFixed(1)} M€ seit ${(vh[0].imported_at||'').slice(0,10)}</div>`; }
  }
}

async function setWatch(id, status){
  const cur=WATCH[id]||{};
  const next = cur.status===status ? "" : status;
  const note = document.getElementById("wnote")?.value ?? cur.note ?? "";
  if(next) WATCH[id]={status:next, note}; else delete WATCH[id];
  const api=API(); if(api) await api.watchlist_set(id, next, note);
  renderDetail();
}
async function saveNote(id){
  const note=document.getElementById("wnote").value;
  const status=(WATCH[id]||{}).status || "beobachten";
  WATCH[id]={status, note};
  const api=API(); if(api) await api.watchlist_set(id, status, note);
}

// ======================= Slot-Vergleich =====================================
// Die häufigste Frage im Scouting: „Wie steht Spieler X auf Position Y gegen
// unsere Leute?" Spalten = Stamm und Backup der Position (vom Brett, Pins
// eingeschlossen) plus bis zu drei Kandidaten; Zeilen = Leistung, die
// Kennzahlen der Rolle, Preis, Profil. Gerechnet wird im Backend
// (slot_compare) gegen dieselbe Referenz wie Brett und Ersatzsuche – Gesamt
// ist die Brett-Zahl, sonst hieße „76" hier etwas anderes als auf dem Platz.
// Kandidaten sammelt die Vergleichsleiste: aus Tabelle, Drawer, Ersatzsuche
// oder direkt über das Suchfeld im Vergleich.
let CMP = null, CMP_SLOT = null, CMP_Q = "", CMP_SEL = 0,
    CMP_FOKUS = false;     // nach dem Hinzufügen zurück ins Suchfeld
const CMP_NAMEN = {};      // Namen der Kandidaten, auch wenn sie nicht in PLAYERS stehen
const SLOT_KEYS = ["tw","lv","ivl","ivr","rv","dml","dmr","aml","amc","amr","st"];
const SLOT_NAMEN = {tw:"Torwart", lv:"Linksverteidiger", ivl:"Innenverteidiger links",
  ivr:"Innenverteidiger rechts", rv:"Rechtsverteidiger", dml:"Sechser links",
  dmr:"Sechser rechts", aml:"Linksaußen", amc:"Zehner", amr:"Rechtsaußen", st:"Sturmspitze"};
const SLOT_KURZ = {tw:"TW", lv:"LV", ivl:"IV", ivr:"IV", rv:"RV", dml:"DM", dmr:"DM",
  aml:"IAS", amc:"OM", amr:"IAS", st:"ST"};
const SLOT_GRUPPE = {tw:"tw", lv:"def", ivl:"def", ivr:"def", rv:"def", dml:"mid",
  dmr:"mid", aml:"off", amc:"off", amr:"off", st:"st"};
const slotName = k => (TACT && (TACT.slots.find(s=>s.key===k)||{}).label) || SLOT_NAMEN[k] || k;
const slotKurz = k => (TACT && (TACT.slots.find(s=>s.key===k)||{}).kurz) || SLOT_KURZ[k] || k;
const spielerVon = id => PLAYERS.find(q=>q.id===id) || PLAYERS.find(q=>q.eid && +q.eid===+id);

// Startvorschlag für die Position – nur ein Vorschlag, im Fenster umstellbar.
function slotFuer(p){
  if(!p) return null;
  if(p.is_gk) return "tw";
  const l = String(p.pos_label||"").split(",")[0].trim();
  const links = /links/i.test(p.foot||"");
  return {TW:"tw", IV:links?"ivl":"ivr", LV:"lv", RV:"rv", AV:links?"lv":"rv",
          DM:"dml", ZM:"dmr", OM:"amc", FL:links?"aml":"amr", ST:"st"}[l] || null;
}
function cmpSlotVorschlag(){
  if(CMP_SLOT) return CMP_SLOT;
  return slotFuer(COMPARE.length ? spielerVon(COMPARE[0]) : null) || TACT_SLOT || "st";
}
const cmpOffen = () => document.getElementById("cmpModal").classList.contains("on");

function addCompare(id, name){
  if(name) CMP_NAMEN[id] = name;
  if(!COMPARE.includes(id)){ if(COMPARE.length>=3) COMPARE.shift(); COMPARE.push(id); }
  renderCompareBar();
  if(cmpOffen()) loadCompare();
}
function removeCompare(id){
  COMPARE=COMPARE.filter(x=>x!==id); renderCompareBar();
  if(cmpOffen()) loadCompare();
}
function renderCompareBar(){
  const bar=document.getElementById("compareBar");
  if(!COMPARE.length){ bar.classList.remove("on"); bar.innerHTML=""; return; }
  const chips=COMPARE.map(id=>{
    const p=spielerVon(id);
    return `<span class="chip">${esc2(p?p.name:(CMP_NAMEN[id]||String(id)))}<i onclick="removeCompare(${id})" title="aus dem Vergleich nehmen">✕</i></span>`;
  }).join("");
  bar.innerHTML=`${chips}<button onclick="openCompare()">Vergleichen</button>
    <span class="cmpos">auf ${esc2(slotName(cmpSlotVorschlag()))} · gegen Stamm und Backup</span>
    <button class="xbtn" onclick="COMPARE=[];renderCompareBar()">leeren</button>`;
  bar.classList.add("on");
}
async function openCompare(slotKey){
  CMP_SLOT = slotKey || cmpSlotVorschlag();
  CMP_Q = ""; CMP_SEL = 0;
  document.getElementById("cmpModal").classList.add("on");
  await loadCompare();
}
async function loadCompare(){
  const api = API(); if(!api) return nurInApp();
  CMP = null; drawCompare();
  try{ CMP = await api.slot_compare(CMP_SLOT, COMPARE); }
  catch(e){ CMP = {ok:false, error:String(e)}; }
  drawCompare();
}
function setCmpSlot(k){ CMP_SLOT = k; renderCompareBar(); loadCompare(); }
function closeCompare(){ document.getElementById("cmpModal").classList.remove("on"); CMP_Q=""; }

// Der Vergleich rechnet wie das Brett, die Ersatzsuche ohne Moneyball-Score –
// derselbe Kandidat kann dort eine andere Gesamtzahl tragen (FM Dev, D8).
const GESAMT_VGL_TIP = "Wie auf dem Brett: Fit^0,35 × Score^0,35 × Charakter^0,30. "
  + "Die Ersatzsuche rechnet ohne Moneyball-Score (Fit^0,7 × Charakter^0,3) – "
  + "dort kann derselbe Kandidat eine andere Gesamtzahl haben; Fit und Umschulungsabzug sind gleich.";

// ---- Bausteine der Matrix ----
const cmpDelta = d => d==null ? `<span class="cmd"></span>`
  : `<span class="cmd ${d>0?"pos":d<0?"neg":""}">${d>0?"+":d<0?"−":"±"}${Math.abs(d)}</span>`;
const rohwert = t => t.wert==null ? "–" : t.format==="pct" ? Math.round(t.wert)+" %"
  : t.format==="1f" ? (+t.wert).toFixed(1) : (+t.wert).toFixed(2);
const fussKurz = f => (f||"").replace(/^Nur /,"nur ").replace(/^Rechts$/,"rechts")
  .replace(/^Links$/,"links").replace(/^Beide$/,"beidfüßig").replace(/nur (R|L)/, (m,a)=>"nur "+a.toLowerCase());
const datumKurz = s => s ? `${String(s).slice(8,10)}.${String(s).slice(5,7)}.${String(s).slice(0,4)}` : "–";

function drawCompare(){
  const box = document.getElementById("cmpBox");
  box.classList.add("slotcmp");
  const key = CMP_SLOT;
  const slot = (CMP && CMP.ok && CMP.slot) || {label:slotName(key), kurz:slotKurz(key)};
  const optionen = SLOT_KEYS.map(k=>`<option value="${k}"${k===key?" selected":""}>${esc2(slotName(k))}</option>`).join("");
  const kopf = `<div class="cmhead">
      <span class="cmtile" style="--grp:var(--pg-${SLOT_GRUPPE[key]||"mid"})">${esc2(slot.kurz||slotKurz(key))}</span>
      <div class="cmtitel"><h2>${esc2(slot.label||slotName(key))}</h2>
        <div class="dsub">${slot.rolle ? `${esc2(slot.rolle)}${rolleKurz(slot)} · ${esc2(slot.duty||"")} · ` : ""}Vergleich gegen Stamm und Backup</div></div>
      <label class="status" style="display:flex;gap:6px;align-items:center">Position
        <select onchange="setCmpSlot(this.value)">${optionen}</select></label>
      <button class="xbtn" onclick="closeCompare()" title="schließen (Esc)">✕</button></div>`;
  if(!CMP){ box.innerHTML = kopf + `<div class="empty" style="padding:36px 8px"><span class="spin"></span> rechne…</div>`; return; }
  if(!CMP.ok){ box.innerHTML = kopf + `<div class="dsub" style="margin-top:14px">${esc2(CMP.error
      || (CMP.kein_kader ? "Erst einen Kader auswählen." : "Kein Vergleich möglich."))}</div>`; return; }

  const S = CMP.spieler;
  const st = S.find(s=>s.rolle==="stamm");
  let kn = 0;
  S.forEach(s=>{ if(s.rolle==="kandidat") s._nr = ++kn; });
  const platz = kn < 3;                                   // Suchspalte zeigen?
  const zc = s => s.rolle==="stamm" ? ' class="stamm"' : "";
  const leer = platz ? "<td></td>" : "";
  const sektion = (t, sub) => `<tr class="cmsec"><td>${t}${sub?` <span style="text-transform:none;letter-spacing:0">· ${sub}</span>`:""}</td>${
    S.map(s=>`<td${zc(s)}></td>`).join("")}${leer}</tr>`;
  const zeile = (label, sub, fn) => `<tr><td>${label}${sub?`<small>${sub}</small>`:""}</td>${
    S.map(s=>`<td${zc(s)}>${s.fehlt ? `<span class="cmleer">–</span>` : fn(s)}</td>`).join("")}${leer}</tr>`;

  // Kopfzeile: Rolle, Name, Eckdaten; Kandidaten mit ✕
  const kopfzellen = S.map(s=>{
    const rolle = s.rolle==="stamm" ? `Stamm${s.gepinnt?"<em>manuell</em>":""}`
      : s.rolle==="backup" ? "Backup" : `Kandidat ${s._nr}`;
    // Zwei feste Zeilen (Verein / Alter · Fuß), damit alle Köpfe gleich hoch sind
    const meta = `${esc2(s.club||"–")}<br>${[s.age!=null ? Math.round(s.age)+" J" : null,
      fussKurz(s.foot)||null].filter(Boolean).map(esc2).join(" · ")}`;
    const weg = s.rolle==="kandidat" && s.anfrage_id!=null
      ? `<button class="cmweg" onclick="removeCompare(${s.anfrage_id})" title="aus dem Vergleich nehmen">✕</button>` : "";
    return `<th${zc(s)}>${weg}<span class="cmrolle">${rolle}</span>
      <div class="cmname">${esc2(s.name)}</div>
      ${s.fehlt ? `${s.club ? `<div class="cmmeta">${esc2(s.club)}</div>` : ""}<div class="cmfehlt">${esc2(s.fehlt)}</div>`
                : `<div class="cmmeta">${meta}</div>`}</th>`;
  }).join("");
  const suchkopf = platz ? `<th class="cmadd"><span class="cmrolle">+ Kandidat</span>
      <div style="position:relative"><input id="cmpSuche" type="search" placeholder="Spieler aus Exporten…"
        value="${esc2(CMP_Q)}" oninput="cmpSuche(this.value)" onkeydown="cmpSucheTaste(event)"
        autocomplete="off"><div id="cmpSugg"></div></div></th>` : "";

  // Leistung
  const pill = s => s.gesamt==null ? `<span class="cmleer">–</span>` : scorePill({score:s.gesamt,
    verlaesslich:s.verlaesslich ?? 1, minutes:s.minutes, charakter:s.charakter});
  const dStamm = (s, k) => st && s!==st && s[k]!=null && st[k]!=null ? cmpDelta(s[k]-st[k]) : "";
  let html = sektion("Leistung", "Δ gegen den Stamm")
    + zeile(`<span title="${GESAMT_VGL_TIP}">Gesamt</span>`, "Fit · Score · Charakter", s=>`<div class="cmkpi" style="gap:9px">${pill(s)}${dStamm(s,"gesamt")}</div>`)
    + zeile("Fit auf der Position", "nach Abzug für Umschulung", s=>`<span class="cmwert">${s.fit??"–"}</span>${
        s.abzug ? `<span class="rbadge um" title="Spielt bisher: ${esc2(s.umschulung||"")}">umschulen −${s.abzug}</span>` : ""}`)
    + zeile("Score", "Moneyball, stilneutral", s=>`<span class="cmwert">${s.mb??"–"}</span>`)
    + zeile("Charakter", "sichtbare Persönlichkeit", s=>s.pers_score==null
        ? `<span class="cmleer" title="Persönlichkeit noch nicht gescoutet">ungescoutet</span>`
        : `<span style="color:${persInk(s.pers_score)}" title="${persTip(s)}">${esc2(persKurz(s.pers_label))}</span> <span class="cmraw" style="display:inline">${s.pers_score}</span>`);

  // Rolle: Kennzahlen in der Reihenfolge des Stamms (sonst des ersten mit Daten)
  const basis = (st && st.teile && st.teile.length ? st : S.find(s=>(s.teile||[]).length)) || {teile:[]};
  const stats = basis.teile.map(t=>t);
  html += sektion(`Rolle · ${esc2(slot.rolle||slot.label||"")}`, "Perzentil · Δ · Rohwert");
  stats.forEach(b=>{
    html += zeile(esc2(b.label), `Gewicht ${Math.round((b.gewicht||0)*100)} %`, s=>{
      const t = (s.teile||[]).find(x=>x.stat===b.stat);
      if(!t || t.pct==null) return `<span class="cmleer">–</span>`;
      const col = t.pct>=50 ? "var(--heat-pos)" : "var(--heat-neg)";
      const ref = st && s!==st ? (st.teile||[]).find(x=>x.stat===b.stat) : null;
      return `<div class="cmkpi"><span class="cmtrack"><i style="width:${Math.max(1,t.pct)}%;background:rgba(${col},.85)"></i></span>
        <b>${t.pct}</b>${cmpDelta(ref && ref.pct!=null ? t.pct-ref.pct : null)}</div><div class="cmraw">${rohwert(t)}</div>`;
    });
  });
  html += zeile("Bilanz", st ? `gegen ${esc2(st.name)}` : "", s=>{
    if(!st || s===st) return `<span class="cmraw" style="font-size:11px">Messlatte</span>`;
    let n=0, besser=0, gw=0, gwB=0;
    stats.forEach(b=>{
      const t=(s.teile||[]).find(x=>x.stat===b.stat), r=(st.teile||[]).find(x=>x.stat===b.stat);
      if(!t || !r || t.pct==null || r.pct==null) return;
      n++; gw += b.gewicht||0;
      if(t.pct>r.pct){ besser++; gwB += b.gewicht||0; }
    });
    if(!n) return `<span class="cmleer">–</span>`;
    return `<div class="cmbilanz"><b>${besser}</b> von ${n} besser</div>
      <div class="cmraw">${Math.round(100*gwB/(gw||1))} % des Gewichts</div>`;
  });

  // Preis
  const istGk = key==="tw";
  html += sektion("Preis", istGk ? "Fair Value bei Torhütern nicht aussagekräftig" : "Markt gegen Schätzwert aus Leistung");
  html += zeile("Marktwert", "", s=>`<span class="cmwert">${fmtMio(marktMio(s))}</span>`)
    + zeile("Fair Value", "", s=>s.fair_urteil==null
        ? `<span class="cmleer" title="${istGk?FAIR_LEER_GK:"kein Schätzwert"}">–</span>`
        : `<span class="cmwert">${fmtMio(s.fair_value_m)}</span>`)
    + zeile("Urteil", `Streuung ×${streuung()} – nur Extremfälle`, s=>s.fair_urteil==null ? `<span class="cmleer">–</span>`
        : `<span class="urteil ${urteilKlasse(s)}" title="${esc2(s.fair_text||"")}">${s.fair_urteil}</span>
           <div class="cmraw">${fairSatz(s.value_delta_pct)}${s.value_reliable===false?" · unsichere Stichprobe":""}</div>`)
    + zeile("Ablöseforderung", "bei eigenen: unsere Forderung", s=>{
        const eigen = s.rolle!=="kandidat" || s.im_kader;
        if(s.transfer_fee===undefined) return `<span class="cmleer" title="kommt mit D2 aus dem Export">–</span>`;
        if(s.transfer_fee==null) return `<span class="cmleer" title="${eigen
          ? "Wir haben keine Forderung festgesetzt"
          : "Der Verein hat keine Forderung festgesetzt – das heißt nicht, dass er unverkäuflich ist"}">keine festgesetzt</span>`;
        return `<span class="cmwert">${fmtMio(s.transfer_fee/1e6)}</span>${eigen ? `<div class="cmraw">unsere Forderung</div>` : ""}`;
      })
    + zeile("Gehalt", "je Woche", s=>s.wage!=null
        ? `<span class="cmwert">${Math.round(s.wage/1000).toLocaleString("de-DE")} k€</span>` : `<span class="cmleer">–</span>`);

  // Profil
  html += sektion("Profil")
    + zeile("Alter", "", s=>`<span class="cmwert">${s.age!=null?Math.round(s.age):"–"}</span>`)
    + zeile("Fuß", "passt er zur Rolle?", s=>(esc2(fussKurz(s.foot)) || `<span class="cmleer">–</span>`)
        + (s.fuss_passung ? `<div class="fusszeile ${FUSS_KLASSE[s.fuss_passung.passung]||""}">${esc2(s.fuss_passung.text)}</div>` : ""))
    + zeile("Spielzeit", "Saison, alle Wettbewerbe", s=>`<span class="cmwert">${Math.round(s.minutes||0).toLocaleString("de-DE")} Min</span>${
        s.verlaesslich!=null ? `<div class="cmraw">Stichprobe ${Math.round(s.verlaesslich*100)} %</div>` : ""}`)
    + zeile("Positionen", "laut Export", s=>s.position ? `<span style="font-size:12px">${esc2(s.position)}</span>` : `<span class="cmleer">–</span>`)
    + zeile("Meldeliste", "Premier League, für uns", s=>plZelle(s)
        + (s.homegrown ? `<div class="cmraw" title="${escAttr(s.homegrown)}">${esc2(hgKurz(s.homegrown))}</div>` : ""))
    + zeile("Verein", "", s=>`${esc2(s.club||"–")}${s.league?`<div class="cmraw">${esc2(s.league)}</div>`:""}`)
    + zeile("Datenstand", "Import", s=>`<span class="cmraw" style="font-size:11px">${datumKurz(s.stand)}</span>`);

  box.innerHTML = kopf
    + `<table class="cmx"><colgroup><col class="lab">${S.map(()=>'<col class="sp">').join("")}${platz?'<col class="sp">':""}</colgroup>
       <thead><tr><th></th>${kopfzellen}${suchkopf}</tr></thead><tbody>${html}</tbody></table>
       <div class="cmfuss">Δ = Abstand zum Stammspieler in Perzentilpunkten. Perzentile gegen
         ${(CMP.vergleichsbasis||0).toLocaleString("de-DE")} Spieler, die diese Position spielen können.
         Gesamt = Fit^0,35 × Score^0,35 × Charakter^0,30 – dieselbe Zahl wie auf dem Brett; ohne
         gescoutete Persönlichkeit √(Fit × Score). Die Ersatzsuche rechnet ohne Score und kann für
         denselben Kandidaten eine andere Gesamtzahl zeigen. Kandidaten kommen über das Suchfeld,
         „+ zum Vergleich“ im Spielerbogen oder die Ersatzsuche dazu.</div>`;
  if(platz && CMP_Q) cmpSuche(CMP_Q, true);
  if(CMP_FOKUS){ const i = document.getElementById("cmpSuche"); if(i) i.focus(); CMP_FOKUS = false; }
}

// Suchfeld im Vergleich: Diakritika weggefaltet wie in der Dossier-Suche
function cmpTreffer(q){
  const n = cardNorm(q.trim());
  if(n.length < 2) return [];
  const drin = new Set((CMP && CMP.spieler || []).map(s=>+s.eid||s.id));
  // Nur Spieler mit EID: ohne Export-Zeile kann das Backend nicht vergleichen
  // („Nicht im Export …") – die Suche soll nicht in diese Sackgasse führen.
  return PLAYERS.filter(p=>p.name && p.eid && cardNorm(p.name).includes(n) && !drin.has(+p.eid))
    .sort((a,b)=>(b.minutes||0)-(a.minutes||0)).slice(0, 8);
}
function cmpSuche(q, still){
  CMP_Q = q; if(!still) CMP_SEL = 0;
  const host = document.getElementById("cmpSugg"); if(!host) return;
  const t = cmpTreffer(q);
  host.innerHTML = t.length ? `<div class="cmsugg">${t.map((p,i)=>
    `<button class="${i===CMP_SEL?"on":""}" onmousedown="event.preventDefault();cmpNimm(${p.id})">${esc2(p.name)}
      <span>${esc2(p.club||"")} · ${esc2(p.pos_label||"?")}</span></button>`).join("")}</div>` : "";
}
function cmpSucheTaste(e){
  const t = cmpTreffer(CMP_Q);
  if(e.key==="ArrowDown"){ CMP_SEL = Math.min(t.length-1, CMP_SEL+1); cmpSuche(CMP_Q, true); e.preventDefault(); }
  else if(e.key==="ArrowUp"){ CMP_SEL = Math.max(0, CMP_SEL-1); cmpSuche(CMP_Q, true); e.preventDefault(); }
  else if(e.key==="Enter" && t[CMP_SEL]){ cmpNimm(t[CMP_SEL].id); e.preventDefault(); }
  else if(e.key==="Escape" && CMP_Q){ e.stopPropagation(); e.target.value=""; cmpSuche(""); }
}
function cmpNimm(id){ CMP_Q = ""; CMP_SEL = 0; CMP_FOKUS = true; addCompare(id); }

function sortBy(k){ if(sortKey===k) sortDesc=!sortDesc; else {sortKey=k; sortDesc=true;} render(); }
function applyRanking(){
  const r = RANKINGS[document.getElementById("ranking").value];
  if(r){ sortKey=r.key; sortDesc=r.desc; render(); }
}

// ---------------- Auto-Scan (Hintergrund, kein Klicken nötig) ----------------
let AUTO_ON = false;
function updateAutoUI(){
  const b=document.getElementById("autoBtn");
  if(b){ b.classList.toggle("on", AUTO_ON); setBtnLabel("autoBtn", AUTO_ON ? "Auto ✓" : "Auto"); }
  const w=document.getElementById("autoPauseWrap"); if(w) w.style.display = AUTO_ON?"flex":"none";
}
async function toggleAuto(){
  AUTO_ON = !AUTO_ON; updateAutoUI();
  const api=API(); if(api) await api.set_auto_scan(AUTO_ON);
  document.getElementById("status").textContent = AUTO_ON
    ? "Auto-Scan aktiv – neue Spieler werden selbstständig nachgeladen…"
    : "Auto-Scan pausiert.";
}
async function setAutoPause(v){ const api=API(); if(api) await api.set_auto_pause(+v); }

// ---- Scouting-Modus: DERSELBE Scan, nur enger getaktet (20 s statt 180 s).
// Ein reiner Namens-Scan lohnt sich nicht – gemessen sind Namensindex 10,8 s
// und Statistiken nur 1,8 s obendrauf; man nimmt also besser alles mit.
// Zaehler und Restlaufzeit kommen aus dem normalen auto_poll().
let COLLECT_ON = false;
function updateCollectUI(){
  const b = document.getElementById("collectBtn");
  if(!b) return;
  b.classList.toggle("on", COLLECT_ON);
  setBtnLabel("collectBtn", COLLECT_ON ? "Scouting ✓" : "Scouting");
}
async function toggleCollect(){
  COLLECT_ON = !COLLECT_ON;
  updateCollectUI();
  const api=API();
  if(api) await api.set_collect(COLLECT_ON);
  document.getElementById("status").textContent = COLLECT_ON
    ? "Scouting-Modus – jetzt in FM Listen durchblättern. Jeder dabei geladene Name wird dauerhaft gemerkt."
    : "Scouting-Modus beendet.";
}

// Die UI POLLT den Auto-Scan-Status (kein Thread->GUI-Push -> kein Freeze).
let AUTO_LAST_ID = -1, AUTO_POLL_TIMER = null, AUTO_BUSY = false;
function startAutoPoll(){ if(!AUTO_POLL_TIMER) AUTO_POLL_TIMER = setInterval(autoPoll, 5000); }
async function autoPoll(){
  const api=API(); if(!api || AUTO_BUSY || DETAIL_ID!=null) return;   // Drawer offen: nicht stören
  let st; try{ st = await api.auto_poll(); }catch(e){ return; }
  AUTO_ON = st.on; updateAutoUI();
  if(COLLECT_ON !== !!st.collect){        // laeuft nach 10 Minuten von selbst aus
    COLLECT_ON = !!st.collect; updateCollectUI();
  }
  if(AUTO_LAST_ID === -1){ AUTO_LAST_ID = st.last_id; return; }       // erster Poll: nur merken
  if(!st.on) return;
  const stat = document.getElementById("status");
  if(st.last_id !== AUTO_LAST_ID && !st.scanning){
    AUTO_LAST_ID = st.last_id; AUTO_BUSY = true;
    // Das Taktikbrett wird EINMAL geholt und dann gehalten – nach einem neuen
    // Snapshot ist es veraltet. Verwerfen, sonst zeigt es alte Minuten weiter.
    TACT = null;
    try{
      if(MODE==="signals") renderSignals();
      else if(MODE==="tactic") await renderTactic();
      else await loadData();
    } finally { AUTO_BUSY = false; }
  }
  if(st.collect){
    // Im Scouting-Modus zaehlt nicht der Snapshot, sondern was dazugelernt wurde
    stat.textContent = `Scouting-Modus · +${st.names_gained} neue Namen · `
      + `${st.names_known} bekannt · noch ${Math.ceil(st.collect_left/60)} Min`
      + (st.scanning ? " · scannt…" : "");
  } else if(st.idle){
    stat.textContent = "Auto-Scan wartet – FM24 nicht erkannt.";
  } else if(st.last_id === AUTO_LAST_ID && !st.scanning){
    // nichts zu melden
  } else {
    stat.textContent = `Auto-Scan · ${new Date().toLocaleTimeString()} · ${PLAYERS.length} Spieler`;
  }
}

async function doScan(){
  const btn=document.getElementById("scanBtn"), st=document.getElementById("status");
  btn.disabled=true; st.innerHTML='<span class="spin"></span> Lese Speicher…';
  try{
    const res = await window.pywebview.api.scan();
    if(!res.ok){ st.textContent = "⚠ "+res.error; btn.disabled=false; return; }
    PLAYERS = res.players;
    TACT = null;               // Brett neu holen, sonst zeigt es alte Minuten
    SRC = "last"; markSrc();   // frischer Scan = letzter Stand
    // Abdeckung mitzeigen: im RAM liegen Statistiken fuer weit mehr Spieler,
    // als wir benennen koennen – genau die Luecke schliesst der Sammelmodus.
    const m = res.meta || {};
    const gap = m.pids_total
      ? ` · ${m.pids_total.toLocaleString("de-DE")} Spieler mit Daten im RAM, benannt ${m.names_known||0}`
      : "";
    st.textContent = `${res.count} Spieler · Snapshot gespeichert · ${new Date().toLocaleTimeString()}${gap}`;
    render();
  }catch(e){ st.textContent="Fehler: "+e; }
  btn.disabled=false;
}

async function init(){
  RANKINGS = await window.pywebview.api.rankings();
  document.getElementById("ranking").innerHTML =
    RANKINGS.map((r,i)=>`<option value="${i}">${r.title}</option>`).join("");
  const s = await window.pywebview.api.get_settings();
  WATCH = (await window.pywebview.api.watchlist()) || {};
  MINMIN = s.min_minutes;
  SIG_MIN = s.sig_min_minutes || 900;
  const auto = await window.pywebview.api.auto_status();
  AUTO_ON = auto.on;
  updateCollectUI();
  document.getElementById("autoPause").value = auto.pause;
  updateAutoUI();
  startAutoPoll();
  // native Titelleiste an das aktuelle Theme angleichen
  window.pywebview.api.set_titlebar(document.documentElement.getAttribute("data-theme")!=="light");
  document.getElementById("minMin").value = s.min_minutes;
  document.getElementById("minMinVal").textContent = s.min_minutes;
  document.getElementById("curMax").value = s.cur_max_min;
  await loadData();
  populateAxes(); updateControls(); applyRanking();
}
window.addEventListener("pywebviewready", init);
// Icons und Theme sofort setzen – unabhaengig davon, ob PyWebView schon da ist
// (sonst steht der Kopf bis zum ersten init() ohne Zeichnungen da).
(function(){ paintIcons();
  let t="dark"; try{ t=localStorage.getItem("fmc_theme")||"dark"; }catch(e){} applyTheme(t); })();
</script>
