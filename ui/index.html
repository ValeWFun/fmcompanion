  /* ===================== Scoutingblock =====================
     Papier & Tinte. Zwei Farblogiken, konsequent getrennt:
       blaue Tinte  = Interaktion (aktiv, ausgewaehlt, Diagramme)
       roter Stempel = Signal (Merkliste, Buy/Sell, Warnung)
     Alles andere ist Papierton. --accent bleibt die Tinte, damit die
     bestehenden Regeln und das JS unveraendert weiterlaufen. */
  :root{
    /* Hell = Formularbogen auf dem Schreibtisch */
    --bg:#d6cfc0; --surface:#faf7ef; --surface2:#efeadd; --border:#c7bfab;
    --text:#231f19; --muted:#6d6455; --dim:#968c78;
    --accent:#2b4a72; --on-accent:#faf7ef;            /* Tintenblau */
    --stamp:#9c3320;                                   /* Stempelrot */
    --rule:#ded6c4;                                    /* Linierung im Bogen */
    --pos:#3d6b3f; --neg:#9c3320; --blue:#2b4a72;
    --zebra:#f4f0e5; --rowhover:#e9e2d2;
    --shadow:0 1px 2px rgba(60,48,28,.14),0 6px 18px rgba(60,48,28,.13);
    --fibre:rgba(70,55,30,.030);
    --heat-pos:61,107,63; --heat-neg:156,51,32;
  }
  :root[data-theme="dark"]{
    /* Dunkel = Durchschlag-/Kohlepapier: warm, nicht blaustichig */
    --bg:#16140f; --surface:#211e18; --surface2:#2b271f; --border:#3d3729;
    --text:#ece4d3; --muted:#a2977f; --dim:#756b58;
    --accent:#8fb3dd; --on-accent:#16140f;
    --stamp:#d4644b;
    --rule:#302b21;
    --pos:#93b87c; --neg:#d4644b; --blue:#8fb3dd;
    --zebra:#1c1914; --rowhover:#2b271f;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.45);
    --fibre:rgba(255,246,224,.022);
    --heat-pos:147,184,124; --heat-neg:212,100,75;
  }
  *{box-sizing:border-box}
  *{scrollbar-color:var(--border) transparent;scrollbar-width:thin}
  ::-webkit-scrollbar{width:12px;height:12px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:7px;border:3px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted)}
  ::-webkit-scrollbar-corner{background:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Segoe UI",system-ui,sans-serif;font-size:14px}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;
    background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
  header h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.3px}
  header h1 span{color:var(--accent)}
  .grow{flex:1}
  button{background:var(--accent);color:var(--on-accent);border:0;padding:9px 16px;
    border-radius:8px;font-weight:600;cursor:pointer;font-size:13px}
  button:hover{filter:brightness(1.08)} button:disabled{opacity:.5;cursor:default}
  button.ghost{background:var(--surface2);color:var(--muted);border:1px solid var(--border);
    padding:8px 11px}
  .status{color:var(--muted);font-size:12.5px}
  .controls{display:flex;gap:10px;align-items:center;padding:12px 20px;flex-wrap:wrap}
  .controls.sub{padding-top:0;gap:14px}
  input[type=range]{accent-color:var(--accent);background:transparent;border:0}
  select,input{background:var(--surface2);color:var(--text);border:1px solid var(--border);
    padding:8px 10px;border-radius:7px;font-size:13px}
  select{min-width:230px} input{min-width:160px}
  #xAxis,#yAxis{min-width:148px}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
  .seg button{background:var(--surface2);color:var(--muted);border:0;border-radius:0;
    padding:8px 15px;font-size:12.5px;font-weight:600}
  .seg button.on{background:var(--accent);color:var(--on-accent)}
  .wrap{padding:0 20px 40px}
  table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;
    background:var(--surface)}
  #tableHost{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);
    border:1px solid var(--border)}
  table thead th:first-child{border-top-left-radius:9px}
  table thead th:last-child{border-top-right-radius:9px}
  th,td{padding:6px 11px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0}
  tbody tr{background:var(--surface)}
  tbody tr:nth-child(even){background:var(--zebra)}
  tbody td:first-child{background:inherit}
  tbody tr:hover,tbody tr:hover td:first-child{background:var(--rowhover)}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;
    letter-spacing:.4px;cursor:pointer;user-select:none;position:sticky;top:63px;background:var(--surface2);z-index:2}
  th:first-child{z-index:3}
  th.active{color:var(--accent)}
  tbody tr:last-child td{border-bottom:0}
  .name{font-weight:600}
  .pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}
  .pill{display:inline-block;min-width:22px;text-align:center;padding:1px 7px;border-radius:20px;
    font-size:12px;font-weight:600}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}
  .empty h2{color:var(--text);font-weight:600;margin:0 0 8px}
  .bar{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;width:52px;display:inline-block;vertical-align:middle}
  .bar > i{display:block;height:100%;background:var(--blue)}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
  @keyframes s{to{transform:rotate(360deg)}}
  .chartwrap{position:relative;padding:10px 0 4px}
  svg.chart{width:100%;height:auto;display:block}
  svg.chart .axis{stroke:var(--border);stroke-width:1}
  svg.chart .grid{stroke:var(--surface2);stroke-width:1}
  svg.chart .avg{stroke:var(--accent);stroke-width:1;stroke-dasharray:5 4;opacity:.55}
  svg.chart .dot{fill:var(--blue);fill-opacity:.72;stroke:var(--bg);stroke-width:1;cursor:pointer}
  svg.chart .dot.hot{fill:var(--accent);fill-opacity:1}
  svg.chart text{fill:var(--muted);font-size:11px}
  svg.chart text.axlabel{fill:var(--text);font-size:12.5px;font-weight:600}
  svg.chart text.avglab{fill:var(--accent);font-size:10px;opacity:.85}
  .tip{position:absolute;display:none;background:var(--surface2);border:1px solid var(--border);
    border-radius:7px;padding:7px 10px;font-size:12px;pointer-events:none;z-index:9;
    color:var(--text);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .tip b{color:var(--accent)}
  tbody tr{cursor:pointer}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20}
  .overlay.on{display:block}
  .drawer{position:fixed;top:0;right:-500px;width:470px;max-width:94vw;height:100vh;
    background:var(--surface);border-left:1px solid var(--border);z-index:21;
    transition:right .22s ease;overflow-y:auto;padding:18px 22px 30px}
  .drawer.open{right:0}
  .dhead{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
  .dhead h2{margin:0;font-size:17px;flex:1}
  .dsub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
  .xbtn{background:var(--surface2);color:var(--muted);border:1px solid var(--border);
    padding:4px 10px;border-radius:6px;font-weight:600}
  .dsec{margin:16px 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);padding-bottom:5px}
  .pbar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12.5px}
  .pbar .plab{width:132px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pbar .ptrack{flex:1;height:9px;background:var(--surface2);border-radius:5px;overflow:hidden}
  .pbar .ptrack i{display:block;height:100%;border-radius:5px}
  .pbar b{width:34px;text-align:right;font-size:12px}
  .sparkrow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
  .sparkrow .plab{width:70px;color:var(--muted)}
  .sparkrow svg{background:var(--surface2);border-radius:5px}
  .sparkrow b{font-size:12px}
  .seas{width:100%;font-size:12.5px;border-collapse:collapse}
  .seas th,.seas td{padding:4px 7px;border-bottom:1px solid var(--border);text-align:right;position:static}
  .seas th{font-size:10.5px;top:auto;background:transparent;cursor:default}
  .seas th:first-child,.seas td:first-child{text-align:left;position:static;background:transparent}
  .cur{color:var(--accent);font-weight:700}
  .wbtns{display:flex;gap:7px;margin:8px 0}
  .wbtn{background:var(--surface2);color:var(--muted);border:1px solid var(--border);
    padding:6px 12px;border-radius:6px;font-size:12.5px;font-weight:600}
  .wbtn.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .wnote{width:100%;margin-top:6px}
  .comparebar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:19;
    background:var(--surface2);border:1px solid var(--border);border-radius:10px;
    padding:8px 12px;display:none;gap:8px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.45)}
  .comparebar.on{display:flex}
  .chip{background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:3px 10px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
  .chip i{font-style:normal;cursor:pointer;color:var(--muted)}
  .cmpmodal{position:fixed;inset:0;z-index:22;display:none;align-items:center;justify-content:center}
  .cmpmodal.on{display:flex}
  .cmpbox{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    width:640px;max-width:94vw;max-height:88vh;overflow-y:auto;padding:20px 24px}
  .cmpbox h2{margin:0 0 4px;font-size:16px}
  .cmpbar{display:flex;align-items:center;gap:8px;margin:2px 0;font-size:12px}
  .cmpbar .plab{width:132px;color:var(--muted)}
  .cmpbar .ptrack{flex:1;height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
  .cmpbar b{width:30px;text-align:right;font-size:11.5px}
  .legend{display:flex;gap:12px;margin:8px 0 14px;font-size:12.5px;flex-wrap:wrap}
  .legend .dotc{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
  .srcbadge{font-size:9.5px;font-weight:700;color:var(--blue);border:1px solid var(--blue);
    border-radius:4px;padding:0 3px;vertical-align:middle;opacity:.85}
  .star{cursor:pointer;font-size:13px;user-select:none;transition:transform .1s}
  .star:hover{transform:scale(1.25)}
  .sighead{display:flex;align-items:center;justify-content:space-between;gap:20px;
    flex-wrap:wrap;padding:6px 0 4px}
  table.sigtbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-bottom:8px}
  table.sigtbl th,table.sigtbl td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
  table.sigtbl th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;text-align:right}
  table.sigtbl th:first-child,table.sigtbl td:first-child{text-align:left}
  table.sigtbl tbody tr:hover{background:var(--surface)}
  td.reason{white-space:normal;text-align:left;min-width:260px;max-width:420px;
    font-size:12px;color:var(--muted);line-height:1.4}
  td.reason.pos{border-left:3px solid var(--pos)}
  td.reason.neg{border-left:3px solid var(--neg)}
  .cardwrap{display:flex;gap:26px;flex-wrap:wrap;padding:14px 0 40px}
  .cardstage{display:flex;flex-direction:column;gap:12px;align-items:center}
  .cardsvg{width:340px;max-width:88vw;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
  .cardpanel{flex:1;min-width:300px;max-width:520px}
  .cardpanel .dsec{margin-top:14px}
  .fieldrow{display:flex;gap:10px;align-items:center;margin:7px 0;font-size:12.5px}
  .fieldrow label{width:118px;color:var(--muted)}
  .fieldrow input[type=text],.fieldrow input[type=number],.fieldrow select{flex:1;min-width:0}
  .fieldrow input[type=range]{flex:1;min-width:0}
  .statedit{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:4px}
  .statedit .se{display:flex;gap:6px;align-items:center;font-size:12px}
  /* min-width:0 noetig: die Grundregel input{min-width:160px} wuerde die
     schmalen Felder aufblasen und die Editor-Zeile ueber den Rand schieben */
  .statedit .se input.lab{width:52px;min-width:0;text-transform:uppercase}
  .statedit .se input.val{width:52px;min-width:0}
  .statedit .se input[type=range]{flex:1;min-width:40px}
  .tierpick{display:flex;gap:6px;flex-wrap:wrap}
  .tierpick button{padding:6px 12px;border:1px solid var(--border);border-radius:7px;
    background:var(--surface2);color:var(--text);font-size:12px}
  .tierpick button.on{outline:2px solid var(--accent)}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:20px;padding:8px 0 40px}
  .galitem{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
  .galitem .cardsvg{width:100%;cursor:pointer}
  .galmeta{display:flex;flex-direction:column;gap:6px}
  .galmeta input{width:100%;font-weight:600}
  .galbtns{display:flex;gap:6px}
  .galbtns button{flex:1;font-size:11.5px;padding:5px 8px}
  .galsub{color:var(--muted);font-size:11px}

  /* ============ Scoutingblock – Design-Overrides ============
     Drei Schriften mit klaren Aufgaben, das ist der Kern des Entwurfs:
       --mono  = Formular-Furnitur (Spaltenkoepfe, Feldbezeichner, Kennungen)
       --sans  = Inhalt (Namen, Zahlen, Fliesstext)
       --serif = Blattueberschriften, wie der Kopf eines gedruckten Bogens
     Ecken sind eckig (Papier hat keine 8px-Radien), Flaechen sind Blaetter mit
     Schlagschatten statt Kaesten mit Rahmen. */
  :root{
    --mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
    --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
    --serif:"Iowan Old Style",Constantia,Cambria,Georgia,serif;
  }
  body{font-family:var(--sans);font-size:13.5px;letter-spacing:0;
    -webkit-font-smoothing:antialiased;
    /* Papierfaser: zwei sehr schwache Schraffuren, kein Bild */
    background-image:
      repeating-linear-gradient(93deg, var(--fibre) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(3deg,  var(--fibre) 0 1px, transparent 1px 4px)}
  .mono,th,.badge,.pospill,.dsec,.srcbadge,.galsub,td.reason,
  .controls .status,header .status,.seas th{font-family:var(--mono)}

  /* ---- Kopf = Formularkopf mit doppelter Abschlusslinie ---- */
  header{height:56px;padding:0 22px;background:var(--surface);gap:14px;
    border-bottom:3px double var(--border)}
  .brand{display:flex;align-items:baseline;gap:10px}
  .logomark{width:23px;height:23px;border:1.5px solid var(--text);border-radius:0;
    display:inline-flex;align-items:center;justify-content:center;color:var(--text);
    font-family:var(--mono);font-weight:700;font-size:12px;line-height:1;
    align-self:center}
  .wordmark{font-family:var(--serif);font-weight:600;font-size:20px;
    letter-spacing:.2px;color:var(--text)}
  /* Aktenzeichen-Stempel: nur Kontur, roter Stempel – die einzige rote Marke im Kopf */
  .badge{font-size:8.5px;font-weight:700;letter-spacing:1.4px;color:var(--stamp);
    background:transparent;border:1.5px solid var(--stamp);border-radius:2px;
    padding:2px 5px;align-self:center}
  header .status{color:var(--muted);font-size:11.5px}

  /* ---- Schaltflaechen: Hauptaktion gestempelt, Rest Formularfelder ---- */
  button{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);
    border-radius:2px;font-family:var(--mono);font-weight:700;font-size:11.5px;
    letter-spacing:.7px;text-transform:uppercase;padding:8px 15px}
  button:hover{filter:brightness(1.12)}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--border);
    font-weight:500;letter-spacing:.5px;padding:7px 11px;display:inline-flex;
    align-items:center;gap:6px}
  button.ghost:hover{color:var(--text);border-color:var(--text);background:transparent}
  button.ghost.on{color:var(--accent);border-color:var(--accent)}
  .ico{display:inline-flex;align-items:center;flex:none}
  .ico svg{width:13px;height:13px;display:block}
  #themeBtn{padding:7px 9px}

  /* ---- Eingabefelder = ausgefuellte Formularzeilen ---- */
  select,input{background:var(--surface);border:1px solid var(--border);color:var(--text);
    font-family:var(--sans);border-radius:2px;font-size:12.5px;padding:6px 9px}
  select:focus,input:focus{outline:none;border-color:var(--accent);
    box-shadow:inset 0 -2px 0 var(--accent)}
  input[type=range]{accent-color:var(--accent);border:0;background:transparent}
  input[type=checkbox]{min-width:0;width:auto;padding:0;margin:0;
    accent-color:var(--accent);vertical-align:middle}
  #seasonInfo{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:700}

  /* ---- Segmente ---- */
  .seg{border:1px solid var(--border);border-radius:2px;background:var(--surface)}
  .seg button{background:transparent;color:var(--muted);font-weight:500;font-size:11px;
    border:0;border-left:1px solid var(--border);padding:7px 13px}
  .seg button:first-child{border-left:0}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:var(--accent);color:var(--on-accent);font-weight:700}

  /* ---- Positions-Reiter = Registerkarten eines Karteikastens ---- */
  #tabSeg{border:0;border-radius:0;background:transparent;overflow:visible;
    flex-basis:100%;border-bottom:1.5px solid var(--border);gap:3px;padding-left:2px}
  #tabSeg button{background:transparent;color:var(--muted);border:1px solid transparent;
    border-bottom:0;border-radius:3px 3px 0 0;padding:7px 15px;margin-bottom:-1.5px;
    font-size:11px;letter-spacing:.8px}
  #tabSeg button:hover{color:var(--text)}
  #tabSeg button.on{background:var(--surface);color:var(--text);font-weight:700;
    border-color:var(--border);box-shadow:0 -2px 0 var(--accent) inset}

  /* ---- Feldbezeichner: versal und schmal, wie auf einem Vordruck ---- */
  th{background:var(--surface);color:var(--muted);font-size:10px;font-weight:500;
    letter-spacing:.9px;top:56px;border-bottom:1.5px solid var(--border);padding:9px 11px}
  th.active{color:var(--accent);font-weight:700}
  .dsec{color:var(--muted);letter-spacing:.9px;font-size:10px;font-weight:500;
    border-bottom:1.5px solid var(--border)}
  .controls .status{color:var(--muted);text-transform:none;letter-spacing:0;font-size:11.5px}

  /* ---- Der Bogen: Blatt mit Schatten, eckig, zart liniert ---- */
  #tableHost{background:var(--surface);border:0;border-radius:2px;box-shadow:var(--shadow)}
  table thead th:first-child,table thead th:last-child{border-radius:0}
  th,td{border-bottom:1px solid var(--rule)}
  .name{font-weight:600;color:var(--text);letter-spacing:-.1px}
  td{font-variant-numeric:tabular-nums lining-nums}
  .pill{border-radius:2px;font-weight:600;padding:2px 8px;font-size:12px;
    font-family:var(--mono)}
  .bar,.pbar .ptrack,.pbar .ptrack i,.cmpbar .ptrack,.sparkrow svg{border-radius:1px}

  /* ---- Positionskuerzel: gestempelt, nur Kontur, keine Fuellung ---- */
  .pospill{display:inline-block;padding:1px 6px;border-radius:2px;font-size:10px;
    font-weight:700;letter-spacing:.9px;border:1.2px solid currentColor;
    background:transparent;white-space:nowrap;opacity:.9}
  .pg-def{color:#3d6b3f} .pg-mid{color:#2b4a72} .pg-off{color:#8a6420}
  .pg-st{color:#9c3320}  .pg-tw{color:#5b4a8a}
  .pg-unk{color:var(--dim)}
  :root[data-theme="dark"] .pg-def{color:#93b87c}
  :root[data-theme="dark"] .pg-mid{color:#8fb3dd}
  :root[data-theme="dark"] .pg-off{color:#cba55f}
  :root[data-theme="dark"] .pg-st{color:#d4644b}
  :root[data-theme="dark"] .pg-tw{color:#a795cf}

  /* ---- Signale = Stempelaufdruck (quadratisch, kein Leuchten) ---- */
  .sigdot{display:inline-block;width:8px;height:8px;border-radius:0;
    vertical-align:middle;margin-right:5px;box-shadow:none}
  .sigdot.buy{background:var(--pos);box-shadow:none}
  .sigdot.sell{background:var(--stamp);box-shadow:none}
  table.sigtbl th{color:var(--muted)}
  table.sigtbl th,table.sigtbl td{border-bottom:1px solid var(--rule)}
  table.sigtbl tr.sigrow.pos td:first-child{box-shadow:inset 3px 0 0 var(--pos)}
  table.sigtbl tr.sigrow.neg td:first-child{box-shadow:inset 3px 0 0 var(--stamp)}
  td.reason{font-size:11.5px;line-height:1.5}
  .star{color:var(--stamp)}

  /* ---- Beobachtungsbogen (Drawer) + Vergleich ---- */
  .drawer{background:var(--surface);border-left:0;box-shadow:-14px 0 34px rgba(0,0,0,.20)}
  .dhead h2{font-family:var(--serif);font-weight:600;font-size:25px;letter-spacing:0}
  .dsub{font-family:var(--mono);font-size:11.5px}
  .xbtn,.wbtn,.tierpick button{font-family:var(--mono);border-radius:2px;
    font-size:11px;letter-spacing:.5px}
  .wbtn.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .cmpbox,.tip,.comparebar{border-radius:2px}
  .cmpbox h2{font-family:var(--serif);font-weight:600;font-size:20px}
  .chip{border-radius:2px;font-family:var(--mono);font-size:11px}
  .srcbadge{border-radius:2px;font-size:9px}

  /* ---- Karteikarten ---- */
  .galitem{border-radius:2px;border:0;box-shadow:var(--shadow);background:var(--surface)}
  .cardsvg{filter:drop-shadow(0 6px 16px rgba(60,48,28,.28))}
  /* Spielerauswahl im Dossier: Suchfeld ueber dem Dropdown, gleiche Breite
     wie die Karte darunter */
  .cardpick{display:flex;flex-direction:column;gap:6px;width:340px;max-width:88vw}
  .cardpick input,.cardpick select{width:100%;min-width:0}
  .cardpick #cardCount{font-family:var(--mono);font-size:10.5px;letter-spacing:.3px}
  .galsub{font-size:10.5px}

  /* ---- Diagramm: Achsenbeschriftung in Mono, Rest Tinte ---- */
  svg.chart text{font-family:var(--mono)}
  svg.chart .avg{stroke-dasharray:4 3}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="logomark">FM</span>
    <span class="wordmark">Scoutingbericht</span>
    <span class="badge">MONEYBALL</span>
  </div>
  <div class="grow"></div>
  <span class="status" id="status">Bereit.</span>
  <button id="importBtn" class="ghost" onclick="doImport()" title="FM-HTML-Export importieren (Scouting-Ziele + Marktwerte)"><span class="ico" data-ico="import"></span>Import</button>
  <button id="collectBtn" class="ghost" onclick="toggleCollect()" title="Scouting-Modus für 10 Minuten: scannt alle 20 s statt alle 3 Minuten. Währenddessen in FM Listen (Liga-Statistik, Scouting, Kader) durchblättern – jeder dabei geladene Name wird dauerhaft gemerkt, seine Statistiken liegen ohnehin im RAM und aktualisieren sich danach von selbst."><span class="ico" data-ico="collect"></span><span class="lbl">Scouting</span></button>
  <button id="autoBtn" class="ghost" onclick="toggleAuto()" title="Auto-Scan: liest den RAM selbstständig – kein Klicken nötig"><span class="ico" data-ico="auto"></span><span class="lbl">Auto</span></button>
  <button id="themeBtn" class="ghost" onclick="toggleTheme()" title="Hell / Dunkel"><span class="ico" data-ico="sun"></span></button>
  <button id="scanBtn" onclick="doScan()">Kader scannen</button>
</header>

<div class="controls">
  <div class="seg" id="tabSeg">
    <button class="on" data-tab="all" onclick="setTab('all')">Alle</button>
    <button data-tab="def" onclick="setTab('def')">Abwehr</button>
    <button data-tab="mid" onclick="setTab('mid')">Mittelfeld</button>
    <button data-tab="off" onclick="setTab('off')">Offensiv</button>
    <button data-tab="st" onclick="setTab('st')">Sturm</button>
    <button data-tab="tw" onclick="setTab('tw')">Torhüter</button>
    <button data-tab="unk" title="Position nicht im RAM lesbar" onclick="setTab('unk')">?</button>
  </div>
  <div class="seg" id="modeSeg">
    <button class="on" data-mode="table" onclick="setMode('table')">Tabelle</button>
    <button data-mode="chart" onclick="setMode('chart')">Chart</button>
    <button data-mode="signals" onclick="setMode('signals')">Signale</button>
    <button data-mode="cards" onclick="setMode('cards')">Dossier</button>
  </div>
  <button id="watchFilter" class="wbtn" onclick="toggleWatchFilter()" title="Nur Merkliste zeigen">★ Merkliste</button>
  <button id="u21Filter" class="wbtn" onclick="toggleU21()" title="Nur Spieler bis 21 Jahre. Das Alter kommt jetzt aus dem Geburtsdatum im RAM, nicht mehr nur aus Exporten.">U21</button>
  <select id="ranking" onchange="applyRanking()"></select>
  <span id="axisSel" style="display:none;gap:6px;align-items:center">
    <label class="status" style="display:flex;gap:5px;align-items:center">X
      <select id="xAxis" onchange="setAxis()"></select></label>
    <label class="status" style="display:flex;gap:5px;align-items:center">Y
      <select id="yAxis" onchange="setAxis()"></select></label>
  </span>
  <input id="search" type="search" placeholder="Spieler suchen…" oninput="render()">
</div>

<div class="controls sub">
  <div class="seg" id="srcSeg" title="Pool = je Spieler der neueste Stand aus allen Scans (wächst mit jedem Scouting-Scan)">
    <button class="on" data-src="last" onclick="setSrc('last')">Letzter Scan</button>
    <button data-src="pool" onclick="setSrc('pool')">Pool</button>
  </div>
  <label class="status" style="display:flex;gap:8px;align-items:center">
    ab <b id="minMinVal" style="min-width:26px;text-align:right">45</b> Min
    <input type="range" id="minMin" min="0" max="450" step="15" value="45"
           style="width:130px;min-width:130px;padding:0"
           oninput="minMinInput(this.value)" onchange="minMinCommit(this.value)">
  </label>
  <label class="status" style="display:flex;gap:6px;align-items:center"
         title="Die laufende Saison wird an den Einsatzzahlen erkannt – mehr Einsätze als gespielte Spieltage kann niemand haben. Nur abschalten, wenn die Erkennung danebenliegt.">
    <input type="checkbox" id="seasonAuto" onchange="seasonAutoChanged(this.checked)">
    Saison automatisch
    <b id="seasonInfo"></b>
  </label>
  <label class="status" id="curMaxWrap" style="display:none;gap:6px;align-items:center"
         title="Rückfall ohne Automatik: Records mit mehr Saison-Minuten gelten als Altsaison. Im Saisonverlauf erhöhen (z.B. Winter: 2000, Saisonende: 4000).">
    Saison-Limit
    <input type="number" id="curMax" min="90" max="6000" step="90"
           style="width:84px;min-width:84px" onchange="curMaxChanged(this.value)">
    Min
  </label>
  <label class="status" id="autoPauseWrap" style="display:none;gap:6px;align-items:center"
         title="Pause zwischen den automatischen Scans (kürzer = aktueller, aber mehr Last)">
    Auto-Scan alle
    <input type="number" id="autoPause" min="3" max="600" step="5"
           style="width:64px;min-width:64px" onchange="setAutoPause(this.value)"> s
  </label>
  <span class="status" id="count"></span>
</div>

<div class="wrap">
  <div id="tableHost"></div>
</div>

<div id="overlay" class="overlay" onclick="closeAll()"></div>
<aside id="drawer" class="drawer"></aside>
<div id="compareBar" class="comparebar"></div>
<div id="cmpModal" class="cmpmodal" onclick="if(event.target===this)closeCompare()">
  <div class="cmpbox" id="cmpBox"></div>
</div>

<script>
// Strichzeichnungen statt Emoji – Emoji-Icons sind der auffaelligste Bruch mit
// dem Papier-Entwurf (und der deutlichste Generator-Verdacht). currentColor,
// damit sie die Tinte des jeweiligen Zustands uebernehmen.
const SVG = (d,extra="") => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" `
  + `stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
const ICON = {
  import: SVG(`<path d="M8 2v7m0 0 2.8-2.8M8 9 5.2 6.2"/><path d="M2.5 11v2.5h11V11"/>`),
  collect: SVG(`<circle cx="8" cy="8" r="5.6"/><circle cx="8" cy="8" r="1.7"/><path d="M8 .8v1.8M8 13.4v1.8M.8 8h1.8M13.4 8h1.8"/>`),
  auto:   SVG(`<path d="M13.4 8a5.4 5.4 0 1 1-1.75-4"/><path d="M13.6 2.5v3.1h-3.1"/>`),
  sun:    SVG(`<circle cx="8" cy="8" r="3"/><path d="M8 1.1v1.5M8 13.4v1.5M1.1 8h1.5M13.4 8h1.5M3.1 3.1l1.1 1.1M11.8 11.8l1.1 1.1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1"/>`),
  moon:   SVG(`<path d="M13.4 9.7A5.9 5.9 0 0 1 6.3 2.6a5.9 5.9 0 1 0 7.1 7.1Z"/>`),
};
/** Fuellt alle <span class="ico" data-ico="…"> mit ihrer Zeichnung. */
function paintIcons(root){
  (root||document).querySelectorAll(".ico[data-ico]").forEach(s=>{
    s.innerHTML = ICON[s.dataset.ico] || ""; });
}
/** Beschriftung einer Kopfzeilen-Schaltflaeche aendern, ohne das Icon zu verlieren. */
function setBtnLabel(id, text){
  const b=document.getElementById(id), l=b&&b.querySelector(".lbl");
  if(l) l.textContent = text;
}

let PLAYERS = [];
let RANKINGS = [];

function tabMatch(p){
  const t = TABS[TAB];
  if(t.gk) return !!p.is_gk;
  if(TAB === "all") return !p.is_gk;
  return (p.pos_groups||[]).includes(t.group);
}

function fmt(v){ return (typeof v==="number" && !Number.isInteger(v)) ? v.toFixed(2) : v; }

// Hell/Dunkel
function applyTheme(t){

// Excel-Heat: Metrik-Zellen relativ zur Spalte einfaerben (0=weniger ist besser)
const HEAT_COLS = {goals:0,assists:0,xg:0,xa:0,shots_on:0,dribbles:0,duels:0,
  prog_passes:0,press_win:0,interceptions:0,clearances:0,headers_won:0,apps:0,
  pass_pct:0,duel_pct:0,header_pct:0,shot_acc:0,xga:0,
  losses:1,fouls:1,conceded:1};
let HEAT = {};
function heatStyle(v,lo,hi,invert){
  if(hi<=lo) return "";
  let t=(v-lo)/(hi-lo); if(invert) t=1-t;
  const a=(Math.abs(t-0.5)*0.5).toFixed(2);
  return `background:rgba(var(${t>=0.5?"--heat-pos":"--heat-neg"}),${a})`;
}
function heatTd(key, inner, v){
  if(key in HEAT_COLS && HEAT[key])
    return `<td style="${heatStyle(+v||0, HEAT[key][0], HEAT[key][1], HEAT_COLS[key])}">${inner}</td>`;
  return `<td>${inner}</td>`;
}

function cell(p, key){
  if(key==="name"){
    const rel = p.reliability!=null ? p.reliability : 1;
    const dim = rel < 0.34 ? ' title="kleine Stichprobe" style="opacity:.6"' : '';
    // im Pool-Modus: aeltere Staende mit "Stand vom"-Datum kennzeichnen
    const stale = (SRC==="pool" && p.stale && p.taken_at)
      ? ` <span class="muted" style="font-size:11px" title="Stand vom ${p.taken_at.replace('T',' ')}">· ${p.taken_at.slice(8,10)}.${p.taken_at.slice(5,7)}.</span>`
      : "";
    const badge = p.source==="export"
      ? ` <span class="srcbadge" title="aus FM-Export (nicht im RAM), Stand ${(p.exp_at||'').slice(0,10)}">Exp</span>` : "";
    return `<td class="name">${starHtml(p)}<span${dim}>${p.name}</span>${badge}${stale}</td>`;
  }
  if(key==="pos_label"){
    const g = p.is_gk ? "tw" : ((p.pos_groups||[])[0] || "unk");
    return `<td><span class="pospill pg-${g}">${p.pos_label||"?"}</span></td>`;
  }
  if(key==="age") return `<td>${p.age?Math.round(p.age):"–"}</td>`;
  if(key==="value_m") return `<td>${p.value_m!=null?p.value_m+" M€":'<span class="muted">–</span>'}</td>`;
  if(key==="value_score"){
    if(p.value_score==null) return `<td class="muted">–</td>`;
    const v=p.value_score, a=Math.min(0.5, v/6*0.5).toFixed(2);
    return `<td style="background:rgba(var(--heat-pos),${a})">${v}</td>`;
  }
  if(key==="score"){
    if(p.score==null) return `<td class="muted" title="Keine Positionsgruppe – kein Score">–</td>`;
    const v=p.score, col = v>=50 ? "var(--heat-pos)" : "var(--heat-neg)";
    const a = (0.14 + Math.abs(v-50)/50*0.50).toFixed(2);
    const parts=(p.score_parts||[]).map(sp=>`${sp.label}: P${sp.pct} × ${sp.w}`).join("&#10;");
    const liga = p.league ? `${p.league} (Koeff. ${p.league_coeff})` : "unbekannt (Koeff. 1.0)";
    const tip = `Profil: ${p.profile_label||"?"}&#10;${parts}&#10;Liga: ${liga}&#10;Perzentile relativ zum Pool, /90-Raten geshrinkt (min/(min+180)) × Liga-Koeffizient`;
    return `<td><span class="pill" title="${tip}" style="background:rgba(${col},${a})">${v}</span></td>`;
  }
  if(key==="reason") return `<td class="reason">${p.reason||""}</td>`;
  if(key==="finishing" || key==="goals_prevented"){
    const v = p[key] ?? 0;
    const cls = v>0.3?"pos":(v<-0.3?"neg":"muted");
    const s = v>0?`+${v.toFixed(2)}`:v.toFixed(2);
    return `<td class="${cls}">${s}</td>`;
  }
  if(key==="xga") return `<td>${(p.xga??0).toFixed(2)}</td>`;
  if(key==="rating"){
    const v = p.rating ?? 0;
    if(!v) return `<td class="muted">–</td>`;
    const cls = v>=7.5?"pos":(v<6.5?"neg":"");
    return `<td class="${cls}">${v.toFixed(2)}</td>`;
  }
  if(key==="talent"||key==="prospect"){
    // ohne Geburtsdatum kein Altersvergleich – das ist "unbekannt", nicht 0
    if(p[key]==null) return `<td class="muted" title="Kein Geburtsdatum im RAM gefunden – ohne Alter kein Vergleich mit dem Jahrgang">–</td>`;
    const v=p[key], a=(0.10+v/100*0.45).toFixed(2);
    return `<td><span class="pill" title="Perzentil im Altersband ${p.age_band||"?"} auf seiner Position (${p.age||"?"} Jahre)" style="background:rgba(var(--heat-pos),${a})">${v}</span></td>`;
  }
  if(key==="conceded"||key==="apps"||key==="fouls") return heatTd(key, p[key]??0, p[key]);
  if(key==="pass_pct"||key==="duel_pct"||key==="shot_acc"||key==="header_pct"||key==="press_pct")
    return heatTd(key, (p[key]??0)+"%", p[key]);
  return heatTd(key, fmt(p[key]??0), p[key]);
}

function filteredRows(){
  const q = (document.getElementById("search").value||"").toLowerCase();
  return PLAYERS.filter(p => tabMatch(p)
    && p.name.toLowerCase().includes(q)
    && (p.minutes||0) >= MINMIN
    && (!WATCHFILTER || WATCH[p.id])
    && (!U21ONLY || (p.age && p.age<=21)));
}

  document.getElementById("watchFilter").classList.toggle("on", WATCHFILTER);
  render();
}
function toggleU21(){

}
async function doImport(){
  const api=API(); if(!api){ alert("Nur in der App verfügbar."); return; }
  const st=document.getElementById("status");
  st.innerHTML='<span class="spin"></span> Import läuft…';

const STAR_COL = {kaufen:"var(--pos)", verkaufen:"var(--neg)", beobachten:"var(--accent)"};
function starHtml(p){
  if(p.id==null) return "";
  const w = WATCH[p.id];
  const col = w ? STAR_COL[w.status]||"var(--accent)" : "var(--border)";
  const t = w ? `Merkliste: ${w.status}` : "zur Merkliste (beobachten)";
  return `<span class="star" title="${t}" style="color:${col}" onclick="event.stopPropagation();toggleStar(${p.id})">★</span> `;
}
async function toggleStar(id){
  if(WATCH[id]) delete WATCH[id]; else WATCH[id]={status:"beobachten", note:""};
  const api=API(); if(api) await api.watchlist_set(id, WATCH[id]?"beobachten":"", "");
  if(DETAIL_ID===id) renderDetail();
  render();
}

function render(){
  if(MODE === "cards"){ document.getElementById("count").textContent=""; renderCards(); return; }
  if(MODE === "signals"){ document.getElementById("count").textContent=""; renderSignals(); return; }
  const t = TABS[TAB];
  const host = document.getElementById("tableHost");
  const rows = filteredRows();
  maxDuels = Math.max(1,...PLAYERS.map(p=>p.duels||0));
  if(!rows.length){
    const hint = !PLAYERS.length
      ? "Starte Football Manager, lade dein Savegame und klicke „Spiel scannen\"."
      : t.gk ? "Keine Torhüter im Scan. Öffne im Spiel deine Keeper (Kader/Profil) und scanne erneut."
      : TAB==="unk" ? "Alle Spieler konnten einer Position zugeordnet werden."
      : "Keine Spieler in dieser Gruppe (Position wird aus dem RAM gelesen, sobald sie gespielt haben).";
    host.innerHTML = `<div class="empty"><h2>Keine Daten</h2>${hint}</div>`;
    document.getElementById("count").textContent = "";
    return;
  }
  document.getElementById("count").textContent = `${rows.length} · ${t.title}`;
  if(MODE === "chart") renderChart(rows);
  else renderTable(rows, t.cols);
}

const SIG_COLS = [NAME,POS,MIN,C_SC,C_NOTE,C_GOALS,["xg","xG"],["finishing","Δ xG"],
                  ["reason","Begründung"]];
async function renderSignals(){
  const host = document.getElementById("tableHost");
  const api = API();
  host.innerHTML = `<div class="sighead">
    <div class="dsec" style="border:0;margin:0">Handels-Signale
      <span class="muted" style="text-transform:none;letter-spacing:0"> · erst ab belastbarer Stichprobe</span></div>
    <label class="status" style="display:flex;gap:8px;align-items:center">
      Mindest-Minuten <b id="sigVal">${SIG_MIN}</b>
      <input type="range" id="sigMin" min="180" max="3420" step="90" value="${SIG_MIN}"
             style="width:200px;min-width:200px;padding:0"
             oninput="document.getElementById('sigVal').textContent=this.value"
             onchange="setSigMin(this.value)">
    </label></div>
    <div id="sigBody" class="muted" style="padding:20px 0">lade…</div>`;
  if(!api){ document.getElementById("sigBody").textContent="nur in der App verfügbar."; return; }
  const s = await api.signals(SIG_MIN);
  const body = document.getElementById("sigBody");
  if(!s.eligible){
    body.innerHTML = `<div class="empty"><h2>Noch zu früh für Signale</h2>
      Kein Spieler hat die ${SIG_MIN} Minuten erreicht (höchster Wert: <b>${s.max_minutes}</b> Min,
      ~${Math.round(s.max_minutes/90)} Spiele). Das ist Absicht: Über-/Unterperformance nach wenigen
      Spielen ist meist Glück oder Pech. Schiebe den Regler zum Ausprobieren nach unten – für echte
      Kauf-/Verkaufsentscheidungen lass ihn bei ~900+.</div>`;
    return;
  }
  const tbl = (title, hint, rows, kind) => {
    if(!rows.length) return `<div class="dsec">${title}</div>
      <div class="muted" style="padding:6px 0 16px">Keine Kandidaten über ${SIG_MIN} Min.</div>`;
    const head = SIG_COLS.map(([k,l])=>`<th>${l}</th>`).join("");
    const trs = rows.map(p=>{
      PLAYERS_BY_ID[p.id]=p;   // fuer Detail/Watchlist verfuegbar machen
      return `<tr class="sigrow ${kind}" onclick="openSignalDetail(${p.id})">${SIG_COLS.map(([k])=>
        k==="reason"?`<td class="reason ${kind}">${p.reason}</td>`:cell(p,k)).join("")}</tr>`;
    }).join("");
    return `<div class="dsec">${title} <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">${hint}</span></div>
      <table class="sigtbl"><thead><tr>${head}</tr></thead><tbody>${trs}</tbody></table>`;
  };
  body.innerHTML =
    tbl(`<span class="sigdot buy"></span> Kaufen – Pechvögel (${s.buy.length})`,
        "viele Chancen (xG/90-P ≥ 60), aber Tore < xG − 0.8 → günstig", s.buy, "pos")
    + tbl(`<span class="sigdot sell"></span> Verkaufen – Überperformer (${s.sell.length})`,
        "Tore > xG + 1.5 → Wert am Peak", s.sell, "neg")
    + `<div class="muted" style="font-size:11.5px;margin-top:10px">
        Basis: Pool (neuester Stand je Spieler), ${s.eligible} von ${s.total} Feldspielern über ${SIG_MIN} Min.</div>`;
}
let PLAYERS_BY_ID = {};
function openSignalDetail(id){ const p=PLAYERS_BY_ID[id]; if(p){ if(!PLAYERS.find(q=>q.id===id)) PLAYERS.push(p); openDetail(id);} }
async function setSigMin(v){
  SIG_MIN = +v;
  const api=API(); if(api) await api.set_setting("sig_min_minutes", +v);
  renderSignals();
}

let CARD = null, CARD_PID = null, CARD_SEASONS = [], CARD_VIEW = "edit";
// Tier = Wissensstand über den Spieler (nicht Metall): steigt mit dem Score
// Wissensstaende als Karteikarten-Sorten: Kartonton + Tinte des Eintrags.
// Kein Verlauf, kein Metallic – der Unterschied liegt im Papier und im Stempel.
const TIERS = {
  roh:      {name:"Rohdaten",  paper:"#eee8da", txt:"#2a251c", accent:"#7b7263", rule:"#cfc5ae"},
  gesichtet:{name:"Gesichtet", paper:"#e8eef2", txt:"#1d2833", accent:"#2b4a72", rule:"#bfcedb"},
  beobachtet:{name:"Beobachtet",paper:"#e7eee2", txt:"#1f2a1d", accent:"#3d6b3f", rule:"#c2d3bd"},
  prioritaet:{name:"Priorität",paper:"#f3e7e0", txt:"#2e1d17", accent:"#9c3320", rule:"#dcc0b3"},
};
const TIER_MIGRATE = {bronze:"roh", silber:"gesichtet", gold:"beobachtet", spezial:"prioritaet"};
const tierForOvr = o => o>=85?"prioritaet":o>=75?"beobachtet":o>=65?"gesichtet":"roh";
const to99 = pct => Math.max(40, Math.min(99, Math.round(40 + 0.59*(pct==null?50:pct))));
const initialsOf = n => (n||"?").split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();

function fieldCohort(){ return PLAYERS.filter(p=>!p.is_gk && (p.minutes||0)>=45); }
function pctlIn(co, key, v, inv){ return pctOf(co.map(q=>+q[key]||0), v, inv); }

function cardStats(p){
  if(p.is_gk){
    const gk = PLAYERS.filter(q=>q.is_gk);
    const one=(k,inv)=>to99(pctOf(gk.map(q=>+q[k]||0), +p[k]||0, inv));
    return [{lab:"REF",val:one("goals_prevented")},{lab:"XGA",val:one("xga")},
            {lab:"PAS",val:one("pass_pct")},{lab:"EIN",val:one("apps")},
            {lab:"GEG",val:one("conceded_p90",true)},{lab:"FRM",val:one("rating")}];
  }
  const co = fieldCohort();
  const avg=(...ks)=>ks.reduce((s,k)=>s+(pctlIn(co,k,+p[k]||0)??50),0)/ks.length;
  const one=(k,inv)=>pctlIn(co,k,+p[k]||0,inv);
  return [{lab:"TOR",val:to99(avg("xg_p90","goals_p90","shots_p90"))},
          {lab:"KRE",val:to99(avg("xa_p90","assists_p90","keyp_p90"))},
          {lab:"TEC",val:to99(one("dribbles_p90"))},
          {lab:"PAS",val:to99(avg("pass_pct","prog_p90"))},
          {lab:"DEF",val:to99(avg("duels_p90","duel_pct"))},
          {lab:"FRM",val:to99(one("rating"))}];
}

function cardConfigFor(p, label){
  const stats = cardStats(p);
  const ovr = p.score!=null ? Math.round(50+45*(p.score/100))
                            : Math.round(stats.reduce((s,x)=>s+x.val,0)/stats.length);
  return {pid:p.id, name:p.name, pos:p.pos_label||(p.is_gk?"TW":"?"),
          ovr, tier:tierForOvr(ovr), flag:"", img:null, label:label||"aktuell", stats};
}

function enrichSeasonRecord(rec, base){
  const m=+rec.minutes||0, p90=v=>m?+(((v||0)*90/m).toFixed(2)):0, pt=+rec.pass_try||0;
  return Object.assign({}, base, {
    minutes:m, goals:+rec.goals||0, assists:+rec.assists||0, rating:+rec.rating||0, score:null,
    xg_p90:p90(rec.xg), xa_p90:p90(rec.xa), goals_p90:p90(rec.goals), assists_p90:p90(rec.assists),
    shots_p90:p90(rec.shots_on), dribbles_p90:p90(rec.dribbles), duels_p90:p90(rec.duels),
    prog_p90:p90(rec.prog_passes), keyp_p90:p90(rec.key_passes),
    pass_pct: pt?Math.round(100*(+rec.pass_ok||0)/pt):0,
    duel_pct: rec.duels_total?Math.round(100*(+rec.duels||0)/(+rec.duels_total)):0,
    conceded_p90:p90(rec.conceded), xga:+rec.xga||0, apps:+rec.apps||0, conceded:+rec.conceded||0,
    goals_prevented:(+rec.xga||0)-(+rec.conceded||0)});
}

function cardSVG(c){
  let tk=c.tier; if(!TIERS[tk]) tk=TIER_MIGRATE[tk]||"roh";
  const t=TIERS[tk], W=340, H=480;
  const MONO="JetBrains Mono, ui-monospace, monospace";
  const SER="Constantia, Cambria, Georgia, serif";
  const nm=(c.name||""), nsz = nm.length>24 ? 15 : nm.length>18 ? 18 : 22;
  // Radar (Perzentil-Hexagon) bleibt das Herzstueck, jetzt als Tuschezeichnung
  // auf Karton statt als leuchtendes Sammelkartenmotiv.
  const N=c.stats.length, cx=170, cy=236, R=90, LR=111;
  const pt=(i,rad)=>{ const a=-Math.PI/2 + i*2*Math.PI/N;
    return [cx+rad*Math.cos(a), cy+rad*Math.sin(a)]; };
  let grid="";
  [0.34,0.67,1].forEach(f=>{
    const pts=c.stats.map((s,i)=>pt(i,R*f).map(n=>n.toFixed(1)).join(",")).join(" ");
    grid+=`<polygon points="${pts}" fill="none" stroke="${t.rule}" stroke-opacity="${f===1?1:.75}" stroke-width="1"/>`;
  });
  let spokes="", dots="", labels="";
  const valPts=c.stats.map((s,i)=>{
    const [ox,oy]=pt(i,R);
    spokes+=`<line x1="${cx}" y1="${cy}" x2="${ox.toFixed(1)}" y2="${oy.toFixed(1)}" stroke="${t.rule}" stroke-width="1"/>`;
    const [vx,vy]=pt(i, R*Math.max(0.05,Math.min(1,(s.val||0)/99)));
    dots+=`<circle cx="${vx.toFixed(1)}" cy="${vy.toFixed(1)}" r="2.4" fill="${t.accent}"/>`;
    const [lx,ly]=pt(i,LR);
    labels+=`<text x="${lx.toFixed(1)}" y="${(ly-1).toFixed(1)}" text-anchor="middle" font-family="${MONO}" font-size="9" font-weight="700" letter-spacing="1" fill="${t.txt}" opacity=".8">${s.lab}</text>`
          +`<text x="${lx.toFixed(1)}" y="${(ly+10).toFixed(1)}" text-anchor="middle" font-family="${MONO}" font-size="9" fill="${t.txt}" opacity=".5">${s.val}</text>`;
    return `${vx.toFixed(1)},${vy.toFixed(1)}`;
  }).join(" ");
  const poly=`<polygon points="${valPts}" fill="${t.accent}" fill-opacity=".14" stroke="${t.accent}" stroke-width="1.8" stroke-linejoin="round"/>`;
  const ghost = c.img
    ? `<clipPath id="cclip"><circle cx="${cx}" cy="${cy}" r="${R-3}"/></clipPath>
       <image href="${c.img}" x="${cx-R}" y="${cy-R}" width="${2*R}" height="${2*R}" preserveAspectRatio="xMidYMid slice" clip-path="url(#cclip)" opacity=".16"/>`
    : "";
  // Klassifizierung als aufgedrueckter Stempel – die einzige schraege Marke
  const stampW = Math.max(78, t.name.length*9 + 22);
  const stamp=`<g transform="translate(${W-76},62) rotate(-7)">
    <rect x="${-stampW/2}" y="-15" width="${stampW}" height="30" rx="2" fill="none"
          stroke="${t.accent}" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="${MONO}" font-size="10"
          font-weight="700" letter-spacing="2" fill="${t.accent}">${t.name.toUpperCase()}</text></g>`;
  // Passermarke: echtes Druckartefakt, hier als dezente Fussnote
  const cross=`<g stroke="${t.rule}" fill="none" stroke-width="1">
    <circle cx="306" cy="452" r="6"/><line x1="306" y1="443" x2="306" y2="461"/>
    <line x1="297" y1="452" x2="315" y2="452"/></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="cardsvg" font-family="${SER}" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="${W}" height="${H}" rx="2" fill="${t.paper}" stroke="${t.rule}" stroke-width="1.5"/>
    <rect x="9" y="9" width="${W-18}" height="${H-18}" rx="1" fill="none" stroke="${t.rule}" stroke-width=".8" opacity=".8"/>
    <text x="26" y="60" font-size="13" font-family="${MONO}" letter-spacing="1.6" fill="${t.txt}" opacity=".5">BEWERTUNG</text>
    <text x="26" y="102" font-size="40" font-weight="600" fill="${t.txt}">${c.ovr}</text>
    <text x="${26+String(c.ovr).length*24}" y="102" font-size="11" font-family="${MONO}" letter-spacing="1.4" fill="${t.txt}" opacity=".65">${(c.pos||"").split(",")[0].trim()}</text>
    ${c.flag?`<text x="26" y="128" font-size="18">${c.flag}</text>`:""}
    ${stamp}
    <line x1="26" y1="118" x2="314" y2="118" stroke="${t.rule}" stroke-width="1"/>
    ${ghost}${grid}${spokes}${poly}${dots}${labels}
    <line x1="26" y1="374" x2="314" y2="374" stroke="${t.rule}" stroke-width="1"/>
    <text x="26" y="402" font-size="${nsz}" font-weight="600" fill="${t.txt}">${nm}</text>
    <text x="26" y="424" font-size="10" font-family="${MONO}" letter-spacing=".6" fill="${t.txt}" opacity=".6">${(c.label||"").slice(0,40)}</text>
    <line x1="26" y1="440" x2="314" y2="440" stroke="${t.rule}" stroke-width="1"/>
    <text x="26" y="458" font-size="8" font-family="${MONO}" letter-spacing="1.5" fill="${t.txt}" opacity=".42">SCOUTINGBERICHT · FM COMPANION</text>
    ${cross}
  </svg>`;
}

// ---- Spielersuche fuer die Dossier-Auswahl -------------------------------
// Der Pool hat mehrere tausend Eintraege; ein reines Dropdown ist damit nicht
// mehr bedienbar. Diakritika werden weggefaltet, damit "estevao" auch
// "Estêvão" findet und "velickovic" auch "Veličković".
let CARD_FILTER = "";
// eigener Helfer: das esc() in cardEditor() ist dort lokal, hier nicht sichtbar
const escAttr = s => (s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;")
  .replace(/</g, "&lt;");
const cardNorm = s => (s || "").normalize("NFD")
  .replace(/[\u0300-\u036f]/g, "").toLowerCase();

function cardMatches(){
  const field = PLAYERS.filter(p => p.id != null)
    .sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
  const q = cardNorm(CARD_FILTER).trim();
  const matches = q ? field.filter(p => cardNorm(p.name).includes(q)) : field;
  // Der gerade gezeigte Spieler bleibt waehlbar, auch wenn er nicht zur Suche
  // passt - sonst zeigt die Karte jemanden, der nicht in der Liste steht.
  // Er zaehlt aber NICHT als Treffer, sonst meldet die Suche bei null Treffern
  // faelschlich einen.
  let list = matches;
  if(CARD_PID != null && !list.some(p => p.id === CARD_PID)){
    const cur = field.find(p => p.id === CARD_PID);
    if(cur) list = [cur].concat(list);
  }
  return {field, list, matches};
}
function cardOptionsHtml(list){
  return list.map(q => `<option value="${q.id}"${q.id===CARD_PID?" selected":""}>`
    + `${q.name}${q.score!=null?" · "+q.score:""}${q.age?" · "+Math.round(q.age)+"J":""}`
    + `</option>`).join("");
}
function cardCountHtml(field, matches){
  if(!cardNorm(CARD_FILTER).trim()) return `${field.length} Spieler im Pool`;
  return matches.length
    ? `${matches.length} von ${field.length} · Enter wählt den ersten Treffer`
    : `kein Treffer – die Suche geht nur über den Namen`;
}
function cardFilter(v){
  CARD_FILTER = v;
  const {field, list, matches} = cardMatches();
  const sel = document.getElementById("cardPlayer");
  if(sel) sel.innerHTML = cardOptionsHtml(list);
  const info = document.getElementById("cardCount");
  if(info) info.textContent = cardCountHtml(field, matches);
}
function cardSearchKey(ev){
  if(ev.key !== "Enter") return;
  ev.preventDefault();
  const {matches} = cardMatches();
  if(matches.length) cardSelectPlayer(matches[0].id);
}

  loadCardSources(p.id);
}

// SVG -> PNG (hochauflösend); eingebettete Bilder/Emoji sind data-URIs -> kein Taint
function cardToPng(cb){
  const svg=document.querySelector("svg.cardsvg"); if(!svg){ cb(null); return; }
  const xml=new XMLSerializer().serializeToString(svg);
  const src="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(xml)));
  const img=new Image();
  img.onload=()=>{ const s=3, cv=document.createElement("canvas");
    cv.width=340*s; cv.height=480*s; const x=cv.getContext("2d");
    x.drawImage(img,0,0,cv.width,cv.height);
    try{ cb(cv.toDataURL("image/png")); }catch(e){ cb(null); } };
  img.onerror=()=>cb(null); img.src=src;
}
async function cardExportPng(){
  cardToPng(async d=>{
    const st=document.getElementById("status");
    if(!d){ st.textContent="⚠ PNG-Export fehlgeschlagen."; return; }

    if(api){ const r=await api.save_png(d,(CARD.name||"karte").replace(/\s+/g,"_")+".png");

      else if(r&&r.error) st.textContent="⚠ "+r.error; }

  });
}

function renderTable(rows, C){
  rows = rows.slice().sort((a,b)=>{
    const x=a[sortKey]??0, y=b[sortKey]??0;
    return sortDesc ? (y>x?1:y<x?-1:0) : (x>y?1:x<y?-1:0);
  });
  HEAT = {};
  for(const [k] of C){
    if(!(k in HEAT_COLS)) continue;
    const vals = rows.map(p=>+p[k]).filter(v=>!isNaN(v));
    if(vals.length) HEAT[k] = [Math.min(...vals), Math.max(...vals)];
  }
  const th = C.map(([k,l])=>
    `<th class="${k===sortKey?'active':''}" onclick="sortBy('${k}')">${l}</th>`).join("");
  const body = rows.map(p=>
    `<tr${p.id!=null?` onclick="openDetail(${p.id})"`:""}>${C.map(([k])=>cell(p,k)).join("")}</tr>`).join("");
  document.getElementById("tableHost").innerHTML =
    `<table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table>`;
}

function niceStep(raw){
  const p = Math.pow(10, Math.floor(Math.log10(raw||1)));
  const n = raw/p; return (n<1.5?1:n<3?2:n<7?5:10)*p;
}

function renderChart(rows){
  const host = document.getElementById("tableHost");
  const mx = metricsFor(), lab = k => (mx.find(m=>m[0]===k)||[k,k])[1];
  const xk=xKey, yk=yKey;
  const xs = rows.map(p=>+(p[xk]??0)), ys = rows.map(p=>+(p[yk]??0));
  const W=1180,H=560,mg={l:60,r:30,t:26,b:50}, iw=W-mg.l-mg.r, ih=H-mg.t-mg.b;
  function dom(a){ let lo=Math.min(...a), hi=Math.max(...a);
    if(lo>0) lo=0; if(hi<0) hi=0; if(lo===hi){lo-=1;hi+=1;}
    const pad=(hi-lo)*0.08; return [lo-pad, hi+pad]; }
  const [x0,x1]=dom(xs), [y0,y1]=dom(ys);
  const X=v=>mg.l+(v-x0)/(x1-x0)*iw, Y=v=>mg.t+ih-(v-y0)/(y1-y0)*ih;
  const mean=a=>a.reduce((s,v)=>s+v,0)/a.length, ax=mean(xs), ay=mean(ys);
  function ticks(lo,hi){ const st=niceStep((hi-lo)/6), out=[];
    for(let v=Math.ceil(lo/st)*st; v<=hi+1e-9; v+=st) out.push(+v.toFixed(4)); return out; }
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  ticks(x0,x1).forEach(v=>{ const px=X(v);
    s+=`<line class="grid" x1="${px}" y1="${mg.t}" x2="${px}" y2="${mg.t+ih}"/>`;
    s+=`<text x="${px}" y="${mg.t+ih+16}" text-anchor="middle">${+v.toFixed(2)}</text>`; });
  ticks(y0,y1).forEach(v=>{ const py=Y(v);
    s+=`<line class="grid" x1="${mg.l}" y1="${py}" x2="${mg.l+iw}" y2="${py}"/>`;
    s+=`<text x="${mg.l-8}" y="${py+3}" text-anchor="end">${+v.toFixed(2)}</text>`; });
  s+=`<line class="axis" x1="${mg.l}" y1="${mg.t}" x2="${mg.l}" y2="${mg.t+ih}"/>`;
  s+=`<line class="axis" x1="${mg.l}" y1="${mg.t+ih}" x2="${mg.l+iw}" y2="${mg.t+ih}"/>`;
  s+=`<line class="avg" x1="${X(ax)}" y1="${mg.t}" x2="${X(ax)}" y2="${mg.t+ih}"/>`;
  s+=`<line class="avg" x1="${mg.l}" y1="${Y(ay)}" x2="${mg.l+iw}" y2="${Y(ay)}"/>`;
  s+=`<text class="avglab" x="${X(ax)+4}" y="${mg.t+11}">Ø ${ax.toFixed(2)}</text>`;
  s+=`<text class="avglab" x="${mg.l+iw-4}" y="${Y(ay)-4}" text-anchor="end">Ø ${ay.toFixed(2)}</text>`;
  rows.forEach((p,i)=>{ s+=`<circle class="dot" data-i="${i}" cx="${X(xs[i]).toFixed(1)}" cy="${Y(ys[i]).toFixed(1)}" r="5"/>`; });
  s+=`<text class="axlabel" x="${mg.l+iw/2}" y="${H-8}" text-anchor="middle">${lab(xk)} →</text>`;
  s+=`<text class="axlabel" transform="translate(16 ${mg.t+ih/2}) rotate(-90)" text-anchor="middle">${lab(yk)} →</text>`;
  s+=`</svg>`;
  host.innerHTML = `<div class="chartwrap">${s}<div class="tip" id="tip"></div></div>`;
  const tip=document.getElementById("tip"), wrap=host.querySelector(".chartwrap");
  host.querySelectorAll("circle.dot").forEach(c=>{
    c.addEventListener("mouseenter",()=>{ const i=+c.dataset.i, p=rows[i];
      c.classList.add("hot"); c.setAttribute("r","7");
      tip.innerHTML=`<b>${p.name}</b>${p.pos_label?' · '+p.pos_label:''}<br>`
        +`${lab(xk)}: ${fmt(xs[i])}<br>${lab(yk)}: ${fmt(ys[i])}<br>`
        +`<span class="muted">${p.minutes||0} Min</span>`;
      tip.style.display="block"; });
    c.addEventListener("mousemove",e=>{ const r=wrap.getBoundingClientRect();
      tip.style.left=Math.min(e.clientX-r.left+14, r.width-tip.offsetWidth-6)+"px";
      tip.style.top=(e.clientY-r.top+14)+"px"; });
    c.addEventListener("mouseleave",()=>{ c.classList.remove("hot"); c.setAttribute("r","5"); tip.style.display="none"; });
    c.addEventListener("click",()=>{ const p=rows[+c.dataset.i]; if(p&&p.id!=null) openDetail(p.id); });
  });
}

function populateAxes(){
  const mx = metricsFor();
  if(!mx.some(m=>m[0]===xKey)) xKey = TABS[TAB].gk ? "xga" : "finishing";
  if(!mx.some(m=>m[0]===yKey)) yKey = TABS[TAB].gk ? "goals_prevented" : "goals_p90";
  const opts = mx.map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
  const xs=document.getElementById("xAxis"), ys=document.getElementById("yAxis");

// ---------------- Spieler-Detail, Watchlist, Vergleich ----------------
let WATCH = {}, DETAIL_ID = null, COMPARE = [];
const API = () => (window.pywebview && window.pywebview.api) || null;

function profileOf(p){
  if(p.is_gk) return "tw";
  const g = (p.pos_groups||["unk"])[0];
  if(g==="def") return ((Number(p.pos_mask)||0) & 16) ? "iv" : "av";
  return ["mid","off","st"].includes(g) ? g : null;
}
const DETAIL_METRICS_FIELD = [
  ["goals_p90","Tore/90"],["assists_p90","Vorlagen/90"],["xg_p90","xG/90"],
  ["xa_p90","xA/90"],["shots_p90","Schüsse/90"],["press_p90","Pressing/90"],
  ["prog_p90","Progr. Pässe/90"],["int_p90","Abgefangen/90"],
  ["keyp_p90","Schlüsselp./90"],["loss_p90","Ballsicherheit",true],
  ["dribbles_p90","Dribblings/90"],["duel_pct","ZWK-Quote %"],
  ["header_pct","Kopfball %"],["pass_pct","Pass %"],["rating","Ø-Note"]];
const DETAIL_METRICS_GK = [
  ["goals_prevented","Verhindert ges."],["conceded_p90","GEG/90",true],
  ["xga","xGA (Workload)"],["pass_pct","Pass %"],["rating","Ø-Note"]];

const cohortFor = p => { const pr=profileOf(p); return PLAYERS.filter(q=>profileOf(q)===pr); };

function pctOf(vals, v, invert){
  const s=[...vals].sort((a,b)=>a-b), n=s.length;
  if(n<4) return null;
  let lo=0, hi=0;
  for(const x of s){ if(x<v)lo++; if(x<=v)hi++; }
  const pct = 100*(lo+0.5*(hi-lo))/n;
  return invert ? 100-pct : pct;
}
const barColor = r => r>=65?"var(--pos)":(r<=35?"var(--neg)":"var(--blue)");

function metricBars(p, cohort){
  const mets = p.is_gk ? DETAIL_METRICS_GK : DETAIL_METRICS_FIELD;
  return mets.map(([k,label,inv])=>{
    const pct = pctOf(cohort.map(q=>+q[k]||0), +p[k]||0, inv);
    if(pct==null) return `<div class="pbar"><span class="plab">${label}</span><div class="ptrack"></div><b class="muted">–</b></div>`;
    const r=Math.round(pct);
    return `<div class="pbar"${inv?' title="weniger ist besser (invertiert)"':''}>
      <span class="plab">${label}</span>
      <div class="ptrack"><i style="width:${r}%;background:${barColor(r)}"></i></div>
      <b>${r}</b></div>`;
  }).join("");
}

function spark(vals, last){
  if(vals.length<2) return `<span class="muted">zu wenig Snapshots</span>`;
  const W=150,H=26,P=2;
  const mn=Math.min(...vals), mx=Math.max(...vals);
  const X=i=>P+(W-2*P)*i/(vals.length-1);
  const Y=v=>mx===mn?H/2:P+(H-2*P)*(1-(v-mn)/(mx-mn));
  const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}"><polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="1.5"/></svg><b>${last}</b>`;
}

function openDetail(id){
  if(id==null) return;
  DETAIL_ID=id;
  document.getElementById("overlay").classList.add("on");
  document.getElementById("drawer").classList.add("open");
  renderDetail();
}
function closeAll(){
  DETAIL_ID=null;
  document.getElementById("overlay").classList.remove("on");
  document.getElementById("drawer").classList.remove("open");
}

async function renderDetail(){
  const p = PLAYERS.find(q=>q.id===DETAIL_ID);
  const d = document.getElementById("drawer");
  if(!p){ d.innerHTML="<p class='muted'>Spieler nicht im aktuellen Datensatz.</p>"; return; }
  const cohort = cohortFor(p);
  const w = WATCH[p.id]||{};
  const sc = p.score!=null
    ? `<span class="pill" style="background:rgba(var(${p.score>=50?'--heat-pos':'--heat-neg'}),.4)">${p.score}</span>` : "";
  d.innerHTML = `
   <div class="dhead"><h2>${p.name}</h2>${sc}<button class="xbtn" onclick="closeAll()">✕</button></div>
   <div class="dsub">${p.profile_label||"?"} · ${p.pos_label||"?"} · ${p.age?p.age+" J · ":""}${p.minutes||0} Min${p.value_m!=null?` · <b>${p.value_m} M€</b>`:""}${p.value_score!=null?` · Eff ${p.value_score}`:""} ·
     ${p.league?`${p.league} (K ${p.league_coeff})`:"Liga unbekannt"}${p.exp_at?` · <span title="Export-Stand">Export ${p.exp_at.slice(0,10)}</span>`:""}</div>
   <div class="dsec">Watchlist</div>
   <div class="wbtns">
     ${["beobachten","kaufen","verkaufen"].map(s=>
       `<button class="wbtn ${w.status===s?'on':''}" onclick="setWatch(${p.id},'${s}')">${s}</button>`).join("")}
   </div>
   <input class="wnote" id="wnote" placeholder="Notiz…" value="${(w.note||"").replace(/"/g,'&quot;')}" onchange="saveNote(${p.id})">
   <div class="dsec">Perzentile – ${p.profile_label||"?"} (${cohort.length} Spieler im Vergleich)</div>
   ${metricBars(p, cohort)}
   <button class="wbtn" style="margin-top:10px" onclick="addCompare(${p.id})">+ zum Vergleich</button>
   <div class="dsec">Verlauf über Snapshots</div>
   <div id="dHist" class="muted">lade…</div>
   <div class="dsec">Saison-Historie (alle Records)</div>
   <div id="dSeas" class="muted">lade…</div>
   ${p.eid?`<div class="dsec">Marktwert-Verlauf</div><div id="dValue" class="muted">lade…</div>`:""}`;
  const api=API();
  if(!api){
    document.getElementById("dHist").textContent="nur in der App verfügbar";
    document.getElementById("dSeas").textContent="nur in der App verfügbar";
    return;
  }
  const [hist, seas] = await Promise.all([api.history(p.id), api.seasons(p.id)]);
  const hh = (hist||[]).slice(-14);
  document.getElementById("dHist").innerHTML = [
    ["minutes","Minuten",v=>v],["goals","Tore",v=>v],
    ["xg","xG",v=>(+v).toFixed(2)],["rating","Note",v=>(+v).toFixed(2)]
  ].map(([k,l,f])=>{
    const vals=hh.map(r=>+r[k]||0);
    return `<div class="sparkrow"><span class="plab">${l}</span>${spark(vals, f(vals[vals.length-1]??0))}</div>`;
  }).join("") + `<div class="muted" style="font-size:11.5px;margin-top:4px">${hh.length} Snapshots</div>`;
  if(!(seas||[]).length){
    document.getElementById("dSeas").textContent="keine Records";
  } else {
    const rows=seas.map(r=>`<tr class="${r.is_current?'cur':''}">
      <td>${r.is_current?"▶ aktuell":"älter/Wettb."}</td>
      <td>${r.minutes||0}</td><td>${r.apps||0}</td><td>${r.goals||0}</td>
      <td>${r.assists||0}</td><td>${(+r.xg||0).toFixed(2)}</td>
      <td>${r.rating?(+r.rating).toFixed(2):"–"}</td></tr>`).join("");
    document.getElementById("dSeas").innerHTML=`<table class="seas"><thead>
      <tr><th>Record</th><th>Min</th><th>Eins</th><th>Tore</th><th>Vorl</th><th>xG</th><th>Note</th></tr>
      </thead><tbody>${rows}</tbody></table>
      <div class="muted" style="font-size:11.5px;margin-top:4px">Ältere Records = Vorsaison/andere Wettbewerbe → Entwicklung vs. „Ausnahme-Saison"</div>`;
  }
  const dv=document.getElementById("dValue");
  if(dv){
    let vh=[]; try{ vh=await api.value_history(p.eid)||[]; }catch(e){}
    const vals=vh.map(r=>+r.value/1e6).filter(v=>!isNaN(v));
    if(vals.length<2) dv.innerHTML=`<span class="muted">${vals.length?`${vals[0].toFixed(1)} M€ (nur 1 Import – Verlauf entsteht mit weiteren Exporten)`:"noch kein Export-Wert"}</span>`;
    else { const first=vals[0], last=vals[vals.length-1], d=last-first;
      dv.innerHTML=`<div class="sparkrow"><span class="plab">Marktwert</span>${spark(vals, last.toFixed(1)+" M€")}</div>
        <div class="muted" style="font-size:11.5px">${vh.length} Importe · ${d>=0?"+":""}${d.toFixed(1)} M€ seit ${(vh[0].imported_at||'').slice(0,10)}</div>`; }
  }
}

async function setWatch(id, status){
  const cur=WATCH[id]||{};
  const next = cur.status===status ? "" : status;
  const note = document.getElementById("wnote")?.value ?? cur.note ?? "";
  if(next) WATCH[id]={status:next, note}; else delete WATCH[id];
  const api=API(); if(api) await api.watchlist_set(id, next, note);
  renderDetail();
}
async function saveNote(id){
  const note=document.getElementById("wnote").value;
  const status=(WATCH[id]||{}).status || "beobachten";
  WATCH[id]={status, note};
  const api=API(); if(api) await api.watchlist_set(id, status, note);
}

const CMP_COLORS=["#e0a030","#4a9eff","#3fb950"];
function addCompare(id){
  if(!COMPARE.includes(id)){ if(COMPARE.length>=3) COMPARE.shift(); COMPARE.push(id); }
  renderCompareBar();
}
function removeCompare(id){ COMPARE=COMPARE.filter(x=>x!==id); renderCompareBar(); }
function renderCompareBar(){
  const bar=document.getElementById("compareBar");
  if(!COMPARE.length){ bar.classList.remove("on"); bar.innerHTML=""; return; }
  const chips=COMPARE.map((id,i)=>{
    const p=PLAYERS.find(q=>q.id===id);
    return `<span class="chip"><span class="dotc" style="background:${CMP_COLORS[i]}"></span>${p?p.name:id}<i onclick="removeCompare(${id})">✕</i></span>`;
  }).join("");
  bar.innerHTML=`${chips}<button ${COMPARE.length<2?"disabled":""} onclick="openCompare()">Vergleichen (${COMPARE.length})</button>
    <button class="xbtn" onclick="COMPARE=[];renderCompareBar()">leeren</button>`;
  bar.classList.add("on");
}
function openCompare(){
  const ps=COMPARE.map(id=>PLAYERS.find(q=>q.id===id)).filter(Boolean);
  if(ps.length<2) return;
  const mets = ps.every(p=>p.is_gk) ? DETAIL_METRICS_GK : DETAIL_METRICS_FIELD;
  const legend=ps.map((p,i)=>`<span><span class="dotc" style="background:${CMP_COLORS[i]}"></span>${p.name}
    <span class="muted">(${p.profile_label||"?"} · Score ${p.score??"–"})</span></span>`).join("");
  const body=mets.map(([k,l,inv])=>{
    const rows=ps.map((p,i)=>{
      const pct=pctOf(cohortFor(p).map(q=>+q[k]||0), +p[k]||0, inv);
      const r=pct==null?null:Math.round(pct);
      return `<div class="cmpbar"><span class="plab">${i===0?l:""}</span>
        <div class="ptrack"><i style="width:${r??0}%;background:${CMP_COLORS[i]}"></i></div>
        <b>${r??"–"}</b></div>`;
    }).join("");
    return `<div style="margin-bottom:8px">${rows}</div>`;
  }).join("");
  document.getElementById("cmpBox").innerHTML=`<div class="dhead">
    <h2>Vergleich – Perzentile je eigener Positionsgruppe</h2>
    <button class="xbtn" onclick="closeCompare()">✕</button></div>
    <div class="legend">${legend}</div>${body}`;
  document.getElementById("cmpModal").classList.add("on");
}
function closeCompare(){ document.getElementById("cmpModal").classList.remove("on"); }

function sortBy(k){ if(sortKey===k) sortDesc=!sortDesc; else {sortKey=k; sortDesc=true;} render(); }
function applyRanking(){
  const r = RANKINGS[document.getElementById("ranking").value];
  if(r){ sortKey=r.key; sortDesc=r.desc; render(); }
}

// ---------------- Auto-Scan (Hintergrund, kein Klicken nötig) ----------------
let AUTO_ON = false;
function updateAutoUI(){
  const b=document.getElementById("autoBtn");
  if(b){ b.classList.toggle("on", AUTO_ON); setBtnLabel("autoBtn", AUTO_ON ? "Auto ✓" : "Auto"); }
  const w=document.getElementById("autoPauseWrap"); if(w) w.style.display = AUTO_ON?"flex":"none";
}
async function toggleAuto(){
  AUTO_ON = !AUTO_ON; updateAutoUI();
  const api=API(); if(api) await api.set_auto_scan(AUTO_ON);
  document.getElementById("status").textContent = AUTO_ON
    ? "Auto-Scan aktiv – neue Spieler werden selbstständig nachgeladen…"
    : "Auto-Scan pausiert.";
}
async function setAutoPause(v){ const api=API(); if(api) await api.set_auto_pause(+v); }

// ---- Scouting-Modus: DERSELBE Scan, nur enger getaktet (20 s statt 180 s).
// Ein reiner Namens-Scan lohnt sich nicht – gemessen sind Namensindex 10,8 s
// und Statistiken nur 1,8 s obendrauf; man nimmt also besser alles mit.
// Zaehler und Restlaufzeit kommen aus dem normalen auto_poll().
let COLLECT_ON = false;
function updateCollectUI(){
  const b = document.getElementById("collectBtn");
  if(!b) return;
  b.classList.toggle("on", COLLECT_ON);
  setBtnLabel("collectBtn", COLLECT_ON ? "Scouting ✓" : "Scouting");
}
async function toggleCollect(){
  COLLECT_ON = !COLLECT_ON;
  updateCollectUI();
  const api=API();
  if(api) await api.set_collect(COLLECT_ON);
  document.getElementById("status").textContent = COLLECT_ON
    ? "Scouting-Modus – jetzt in FM Listen durchblättern. Jeder dabei geladene Name wird dauerhaft gemerkt."
    : "Scouting-Modus beendet.";
}

// Die UI POLLT den Auto-Scan-Status (kein Thread->GUI-Push -> kein Freeze).
let AUTO_LAST_ID = -1, AUTO_POLL_TIMER = null, AUTO_BUSY = false;
function startAutoPoll(){ if(!AUTO_POLL_TIMER) AUTO_POLL_TIMER = setInterval(autoPoll, 5000); }
async function autoPoll(){
  const api=API(); if(!api || AUTO_BUSY || DETAIL_ID!=null) return;   // Drawer offen: nicht stören
  let st; try{ st = await api.auto_poll(); }catch(e){ return; }
  AUTO_ON = st.on; updateAutoUI();
  if(st.season_apps) showSeasonInfo(st.season_apps);
  if(COLLECT_ON !== !!st.collect){        // laeuft nach 10 Minuten von selbst aus
    COLLECT_ON = !!st.collect; updateCollectUI();
  }
  if(AUTO_LAST_ID === -1){ AUTO_LAST_ID = st.last_id; return; }       // erster Poll: nur merken
  if(!st.on) return;
  const stat = document.getElementById("status");
  if(st.last_id !== AUTO_LAST_ID && !st.scanning){
    AUTO_LAST_ID = st.last_id; AUTO_BUSY = true;
    try{ if(MODE==="signals") renderSignals(); else await loadData(); } finally { AUTO_BUSY = false; }
  }
  if(st.collect){
    // Im Scouting-Modus zaehlt nicht der Snapshot, sondern was dazugelernt wurde
    stat.textContent = `Scouting-Modus · +${st.names_gained} neue Namen · `
      + `${st.names_known} bekannt · noch ${Math.ceil(st.collect_left/60)} Min`
      + (st.scanning ? " · scannt…" : "");
  } else if(st.idle){
    stat.textContent = "Auto-Scan wartet – FM24 nicht erkannt.";
  } else if(st.last_id === AUTO_LAST_ID && !st.scanning){
    // nichts zu melden
  } else {
    stat.textContent = `Auto-Scan · ${new Date().toLocaleTimeString()} · ${PLAYERS.length} Spieler`;
  }
}

async function doScan(){
  const btn=document.getElementById("scanBtn"), st=document.getElementById("status");
  btn.disabled=true; st.innerHTML='<span class="spin"></span> Lese Speicher…';
  try{
    const res = await window.pywebview.api.scan();
    if(!res.ok){ st.textContent = "⚠ "+res.error; btn.disabled=false; return; }
    PLAYERS = res.players;
    SRC = "last"; markSrc();   // frischer Scan = letzter Stand
    // Abdeckung mitzeigen: im RAM liegen Statistiken fuer weit mehr Spieler,
    // als wir benennen koennen – genau die Luecke schliesst der Sammelmodus.
    const m = res.meta || {};
    showSeasonInfo(m.season_apps);
    const gap = m.pids_total
      ? ` · ${m.pids_total.toLocaleString("de-DE")} Spieler mit Daten im RAM, benannt ${m.names_known||0}`
      : "";
    st.textContent = `${res.count} Spieler · Snapshot gespeichert · ${new Date().toLocaleTimeString()}${gap}`;
    render();
  }catch(e){ st.textContent="Fehler: "+e; }
  btn.disabled=false;
}

async function init(){
  RANKINGS = await window.pywebview.api.rankings();
  document.getElementById("ranking").innerHTML =
    RANKINGS.map((r,i)=>`<option value="${i}">${r.title}</option>`).join("");
  const s = await window.pywebview.api.get_settings();
  WATCH = (await window.pywebview.api.watchlist()) || {};
  MINMIN = s.min_minutes;
  SIG_MIN = s.sig_min_minutes || 900;
  const auto = await window.pywebview.api.auto_status();
  AUTO_ON = auto.on;
  updateCollectUI();
  document.getElementById("autoPause").value = auto.pause;
  updateAutoUI();
  startAutoPoll();
  // native Titelleiste an das aktuelle Theme angleichen
  window.pywebview.api.set_titlebar(document.documentElement.getAttribute("data-theme")!=="light");
  document.getElementById("minMin").value = s.min_minutes;
  document.getElementById("minMinVal").textContent = s.min_minutes;
  document.getElementById("curMax").value = s.cur_max_min;
  markSeasonAuto(!!s.season_auto);
  await loadData();
  populateAxes(); updateControls(); applyRanking();
}
window.addEventListener("pywebviewready", init);
// Icons und Theme sofort setzen – unabhaengig davon, ob PyWebView schon da ist
// (sonst steht der Kopf bis zum ersten init() ohne Zeichnungen da).
(function(){ paintIcons();
  let t="dark"; try{ t=localStorage.getItem("fmc_theme")||"dark"; }catch(e){} applyTheme(t); })();
</script>
