async function waehleVerein(){
  const api = API(); if(!api) return nurInApp();
  const sel = document.getElementById("clubPick"); if(!sel || !sel.value) return;
  const st = document.getElementById("status");
  let r; try{ r = await api.set_own_club(sel.value); }catch(e){ r = {ok:false, error:String(e)}; }
  if(!r || !r.ok){ st.textContent = "⚠ " + ((r && r.error) || "Verein konnte nicht gesetzt werden"); return; }
  st.textContent = `Kader: ${r.anzahl} Spieler von ${r.verein}` + (r.hinweis ? ` · ${r.hinweis}` : "");
  TACT_SQUADS = null; TACT = null; TACT_SLOT = null; TACT_PID = null;
  renderTactic();
}

async function importSquad(){
  const api = API(); if(!api) return nurInApp();
  const st = document.getElementById("status");
  let r; try{ r = await api.import_squad(); }catch(e){ r = {ok:false, error:String(e)}; }
  if(r && r.rueckfrage === "vereinswechsel"){ kaderRueckfrage(r); return; }
  if(!r || !r.ok){ if(r && r.error) st.textContent = r.error; return; }
  st.textContent = `Kader importiert: ${r.anzahl} Spieler von ${r.verein}`
    + (r.verliehen ? ` · ${r.verliehen} verliehene ausgelassen` : "");
  TACT_SQUADS = null; TACT = null; TACT_SLOT = null; TACT_PID = null;
  renderTactic();
}

async function pinSetzen(slotKey, id){
  const api = API(); if(!api) return nurInApp();
  const st = document.getElementById("status");
  let r; try{ r = await api.set_pin(slotKey, id); }catch(e){ r = {ok:false, error:String(e)}; }
  if(!r || !r.ok){ st.textContent = "⚠ " + ((r && r.error) || "Pin fehlgeschlagen"); return; }
  st.textContent = id==null ? "Pin gelöst – Position wieder automatisch besetzt."
                            : "Manuell aufgestellt. Die Automatik füllt die übrigen Plätze.";
  TACT = null; renderTactic();
}
async function pinsLoesen(){
  const api = API(); if(!api) return nurInApp();
  await api.clear_pins();
  document.getElementById("status").textContent = "Alle Pins gelöst – Aufstellung wieder automatisch.";
  TACT = null; renderTactic();
}

async function pickSquad(){
  const host = document.getElementById("tableHost"), api = API();
  host.innerHTML = `<div class="empty"><span class="spin"></span> suche Kaderlisten im Speicher…</div>`;
  const r = await api.detect_squads();
  if(!r.ok){ host.innerHTML = `<div class="empty"><h2>${r.error}</h2></div>`; return; }
  TACT_SQUADS = r.kader; renderSquadPicker(host);
}

function renderSquadPicker(host){
  // FM haelt mehrere Vereine gleichzeitig im Speicher – welcher der eigene
  // ist, steht nirgends. Einmal auswaehlen, danach gemerkt.
  const opt = TACT_SQUADS.map((k,i)=>`
    <div class="galitem" style="cursor:pointer" onclick="chooseSquad(${i})">
      <div class="dsec" style="margin-top:0">${k.benannt} Spieler · ${k.kopien} Fundstellen</div>
      <div style="font-size:12px;line-height:1.6">${k.namen.slice(0,18).map(esc2).join(" · ")}${k.namen.length>18?" …":""}</div>
    </div>`).join("");
  host.innerHTML = `<div style="padding:6px 0 30px">
    <div class="dsec">Welcher Kader ist deiner?</div>
    <div class="muted" style="font-size:12px;margin:8px 0 10px;max-width:70ch">
      Football Manager hält mehrere Vereine gleichzeitig im Speicher. Aus den
      Daten geht nicht hervor, welcher davon deiner ist – einmal auswählen,
      danach merkt sich die App die Spieler. Verlässlicher ist der Export des
      eigenen Vereins:
      <button class="linkbtn" onclick="importSquad()">Kader aus Export importieren…</button></div>
    <div class="gallery">${opt}</div></div>`;
}
const esc2 = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");

async function chooseSquad(i){
  const api = API(); if(!api) return;
  await api.set_squad(TACT_SQUADS[i].pids);
  TACT_SQUADS = null; TACT = null; TACT_SLOT = null; TACT_PID = null;
  renderTactic();
}
async function resetSquad(){
  TACT = null; TACT_PID = null;
  renderKaderwahl(document.getElementById("tableHost"));
}

// Formpfeil: Dreieck aus 45°-Diagonalen, kein Emoji und kein Rot – Aufwaerts
// gruen (--pos), abwaerts violett (--neg), damit es bei Rot-Gruen-Schwaeche
// unterscheidbar bleibt. Ohne Urteil bleibt die Stelle leer statt "stabil" zu
// behaupten, was nicht gemessen wurde.
function formPfeil(f){
  if(!f || !f.richtung) return "";
  const hoch = f.richtung > 0;
  return `<span class="fpfeil" title="Form ${f.form_note.toFixed(2)} gegen `
    + `Saisonschnitt ${f.saison_note.toFixed(2)} (${f.diff>0?"+":""}${f.diff.toFixed(2)}) `
    + `aus den letzten ${f.minuten} Minuten">`
    + `<svg viewBox="0 0 10 10" width="9" height="9" aria-hidden="true">`
    + `<path d="${hoch?"M5 2 L9 8 L1 8 Z":"M5 8 L9 2 L1 2 Z"}" `
    + `fill="${hoch?"var(--pos)":"var(--neg)"}"/></svg></span>`;
}
// Vereins-DNA in Tabellenzellen: eine Zahl, beide Dimensionen im Tooltip.
// Kein Wert (Torhüter, zu wenig Daten) bleibt ein Strich – nicht 0, das wäre
// eine Aussage.
function dnaCell(c){
  if(c.dna==null) return `<span class="muted">–</span>`;
  return `<span style="font-family:var(--mono)" title="Vereins-DNA ${c.dna}: `
    + `passstark ${c.dna_pass} · Ballgewinner ${c.dna_ball} `
    + `(geometrisches Mittel – wer beides kann, liegt vorn)">${c.dna}</span>`;
}
const kurzVon = k => { const s = TACT && TACT.slots.find(x=>x.key===k); return s?s.kurz:k; };

function drawTactic(host){
  const slot = TACT.slots.find(s=>s.key===TACT_SLOT) || TACT.slots[0];
  const pitch = TACT.slots.map(s=>{
    const on = s.key===slot.key;
    // Auf dem Platz steht, wer in der automatischen Elf gesetzt ist – NICHT
    // der Beste dieser Position. Borges ist auf beiden Fluegeln der Staerkste,
    // spielen kann er nur auf einem (siehe tactics.startelf).
    const best = s.kandidaten.find(k=>k.id===s.startelf_id) || s.kandidaten[0];
    const col = best ? scoreInk(best.score) : "var(--dim)";
    const f = best && best.form;
    return `<g class="tslot${on?" on":""}" onclick="tactPick('${s.key}')">
      <rect x="${s.x-7}" y="${s.y-5.2}" width="14" height="10.4"
            fill="${on?"var(--accent)":"var(--surface)"}"
            stroke="${on?"var(--accent)":"var(--border)"}" stroke-width="0.4"/>
      <text x="${s.x}" y="${s.y-0.9}" text-anchor="middle" font-size="3.1"
            font-family="var(--mono)" font-weight="700"
            fill="${on?"var(--on-accent)":"var(--text)"}">${s.kurz}</text>
      ${s.gepinnt ? `<rect x="${s.x+5.3}" y="${s.y-4.6}" width="1.3" height="1.3"
            fill="${on?"var(--on-accent)":"var(--accent)"}"><title>manuell aufgestellt</title></rect>` : ""}
      <text x="${s.x}" y="${s.y+3.4}" text-anchor="middle" font-size="3.6"
            font-weight="700" fill="${on?"var(--on-accent)":col}">${best?best.score:"–"}</text>
      ${f && f.richtung ? `<path d="${f.richtung>0
          ? `M${s.x+5} ${s.y-3.4} l1.3 1.3 l-2.6 0 Z`
          : `M${s.x+5} ${s.y-2.1} l1.3 -1.3 l-2.6 0 Z`}"
          fill="${on?"var(--on-accent)":(f.richtung>0?"var(--pos)":"var(--neg)")}"/>` : ""}
      ${best ? `<title>${esc2(best.name)} · ${Math.round(best.minutes||0)} Minuten`
        + ` · Stichprobe ${Math.round(best.verlaesslich*100)} %`
        + ` · Gesamt ${best.score} = ${gesamtFormel(best)}`
        + (f ? ` · Form ${f.form_note.toFixed(2)} gegen Saison ${f.saison_note.toFixed(2)}`
             + ` aus ${f.minuten} Minuten` : ` · noch kein Formurteil`) + `</title>
      <rect x="${s.x-4}" y="${s.y+4.2}" width="8" height="0.5" opacity=".3"
            fill="${on?"var(--on-accent)":"var(--rule)"}"/>
      <rect x="${s.x-4}" y="${s.y+4.2}" width="${(8*(best.verlaesslich||0)).toFixed(2)}"
            height="0.5" fill="${on?"var(--on-accent)":col}"/>` : ""}
    </g>`;
  }).join("");

  const liste = slot.kandidaten.length ? slot.kandidaten.map(c=>`
    <tr class="${c.id===TACT_PID?"tsel":""}${c.id===slot.startelf_id?" telf":""}"
        onclick="tactPlayer(${c.id})"
        oncontextmenu="return tactMenu(event,${c.id})"
        title="Rechtsklick: Ersatz für diesen Spieler suchen">
      <td class="name">${esc2(c.name)}${formPfeil(c.form)}${
        c.id===slot.startelf_id
          ? (slot.gepinnt
              ? `<span class="telfmark manuell" title="manuell aufgestellt – Rechtsklick: Pin lösen">manuell</span>`
              : `<span class="telfmark" title="steht in der automatischen Elf">gesetzt</span>`)
        : c.gesetzt_auf ? `<span class="tbusy" title="spielt in der automatischen Elf auf einer anderen Position">${esc2(kurzVon(c.gesetzt_auf))}</span>`
        : ""}</td>
      <td>${c.age?Math.round(c.age):"–"}</td>
      <td>${Math.round(c.minutes||0)}</td>
      <td>${scorePill(c)}</td>
      <td class="muted" style="font-family:var(--mono)">${c.fit??"–"}</td>
      <td class="muted" style="font-family:var(--mono)">${c.mb??"–"}</td>
      <td>${dnaCell(c)}</td>
      ${persTd(c)}
      <td class="muted" title="${c.verlaesslich<DUENN?"Kleine Stichprobe – die Zahl kann ein Ausreißer sein, heruntergerechnet wird sie aber nicht":"ausreichende Stichprobe"}">${Math.round(c.verlaesslich*100)}%</td>
      <td class="muted" title="${c.stat_quelle==="export"?"Zahlen aus dem FM-Export – der Speicher hatte weniger Minuten":"Zahlen aus dem Speicher"}">${c.stat_quelle==="export"?"Export":c.pos_quelle}</td>
    </tr>`).join("")
    : `<tr><td colspan="10" class="muted">Kein Kaderspieler ist für diese Position hinterlegt.</td></tr>`;

  const sel = slot.kandidaten.find(c=>c.id===TACT_PID);
  const detail = sel ? tactDetail(sel) : `<div class="muted" style="font-size:12px">
      Spieler anklicken, um die Kennzahlen hinter dem Fit zu sehen.
      Gesamt = Fit · Score · Charakter, geometrisch mit 0,35 / 0,35 / 0,30:
      passt in die Rolle, ist gut <i>und</i> bringt den Charakter mit. Ohne
      gescoutete Persönlichkeit zählt nur √(Fit × Score).</div>`;

  host.innerHTML = `${tactNav()}<div class="tactwrap">
    <div class="tactpitch">
      <svg viewBox="0 0 100 100" class="pitchsvg">
        <rect x="1" y="1" width="98" height="98" fill="var(--surface)" stroke="var(--border)" stroke-width="0.5"/>
        <line x1="1" y1="50" x2="99" y2="50" stroke="var(--rule)" stroke-width="0.4"/>
        <circle cx="50" cy="50" r="9" fill="none" stroke="var(--rule)" stroke-width="0.4"/>
        <rect x="28" y="82" width="44" height="17" fill="none" stroke="var(--rule)" stroke-width="0.4"/>
        <rect x="40" y="92" width="20" height="7" fill="none" stroke="var(--rule)" stroke-width="0.4"/>
        <rect x="28" y="1" width="44" height="17" fill="none" stroke="var(--rule)" stroke-width="0.4"/>
        <rect x="40" y="1" width="20" height="7" fill="none" stroke="var(--rule)" stroke-width="0.4"/>
        ${pitch}
      </svg>
      <div class="muted" style="font-size:10.5px;font-family:var(--mono)">
        ${TACT.verein?`<b>${esc2(TACT.verein)}</b> · `:""}${TACT.kader} Kaderspieler${TACT.ohne_daten?` · ${TACT.ohne_daten} ohne Statistikdaten`:""}
        · ${TACT.export_positionen} mit Export-Position
        ${TACT.kader_stand ? `· Kader: Import ${datumKurz(TACT.kader_stand)}` : ""}
        · <button class="linkbtn" onclick="resetSquad()">Kader ändern</button>${
          TACT.pins && Object.keys(TACT.pins).length
            ? ` · ${Object.keys(TACT.pins).length} manuell aufgestellt
               <button class="linkbtn" onclick="pinsLoesen()">alle lösen</button>` : ""}
      </div>
      ${meldeZeile(TACT.meldeliste)}
    </div>
    <div class="tactpanel">
      <div class="dsec" style="margin-top:0">${esc2(slot.label)}</div>
      <div style="font-size:12.5px;margin-bottom:2px"><b>${esc2(slot.rolle)}</b>${rolleKurz(slot)}
        <span class="muted">· ${esc2(slot.duty)}</span></div>
      <ul class="taufg">${slot.aufgaben.map(a=>`<li>${esc2(a)}</li>`).join("")}</ul>
      <div class="tcmp"><button class="wbtn" onclick="openCompare('${slot.key}')">Vergleichen…</button>
        <span class="muted">Stamm und Backup gegen bis zu drei Kandidaten – Leistung, Kennzahlen, Preis</span></div>
      <table class="tcand"><thead><tr>
        <th style="text-align:left">Spieler</th><th>Alter</th><th>Min</th>
        <th title="${GESAMT_TIP}">Gesamt</th>
        <th title="Positions-Fit: wie gut er DIESE Rolle im 4-2-3-1 ausfüllt (Perzentil gegen alle, die sie spielen können)">Fit</th>
        <th title="Moneyball-Score: wie gut er allgemein ist, stilneutral – dieselbe Zahl wie in der Tabelle">Score</th>
        <th title="Vereins-DNA: passstark × Ballgewinner">DNA</th>
        <th title="Persönlichkeit aus dem Spielerprofil – neben dem Score, nicht darin">Charakter</th>
        <th title="Wie belastbar die Stichprobe ist">Basis</th>
        <th title="Woher die Positionsangabe stammt">Quelle</th>
      </tr></thead><tbody>${liste}</tbody></table>
      ${detail}
      <div class="dsec">Was hier nicht messbar ist</div>
      <ul class="tblind">${slot.blind.map(b=>`<li>${esc2(b)}</li>`).join("")}</ul>
    </div></div>`;
}

const scoreInk = v => v>=50 ? "var(--pos)" : "var(--neg)";

// Gesamt = Fit^0,35 × Score^0,35 × Charakter^0,30 (tactics.gesamt), in der
// Ersatzsuche ohne Score Fit^0,7 × Charakter^0,3. Ohne gescoutete
// Persönlichkeit fällt der Faktor weg. Der Text nennt die Bausteine.
const gesamtFormel = c => `Fit ${c.fit??"–"}`
  + (c.mb!==undefined ? ` · Score ${c.mb??"–"}` : "")
  + ` · Charakter ${c.charakter??"ungescoutet"}`;
const GESAMT_TIP = "Fit^0,35 × Score^0,35 × Charakter^0,30 – wer alles mitbringt, liegt vorn; "
  + "ein guter Spieler in der falschen Rolle nicht. Ohne gescoutete Persönlichkeit √(Fit × Score).";

// Score-Plakette für Taktikbrett und Ersatzsuche. Der Wert steht IMMER
// ungedämpft da – sonst verschwindet der Ersatzspieler, der auf 300 Minuten
// besser liefert als der Stammspieler. Eine dünne Stichprobe zeigt sich an der
// Unterkante und im Tooltip, nie an einer kleingerechneten Zahl.
// Schwelle, ab der eine Stichprobe als dünn markiert wird. 0.8 entspricht
// min/(min+180) = 0.8, also 720 Minuten ≈ 8 Spielen. Bewusst höher als die
// alten 0.6 (270 Minuten): solange der Score gedämpft wurde, war die Markierung
// nur eine Fußnote – jetzt ist sie der ganze Ausreißerschutz.
const DUENN = 0.8;
const scorePill = c => `<span class="pill${c.verlaesslich<DUENN?" duenn":""}"
    title="${c.verlaesslich<DUENN
      ? "Nur "+Math.round(c.minutes||0)+" Minuten Spielzeit – der Score ist echt, aber wacklig ("
        +Math.round(c.verlaesslich*100)+" % Stichprobe)"
      : "Stichprobe "+Math.round(c.verlaesslich*100)+" % – belastbar"}${
      c.charakter!=null ? " · Charakter "+c.charakter+" fließt ein"
                        : " · Persönlichkeit ungescoutet, nur Leistung"}"
    style="background:rgba(${c.score>=50?"var(--heat-pos)":"var(--heat-neg)"},${
      (0.14+Math.abs(c.score-50)/50*0.5).toFixed(2)})">${c.score}</span>`;

function tactDetail(c){
  const rows = c.teile.map(t=>{
    const w = t.wert==null ? "–"
      : t.format==="pct" ? Math.round(t.wert)+" %"
      : t.format==="1f" ? (+t.wert).toFixed(1) : (+t.wert).toFixed(2);
    if(t.pct==null) return `<div class="pbar"><span class="plab">${esc2(t.label)}</span>
      <span class="ptrack"></span><b class="muted">${w}</b></div>`;
    const col = t.pct>=50 ? "var(--heat-pos)" : "var(--heat-neg)";
    return `<div class="pbar" title="Gewicht ${t.gewicht}">
      <span class="plab">${esc2(t.label)}</span>
      <span class="ptrack"><i style="width:${t.pct}%;background:rgba(${col},.85)"></i></span>
      <b>${t.pct}</b><span class="tval">${w}</span></div>`;
  }).join("");
  return `<div class="dsec">${esc2(c.name)} · Gesamt ${c.score}
      <span class="muted">= ${gesamtFormel(c)}</span></div>
    <div class="muted" style="font-size:11.5px;margin-bottom:6px">
      Balken = Perzentil unter allen Spielern, die diese Position spielen können.
      Rechts der tatsächliche Wert.${c.verlaesslich<DUENN
        ? ` <b>Nur ${Math.round(c.minutes||0)} Minuten</b> – der Score wird
            trotzdem nicht heruntergerechnet, kann aber auf wenigen guten
            Spielen beruhen.` : ""}</div>${rows}
    <div style="margin-top:10px">
      <button class="wbtn" onclick="openRepl(${c.id})">Ersatz finden…</button></div>`;
}

// ======================= Ligavergleich =====================================
// Unsere Elf je Position gegen die Liga (tactics.liga_vergleich) oder gegen
// eine feste Liste von CL-Vergleichsvereinen (cl_comparison, D9). Leistung =
// √(Fit × Score) ohne Charakter. Die Scoutinglisten decken je Verein nur
// 4–13 Spieler ab, bei Torhütern eine Handvoll: wo die Datenbasis nicht trägt,
// sagt die Zeile „keine Aussage", statt eine Zahl zu zeigen – in der Liga
// unter acht Vereinen, auf CL-Niveau nach dem Urteil des Backends (aussage:
// mindestens 6 der 8 Vergleichsvereine mit Daten).
const LIGA_MIN_VEREINE = 8;
const LIGA_GRUPPE = {tw:"tw", lv:"def", iv:"def", rv:"def", dm:"mid",
  aml:"off", amc:"off", amr:"off", st:"st"};
const LIGA_SLOT = {iv:"ivl", dm:"dml"};          // Doppelposition -> Brett-Slot
const fmtDelta = d => d==null ? "–" : (d>0?"+":d<0?"−":"±") + Math.abs(d).toLocaleString("de-DE");
const fmtWert = v => v==null ? "–" : (+v).toLocaleString("de-DE", {maximumFractionDigits:1});
// Maßstab: „liga" oder „cl". CLV = Ergebnis von cl_comparison; CL_WAHL ist die
// offene Vereinsauswahl (Entwurf, erst „Übernehmen" speichert).
let LIGA_MASS = "liga", CLV = null, CL_CLUBS = null, CL_WAHL = null, CL_Q = "";

// Was sich zwischen Liga und CL-Niveau unterscheidet, steht nur hier.
const MASS = {
  liga: {
    tragend: p => (p.vereine_mit_daten||0) >= LIGA_MIN_VEREINE && p.wert!=null,
    ref: p => p.top4, delta: p => p.abstand_top4,
    rangN: p => p.vereine_mit_daten,              // zählt den eigenen Verein mit
    refName: "Top-4-Schwelle", deltaKopf: "Δ Top 4",
    deltaTip: "Abstand zur Leistung des viertbesten Vereins",
    unter: "Unter Top-4-Niveau", spitze: "Ligaspitze",
    ueber: "wir, auf Top-4-Niveau", strich: "ein Ligaverein (sein Bester auf der Position)",
    leerLeg: `keine Aussage (unter ${LIGA_MIN_VEREINE} Vereinen)`,
    basis: p => `${p.vereine_mit_daten} Vereine <span class="muted">· ${p.liga_spieler} Spieler</span>`,
    keine: p => `${p.vereine_mit_daten} Vereine · keine Aussage`,
    keineTip: p => `Nur ${p.vereine_mit_daten} Vereine mit Daten – unter ${LIGA_MIN_VEREINE} ist ein Rang keine Aussage`,
    leerGrund: p => `nur ${p.vereine_mit_daten} Vereine mit Daten`,
  },
  cl: {
    tragend: p => !!p.aussage && p.wert!=null,
    ref: p => p.messlatte, delta: p => p.abstand,
    rangN: p => (p.vereine_mit_daten||0) + 1,     // kommt OHNE den eigenen Verein
    refName: "CL-Messlatte", deltaKopf: "Δ Messlatte",
    deltaTip: "Abstand zum Median der Vergleichsvereine",
    unter: "Unter der CL-Messlatte", spitze: "Vor allen Vergleichsvereinen",
    ueber: "wir, auf oder über der Messlatte", strich: "ein Vergleichsverein (sein Bester auf der Position)",
    leerLeg: "keine Aussage (zu wenige Vergleichsvereine mit Daten)",
    basis: p => `${p.vereine_mit_daten}/${p.vereine_soll} Vereine${(p.fehlende_vereine||[]).length
      ? ` <span class="muted">· fehlen: ${p.fehlende_vereine.map(esc2).join(", ")}</span>` : ""}`,
    keine: p => `${p.vereine_mit_daten}/${p.vereine_soll} · keine Aussage`,
    // Die fehlenden Vereine klein unter dem Hinweis – sonst läuft die
    // gestrichelte Unterstreichung über drei Zeilen
    fehlen: p => (p.fehlende_vereine||[]).length
      ? `<div class="lfehlen">fehlen: ${p.fehlende_vereine.map(esc2).join(", ")}</div>` : "",
    keineTip: p => `Nur ${p.vereine_mit_daten} von ${p.vereine_soll} Vergleichsvereinen mit Daten – für eine Aussage braucht es ${
      (CLV && CLV.min_mit_daten) || 6}. Fehlende Kader in FM exportieren (Strg+P) und importieren.`,
    leerGrund: p => `${p.vereine_mit_daten}/${p.vereine_soll} Vereine`,
  },
};
const ligaDaten = () => LIGA_MASS==="cl" ? CLV : LIGA;
const ligaHost = () => document.getElementById("tableHost");

async function drawLigaHost(host){
  const api = API(); if(!api) return nurInApp();
  if(LIGA_MASS==="cl" && !CLV){
    host.innerHTML = tactNav() + `<div class="empty"><span class="spin"></span> rechne CL-Vergleich…</div>`;
    try{ CLV = await api.cl_comparison(450); }catch(e){ CLV = {ok:false, error:String(e)}; }
    if(TACT_VIEW!=="liga" || LIGA_MASS!=="cl") return;
  }
  // Noch keine Vergleichsvereine: direkt zur Auswahl – auch beim zweiten Mal
  if(LIGA_MASS==="cl" && CLV && CLV.keine_vereine && !CL_WAHL){ await clWahlOeffnen(); return; }
  if(LIGA_MASS==="liga" && !LIGA){
    host.innerHTML = tactNav() + `<div class="empty"><span class="spin"></span> rechne Ligavergleich…</div>`;
    try{ LIGA = await api.league_comparison(450); }catch(e){ LIGA = {ok:false, error:String(e)}; }
    if(TACT_VIEW!=="liga" || LIGA_MASS!=="liga") return;
  }
  drawLiga(host);
}
function setLigaMass(m){ if(m===LIGA_MASS) return; LIGA_MASS = m; LIGA_OFFEN = null; CL_WAHL = null; drawLigaHost(ligaHost()); }
function setLigaSort(v){ LIGA_SORT = v; drawLiga(ligaHost()); }
function ligaAuf(k){ LIGA_OFFEN = (LIGA_OFFEN===k ? null : k); drawLiga(ligaHost()); }

function ligaKopf(L, M){
  const cl = LIGA_MASS==="cl";
  const titel = cl ? `CL-Niveau${L && L.ok ? ` · ${L.vereine.length} Vergleichsvereine` : ""}`
                   : `Ligavergleich${L && L.liga ? ` · ${esc2(L.liga)}` : ""}`;
  const unter = cl
    ? `je Position gegen den besten Spieler jedes Vergleichsvereins · Messlatte = Median`
    : `je Position gegen den besten Spieler jedes Ligavereins`;
  const stand = !L || !L.ok ? "" : `<div class="lstand" title="Vergleichsmenge: Importe seit ${datumKurz(L.stand)} (letzter Kaderimport minus 3 Tage)">${
      L.daten_stand || L.kader_stand
        ? `<span>Daten: Import ${datumKurz(L.daten_stand)}</span><span>Kader: Import ${datumKurz(L.kader_stand)}</span>`
        : `<span>Vergleichsmenge: Importe seit ${datumKurz(L.stand)}</span>`}</div>`;
  const erf = {}; ((L && L.erfassung) || []).forEach(e=>erf[e.club] = e);
  const vName = c => erf[c] && erf[c].kader===false
    ? `<span class="lgescoutet" title="${escAttr(`${c}: nur gescoutet – ${erf[c].n} Spieler in den Daten, Kader-Export fehlt`)}">${esc2(c)}</span>`
    : esc2(c);
  const vereine = cl && L && L.ok ? `<div class="lvereine">${L.vereine.map(vName).join(" · ")}
      <button class="linkbtn" onclick="clWahlOeffnen()">Vereine ändern</button></div>` : "";
  return `<div class="ligakopf">
      <div class="ltitel"><div class="dsec" style="margin-top:0">${titel}</div>
        <div class="muted" style="font-size:11.5px">${esc2((L && L.verein)||"")} ${unter} · Leistung = √(Fit × Score),
          ohne Charakter${L && L.min_minutes ? ` · ab ${L.min_minutes} Min` : ""}</div>${stand}${vereine}</div>
      <label class="status" style="display:flex;gap:6px;align-items:center">Maßstab
        <span class="seg"><button class="${!cl?"on":""}" onclick="setLigaMass('liga')">Liga</button><button
          class="${cl?"on":""}" onclick="setLigaMass('cl')"
          title="Gegen eine feste Liste von bis zu 8 Vereinen auf CL-Niveau">CL-Niveau</button></span></label>
      <label class="status" style="display:flex;gap:6px;align-items:center">Reihenfolge
        <span class="seg"><button class="${LIGA_SORT==="platz"?"on":""}" onclick="setLigaSort('platz')">Platz</button><button
          class="${LIGA_SORT==="rueckstand"?"on":""}" onclick="setLigaSort('rueckstand')">Rückstand</button></span></label>
    </div>`;
}

function drawLiga(host){
  const M = MASS[LIGA_MASS], L = ligaDaten(), cl = LIGA_MASS==="cl";
  const wahl = CL_WAHL ? clWahlPanel() : "";
  if(!L || !L.ok){
    host.innerHTML = tactNav() + `<div class="ligawrap">${ligaKopf(L, M)}${wahl || `<div class="empty"><h2>${
      cl ? "Kein CL-Vergleich" : "Kein Ligavergleich"}</h2>${esc2((L && L.error)
      || (L && L.kein_kader ? "Erst einen Kader auswählen." : ""))}${
      cl && L && L.keine_vereine ? `<div style="margin-top:12px"><button onclick="clWahlOeffnen()">Vereine wählen…</button></div>` : ""}</div>`}</div>`;
    return;
  }
  const P = L.positionen.slice();
  if(LIGA_SORT==="rueckstand")
    P.sort((a,b)=>(M.tragend(b)-M.tragend(a)) || ((M.delta(a)??99)-(M.delta(b)??99)));
  // Eine gemeinsame Achse für alle Positionen, damit Abstände vergleichbar sind
  const werte = P.flatMap(p=>[p.wert, ...p.vereine.map(v=>v.wert)]).filter(v=>v!=null);
  const lo = Math.max(0, Math.min(40, Math.floor(Math.min(...werte)/10)*10)), hi = 100;
  const X = v => (100*(v-lo)/(hi-lo)).toFixed(2);
  const kurz = p => slotKurz(LIGA_SLOT[p.key] || p.key);

  // Befund in einem Satz je Gruppe – das, wofür man die Ansicht öffnet
  const nenn = (p, zus) => `<b>${esc2(p.label)}</b>${zus ? ` <span class="muted">${zus}</span>` : ""}`;
  const unter = P.filter(p=>M.tragend(p) && M.delta(p)<0).sort((a,b)=>M.delta(a)-M.delta(b));
  const spitze = P.filter(p=>M.tragend(p) && p.rang===1);
  const leer = P.filter(p=>!M.tragend(p));
  const befund = [
    unter.length ? `${M.unter}: ${unter.map(p=>nenn(p, `${fmtDelta(M.delta(p))}, Rang ${p.rang}/${M.rangN(p)}`)).join(" · ")}`
                 : `${M.unter}: keine Position.`,
    spitze.length ? `${M.spitze}: ${spitze.map(p=>nenn(p)).join(" · ")}` : "",
    leer.length ? `Keine Aussage: ${leer.map(p=>nenn(p, M.leerGrund(p))).join(" · ")}` : "",
  ].filter(Boolean).join("<br>");
  // Die Elf kommt vom Brett, Pins eingeschlossen – sonst wundert man sich,
  // warum der Befund nicht zur Auto-Elf passt.
  const pins = Object.keys((TACT && TACT.pins) || {});
  const pinHinweis = pins.length
    ? `<div class="muted" style="font-size:11.5px;margin-top:2px">Elf vom Brett mit ${pins.length} Pin${pins.length>1?"s":""}
        (${pins.map(k=>esc2(slotKurz(k))).join(", ")}) – weicht von der automatischen Elf ab.</div>` : "";

  const achse = [lo, lo+(hi-lo)/3, lo+2*(hi-lo)/3, hi].map(v=>Math.round(v/5)*5)
    .map(v=>`<span style="left:${X(v)}%">${v}</span>`).join("");

  const zeilen = P.map(p=>{
    const tr = M.tragend(p), offen = LIGA_OFFEN===p.key, ref = M.ref(p), d = M.delta(p);
    const eig = (p.eigene||[]).map(e=>`${esc2(e.name)}${p.eigene.length>1?` <span class="muted">${e.leistung??"–"}</span>`:""}`).join(" · ")
      || `<span class="muted">nicht besetzt</span>`;
    const vor = v => p.wert!=null && v.wert > p.wert;
    const striche = p.vereine.map(v=>`<i class="lt${vor(v)?" vor":""}" style="left:${X(v.wert)}%" title="${escAttr(
      `${v.club} ${fmtWert(v.wert)} – ${v.spieler.map(s=>`${s.name} ${s.leistung}`).join(", ")}`)}"></i>`).join("");
    // Ohne tragfähige Datenbasis gibt es auch keine Schwelle – bei drei
    // Vereinen wäre sie nur der schwächste von ihnen.
    const linie = tr && ref!=null ? `<i class="lt4" style="left:${X(ref)}%" title="${M.refName}: ${fmtWert(ref)}"></i>` : "";
    const ich = p.wert!=null ? `<b class="lme${!tr?" leer":d<0?" unter":""}" style="left:${X(p.wert)}%" title="${escAttr(
      `${L.verein}: ${fmtWert(p.wert)}`)}"></b>` : "";
    return `<tr class="${offen?"lsel":""}${tr?"":" duenn"}" onclick="ligaAuf('${p.key}')" title="Klick: Vereine auf dieser Position">
      <td class="lname"><span class="ltile" style="--grp:var(--pg-${LIGA_GRUPPE[p.key]||"mid"})"${
        p.rolle ? ` title="${escAttr(p.rolle + (p.rolle_kurz ? ` (${p.rolle_kurz})` : ""))}"` : ""}>${esc2(kurz(p))}</span></td>
      <td class="lname"><div class="lpos">${esc2(p.label)}</div><div class="leig">${eig}</div></td>
      <td><span class="lwert">${fmtWert(p.wert)}</span></td>
      <td class="lname"><div class="lstrip">${striche}${linie}${ich}</div></td>
      <td>${tr ? `<b>${p.rang}</b><span class="muted">/${M.rangN(p)}</span>` : `<span class="ldim" title="${escAttr(M.keineTip(p))}">–</span>`}</td>
      <td>${tr && d!=null ? `<span class="${d>0?"pos":d<0?"neg":"muted"}">${fmtDelta(d)}</span>` : `<span class="ldim">–</span>`}</td>
      <td class="lname">${tr ? M.basis(p) : `<span class="lkeine" title="${escAttr(M.keineTip(p))}">${M.keine(p)}</span>${
        M.fehlen ? M.fehlen(p) : ""}`}</td>
    </tr>${offen ? `<tr class="ldet"><td></td><td colspan="6">${ligaVereine(p, L)}</td></tr>` : ""}`;
  }).join("");

  // Vorläufig, solange Vergleichsvereine nur über Scoutinglisten erfasst sind:
  // ihr „bester Spieler" ist dann oft nicht ihr Stammspieler (Head Scout).
  const gesc = cl ? (L.erfassung || []).filter(e=>e.kader===false) : [];
  const nG = cl ? (L.nur_gescoutet ?? gesc.length) : 0;
  const banner = nG > 0 ? `<div class="lvorl"><b>Vorläufig:</b> ${nG} von ${(L.vereine||[]).length} Vereinen nur über
      Scoutinglisten erfasst${gesc.length ? ` (${gesc.map(e=>esc2(e.club)).join(", ")})` : ""}. Belastbar erst mit
      ihren Kader-Exporten.</div>` : "";
  host.innerHTML = tactNav() + `<div class="ligawrap">${ligaKopf(L, M)}${wahl}${banner}
    <div class="lbefund">${befund}${cl && L.mit_aussage!=null
      ? `<div class="muted" style="font-size:11.5px;margin-top:2px">Aussage auf ${L.mit_aussage} von ${P.length} Positionen.</div>` : ""}${pinHinweis}</div>
    <table class="liga"><colgroup><col style="width:56px"><col style="width:22%"><col style="width:70px">
      <col><col style="width:66px"><col style="width:84px"><col style="width:${cl ? 230 : 190}px"></colgroup>
      <thead><tr><th></th><th style="text-align:left">Position · unsere Elf</th><th>Leistung</th>
        <th style="text-align:left"><div class="lachse">${achse}</div></th>
        <th title="Unser Platz unter den Vereinen mit Daten">Rang</th>
        <th title="${M.deltaTip}">${M.deltaKopf}</th>
        <th style="text-align:left">Datenbasis</th></tr></thead>
      <tbody>${zeilen}</tbody></table>
    <div class="lleg"><span><i class="lt"></i> ${M.strich}</span>
      <span><i class="lt4"></i> ${M.refName}${cl ? " (Median der Vergleichsvereine)" : ""}</span>
      <span><b class="lme"></b> ${M.ueber}</span><span><b class="lme unter"></b> wir, darunter</span>
      <span><b class="lme leer"></b> ${M.leerLeg}</span></div>
    <div class="cmfuss">${cl
      ? `Messlatte = Median der Vergleichsvereine auf der Position, ohne uns. Die Daten stammen aus Scoutinglisten und
         Kader-Exporten – fehlt ein Verein („fehlen: …"), dessen Kader in FM exportieren (Strg+P) und importieren.`
      : `Die Datenbasis sind Scoutinglisten, keine Kader – je Verein oft nur 4–13 Spieler. Bei den anderen Vereinen darf
         derselbe Spieler auf mehreren Positionen zählen, bei uns nicht; der Vergleich ist damit leicht zu streng gegen uns.`}
      Innenverteidigung und Doppelsechs vergleichen das Mittel der zwei Besten. Zeile anklicken: alle Vereine auf dieser Position.</div>
  </div>`;
}

// Aufgeklappt: wer auf dieser Position vor uns liegt – mit Namen, Alter und
// Marktwert. Unsere Zeile steht auf ihrem Rang dazwischen.
function ligaVereine(p, L){
  const zeilen = p.vereine.map(v=>({club:v.club, wert:v.wert, spieler:v.spieler, wir:false}));
  if(p.wert!=null) zeilen.push({club:L.verein, wert:p.wert, wir:true,
    spieler:(p.eigene||[]).map(e=>({name:e.name, leistung:e.leistung, age:null, value:null}))});
  zeilen.sort((a,b)=>b.wert-a.wert || (a.wir?-1:1));
  const sp = s => `${esc2(s.name)} <b>${s.leistung??"–"}</b>${s.age!=null?` <span class="muted">${Math.round(s.age)} J</span>`:""}${
    s.value ? ` <span class="muted">· ${fmtMio(s.value/1e6)}</span>` : ""}`;
  const fehlen = (p.fehlende_vereine||[]).length
    ? `<div class="muted" style="font-size:11px;margin-top:6px">Ohne Daten auf dieser Position: ${p.fehlende_vereine.map(esc2).join(", ")}</div>` : "";
  return `<div class="muted" style="font-size:11px;margin:2px 0 6px">Vereine nach Leistung auf dieser Position –
      je Verein ${p.key==="iv"||p.key==="dm" ? "die zwei Besten" : "der Beste"} aus den Daten</div>
    <table class="lclub"><tbody>${zeilen.map((z,i)=>`<tr class="${z.wir?"wir":""}">
      <td class="muted">${i+1}</td><td>${esc2(z.club)}${z.wir?` <span class="rbadge kader">wir</span>`:""}</td>
      <td class="lsp">${z.spieler.map(sp).join(" · ")}</td><td><b>${fmtWert(z.wert)}</b></td></tr>`).join("")}</tbody></table>${fehlen}`;
}

// ---- Vereinsauswahl für das CL-Niveau (cl_clubs / set_cl_clubs) -----------
// Bis zu 8 Vereine; der eigene steht nicht zur Wahl. Gespeichert wird erst
// mit „Übernehmen" – bis dahin ist CL_WAHL nur ein Entwurf.
async function clWahlOeffnen(){
  const api = API(); if(!api) return nurInApp();
  try{ CL_CLUBS = await api.cl_clubs(); }catch(e){ CL_CLUBS = {ok:false, error:String(e)}; }
  CL_WAHL = ((CL_CLUBS && CL_CLUBS.vereine) || []).slice();
  CL_Q = "";
  drawLiga(ligaHost());
}
function clWahlAbbrechen(){ CL_WAHL = null; drawLiga(ligaHost()); }
function clWahlSuche(q){ CL_Q = q; const el = document.getElementById("clListe"); if(el) el.innerHTML = clWahlListe(); }
function clWahlKlick(i){
  const c = (CL_CLUBS.auswahl||[])[i]; if(!c) return;
  const k = CL_WAHL.indexOf(c.club), soll = CL_CLUBS.soll || 8;
  if(k>=0) CL_WAHL.splice(k, 1); else if(CL_WAHL.length < soll) CL_WAHL.push(c.club);
  drawLiga(ligaHost());
  const inp = document.getElementById("clSuche"); if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}
function clWahlWeg(i){ CL_WAHL.splice(i, 1); drawLiga(ligaHost()); }
function clWahlListe(){
  const n = cardNorm(CL_Q.trim()), soll = (CL_CLUBS && CL_CLUBS.soll) || 8;
  const alle = (CL_CLUBS && CL_CLUBS.auswahl) || [];
  const treffer = alle.map((c,i)=>({c,i})).filter(({c})=>!n || cardNorm(c.club).includes(n)).slice(0, n ? 60 : 36);
  if(!treffer.length) return `<div class="muted" style="font-size:12px;padding:6px 2px">Kein Verein in den aktuellen Importen.</div>`;
  return treffer.map(({c,i})=>{
    const on = CL_WAHL.includes(c.club), voll = !on && CL_WAHL.length >= soll;
    return `<button class="clopt${on?" on":""}"${voll?" disabled":""} onclick="clWahlKlick(${i})"
      title="${escAttr(`${c.club} – ${c.n} Spieler in den aktuellen Importen${c.kader===false ? " – nur gescoutet, Kader-Export fehlt"
        : c.kader ? " – per Kader-Export erfasst" : ""}`)}"><span class="clname">${esc2(c.club)}${c.kader==null ? ""
        : `<em class="${c.kader?"":"gesc"}">${c.kader ? "Kader" : "nur gescoutet"}</em>`}</span><span>${c.n}</span></button>`;
  }).join("");
}
function clWahlPanel(){
  if(!CL_CLUBS || !CL_CLUBS.ok) return `<div class="clwahl"><div class="dsub">${esc2((CL_CLUBS && CL_CLUBS.error) || "Vereine nicht verfügbar.")}</div></div>`;
  const soll = CL_CLUBS.soll || 8, min = CL_CLUBS.min_mit_daten || 6;
  const chips = CL_WAHL.map((c,i)=>`<span class="chip">${esc2(c)}<i onclick="clWahlWeg(${i})" title="entfernen">✕</i></span>`).join("")
    || `<span class="muted" style="font-size:12px">noch keiner gewählt</span>`;
  return `<div class="clwahl">
    <div class="dsec" style="margin-top:0">CL-Vergleichsvereine · ${CL_WAHL.length}/${soll}</div>
    <div class="clchips">${chips}</div>
    <input id="clSuche" type="search" placeholder="Verein suchen…" value="${escAttr(CL_Q)}"
      oninput="clWahlSuche(this.value)" autocomplete="off">
    <div class="clliste" id="clListe">${clWahlListe()}</div>
    <div class="muted" style="font-size:11.5px;margin:8px 0 10px;max-width:90ch">Zahl = Spieler dieses Vereins in den
      aktuellen Importen; „nur gescoutet" heißt: kein Kader-Export – sein bester Spieler ist dann oft nicht sein Stammspieler. Ein Verein zählt auf einer Position, sobald er dort Spieler in den Daten hat; unter ${min} von
      ${soll} Vereinen gibt es keine Aussage. Fehlende Kader in FM exportieren (Strg+P) und importieren.</div>
    <button onclick="clWahlSpeichern()"${CL_WAHL.length?"":" disabled"}>Übernehmen</button>
    <button class="linkbtn" style="margin-left:12px" onclick="clWahlAbbrechen()">abbrechen</button>
  </div>`;
}
async function clWahlSpeichern(){
  const api = API(); if(!api) return nurInApp();
  let r; try{ r = await api.set_cl_clubs(CL_WAHL); }catch(e){ r = {ok:false, error:String(e)}; }
  if(!r || !r.ok){ document.getElementById("status").textContent = "⚠ " + ((r && r.error) || "Vereine nicht gespeichert"); return; }
  CL_WAHL = null; CLV = null; LIGA_MASS = "cl";
  drawLigaHost(ligaHost());
}

// Meldeliste (D4): das Backend zählt, die Oberfläche zeigt nur an. Gerissen
// (pl.ok false) steht in Violett – kein Rot (Regel 2). ok null heißt: Status
// fehlen noch, der Text sagt was – neutral, keine Warnung.
function meldeZeile(m){
  if(!m || !m.pl) return "";
  const gf = (m.grenzfaelle||[]).length
    ? ` · <span title="U21-Grenze unsicher (Geburtsdatum ±1 Jahr): ${escAttr(m.grenzfaelle.join(", "))}">${m.grenzfaelle.length} Grenzfall${m.grenzfaelle.length>1?"e":""}</span>` : "";
  return `<div class="tmelde${m.pl.ok===false?" riss":""}">
      <span class="tmlab">Meldeliste</span> ${esc2(m.pl.text)}${gf}</div>${
      m.cl && m.cl.text ? `<div class="tmelde cl">${esc2(m.cl.text)}</div>` : ""}`;
}
// Meldestatus eines Spielers: fertiger Text aus dem Backend, Grenzfall dazu
// „Ausgebildet im Land (15–21)" -> „Land (15–21)": für die CL zählt genau das Detail
const hgKurz = t => String(t||"").replace(/^Ausgebildet im /, "");
const PL_FARBE = {heimisch:"var(--pos)", u21:"var(--pos)", braucht_platz:"var(--text)", unbekannt:"var(--dim)"};
const plZelle = s => !s.pl_text ? `<span class="cmleer">–</span>`
  : `<span style="font-size:12px;color:${PL_FARBE[s.pl_status]||"var(--text)"}">${esc2(s.pl_text)}</span>${
      s.pl_grenzfall ? ` <span class="rbadge" title="U21-Grenze unsicher – Geburtsdatum fehlt, ±1 Jahr">Grenzfall</span>` : ""}`;

// Rollenkürzel (D7) wie im Spiel, z.B. StS – nur an der Rolle, nie an der
// Position: kurz (TW, IV, ST …) und rolle_kurz sind bei DM/IAS/OM gleich und
// sähen nebeneinander doppelt aus.
const rolleKurz = s => s && s.rolle_kurz && s.rolle_kurz !== s.kurz
  ? ` <span class="rkurz" title="Rolle im Spiel">${esc2(s.rolle_kurz)}</span>` : "";
// Fuß zur Rolle (D12): sichtbar, nicht im Score. Nur inverse Flügel (streng)
// und Innenverteidiger (nur Hinweis); „neutral" bleibt in der Liste stumm.
const FUSS_KLASSE = {"passt":"fpasst", "gegen die Rolle":"fgegen", "neutral":"fneutral"};
const fussMarke = f => !f || f.passung === "neutral" ? ""
  : `<span class="rbadge ${f.passung==="passt" ? "kader" : "um"}" title="${escAttr(f.text)} – nicht im Score">${
      f.passung==="passt" ? "Fuß passt" : "Fuß gegen Rolle"}</span>`;

// ---- Rückfrage beim Kader-Import (D10) ----------------------------------
// Die Datei ist der Kader eines FREMDEN Vereins – fast immer ein Versehen
// (Kader eines CL-Vergleichsvereins über den falschen Knopf). Deshalb ist
// „Abbrechen" die Voreinstellung: gefüllt, fokussiert, Esc und Klick daneben
// brechen ab. Übernehmen gibt es nur als Kontur-Knopf.
function kaderRueckfrage(r){
  schliesseRueckfrage();
  const m = document.createElement("div");
  m.id = "rueckModal"; m.className = "cmpmodal on";
  m.onclick = e => { if(e.target === m) kaderRueckfrageAntwort(false); };
  m.innerHTML = `<div class="cmpbox rueckbox" role="alertdialog" aria-modal="true"
      aria-labelledby="rueckT" aria-describedby="rueckH">
    <div class="dsec" style="margin-top:0">Kader-Import · Rückfrage</div>
    <h2 id="rueckT">${esc2(r.frage || "Die Datei ist nicht der eigene Kader. Trotzdem übernehmen?")}</h2>
    <p id="rueckH" class="muted">${esc2(r.hinweis || "")}</p>
    <div class="rueckmeta">Datei: <b>${esc2(r.verein_datei || "?")}</b>${r.anzahl ? ` · ${r.anzahl} Spieler` : ""}
      · bisher: <b>${esc2(r.verein_bisher || "?")}</b></div>
    <div class="rueckknoepfe">
      <button id="rueckNein" onclick="kaderRueckfrageAntwort(false)">Abbrechen</button>
      <button class="ghost" onclick="kaderRueckfrageAntwort(true)">Als eigenen Kader übernehmen</button>
    </div></div>`;
  document.body.appendChild(m);
  document.getElementById("rueckNein").focus();
}
function schliesseRueckfrage(){ const m = document.getElementById("rueckModal"); if(m) m.remove(); }
async function kaderRueckfrageAntwort(ja){
  const api = API(); if(!api) return nurInApp();
  const st = document.getElementById("status");
  schliesseRueckfrage();
  let r; try{ r = ja ? await api.import_squad_confirm() : await api.import_squad_cancel(); }
  catch(e){ r = {ok:false, error:String(e)}; }
  if(!r || !r.ok){ st.textContent = "⚠ " + ((r && r.error) || "Kader-Import fehlgeschlagen"); return; }
  if(!ja){ st.textContent = "Kader unverändert – die Spieler der Datei sind wie bei „Import“ eingelesen."; return; }
  st.textContent = `Kader importiert: ${r.anzahl} Spieler von ${r.verein}`
    + (r.verliehen ? ` · ${r.verliehen} verliehene ausgelassen` : "");
  TACT_SQUADS = null; TACT = null; TACT_SLOT = null; TACT_PID = null;
  renderTactic();
}

function tactPick(k){ TACT_SLOT=k; TACT_PID=null; drawTactic(document.getElementById("tableHost")); }
function tactPlayer(id){ TACT_PID = (TACT_PID===id?null:id); drawTactic(document.getElementById("tableHost")); }

// ======================= Ersatzsuche ========================================
// Rechtsklick auf einen Kandidaten -> Ersatz suchen. Drei Fragen, die man beim
// Ersetzen wirklich stellt: gleicher Spielertyp auf gleichem Niveau, klar
// stärker, oder gleich stark und jünger. Positionsfremde Spieler sind
// zugelassen – in FM lässt sich umschulen, deshalb kostet das nur Score-Punkte
// statt auszuschließen (siehe tactics.UMSCHULUNG_KANTEN).
let REPL_ARCH = null;      // beim Spezialisten: worin er herausragen soll
let TACT_ARCH = null;      // Archetypen je Position, einmal vom Backend geholt
let REPL_ALLE = false;     // false = nur Importe seit dem Kader-Import, true = alle
let REPL_NUR_CHAR = false; // true = Kandidaten ohne gescoutete Persönlichkeit ausblenden
let REPL = null, REPL_MODE = "aehnlich", REPL_PID = null, REPL_MIN = 180,
    REPL_FOR = null,       // {id, slot} – wofür das Fenster gerade offen ist
    CTX = null;            // offenes Kontextmenü

const REPL_MODI = [
  ["aehnlich", "Ähnliches Profil",
   "Gleiches Niveau (±8 Punkte), sortiert nach Ähnlichkeit der Kennzahlen."],
  ["besser", "Stärker",
   "Mindestens 3 Punkte besser auf dieser Position, sortiert nach Score."],
  ["spezialist", "Spezialist",
   "Ragt in einer Teildisziplin heraus (ab 75. Perzentil) und darf dafür im "
   + "Gesamtscore bis zu 12 Punkte abfallen."],
  ["juenger", "Jünger",
   "Mindestens 2 Jahre jünger und höchstens 5 Punkte schwächer."],
];

function tactMenu(ev, id){
  ev.preventDefault();
  const slot = TACT && TACT.slots.find(s=>s.key===TACT_SLOT);
  const c = slot && slot.kandidaten.find(k=>k.id===id);
  closeCtx();
  const m = document.createElement("div");
  m.className = "ctxmenu";
  // Archetypen der Position: sie kommen aus dem Backend (tactics.ARCHETYPEN)
  // und stehen in TACT_ARCH, sobald das Brett geladen wurde.
  const arch = (TACT_ARCH && TACT_ARCH[TACT_SLOT]) || [];
  const archBtns = arch.map(a =>
    `<button class="ctxsub" onclick="closeCtx();openRepl(${id},'spezialist','${a.key}')"`
    + ` title="${esc2(a.stats.join(', '))}">${esc2(a.label)}</button>`).join("");
  // Manuell aufstellen: der Pin ueberschreibt die Automatik fuer diesen Slot.
  // Steht der Spieler hier schon per Pin, bietet das Menue das Loesen an.
  const pinBtn = (c && slot && c.id===slot.startelf_id && slot.gepinnt)
    ? `<button onclick="closeCtx();pinSetzen('${slot.key}',null)">Pin lösen – wieder automatisch</button>`
    : `<button onclick="closeCtx();pinSetzen('${slot?slot.key:TACT_SLOT}',${id})">Hier aufstellen (manuell)</button>`;
  m.innerHTML = `<div class="ctxhead">${esc2(c?c.name:"Spieler")}</div>
    ${pinBtn}
    <div class="ctxsep"></div>
    <button onclick="closeCtx();openRepl(${id},'besser')">Bessere Alternative…</button>
    <button onclick="closeCtx();openRepl(${id},'aehnlich')">Alternative…</button>
    ${arch.length ? `<div class="ctxsep">Spezialist für…</div>${archBtns}` : ""}
    <div class="ctxsep"></div>
    <button onclick="closeCtx();tactPlayer(${id})">Kennzahlen anzeigen</button>`;
  document.body.appendChild(m);
  // Erst messen, dann setzen – sonst läuft das Menü am rechten/unteren Rand
  // aus dem Fenster heraus.
  const r = m.getBoundingClientRect();
  m.style.left = Math.max(4, Math.min(ev.clientX, innerWidth - r.width - 8)) + "px";
  m.style.top  = Math.max(4, Math.min(ev.clientY, innerHeight - r.height - 8)) + "px";
  CTX = m;
  // Nicht {once:true} auf mousedown: der Klick auf einen Menüeintrag löst
  // zuerst mousedown aus, das Menü wäre weg, bevor click ankommt.
  document.addEventListener("mousedown", ctxOutside, true);
  return false;
}
function ctxOutside(e){ if(CTX && !CTX.contains(e.target)) closeCtx(); }
function closeCtx(){
  if(!CTX) return;
  document.removeEventListener("mousedown", ctxOutside, true);
  CTX.remove(); CTX = null;
}

async function openRepl(id, modus, archetyp){
  REPL_FOR = {id, slot: TACT_SLOT};
  REPL = null; REPL_PID = null;
  if(modus) REPL_MODE = modus;
  REPL_ARCH = archetyp || null;
  document.getElementById("replModal").classList.add("on");
  await loadRepl();
}
function closeRepl(){
  document.getElementById("replModal").classList.remove("on");
  REPL = null; REPL_FOR = null; REPL_PID = null;
}
async function loadRepl(){
  const api = API(); if(!api || !REPL_FOR) return;
  REPL = null; drawRepl();
  try{
    REPL = await api.tactic_replacements(REPL_FOR.slot, REPL_FOR.id,
                                         REPL_MODE, REPL_MIN, REPL_ARCH, REPL_ALLE,
                                         REPL_NUR_CHAR);
  }catch(e){ REPL = {ok:false, error:String(e)}; }
  drawRepl();
}
function setReplMode(m, arch){
  // Der Spezialist braucht immer einen Archetyp; ohne einen ist der Modus
  // sinnlos, deshalb faellt er dann auf den ersten der Position zurueck.
  if(m==="spezialist" && !arch){
    const a = (TACT_ARCH && TACT_ARCH[REPL_FOR && REPL_FOR.slot]) || [];
    if(!a.length) return;
    arch = a[0].key;
  }
  if(m===REPL_MODE && (arch||null)===REPL_ARCH) return;
  REPL_MODE=m; REPL_ARCH=(m==="spezialist"?arch:null); REPL_PID=null; loadRepl();
}
function setReplAlle(v){ REPL_ALLE = (v==="alle"); REPL_PID=null; loadRepl(); }
function setReplNurChar(on){ REPL_NUR_CHAR = !!on; REPL_PID=null; loadRepl(); }
function setReplMin(v){ REPL_MIN=+v; REPL_PID=null; loadRepl(); }
function replPick(id){ REPL_PID = (REPL_PID===id?null:id); drawRepl(); }
// Kandidat aus der Ersatzsuche in den Slot-Vergleich legen (oder wieder heraus)
function replVergleich(id){
  if(REPL_FOR) CMP_SLOT = REPL_FOR.slot;
  const c = REPL && REPL.treffer ? REPL.treffer.find(t=>t.id===id) : null;
  if(COMPARE.includes(id)) removeCompare(id); else addCompare(id, c ? c.name : null);
  drawRepl();
}

const replVal = v => v==null ? "" :
  (v>=1e6 ? (v/1e6).toFixed(1).replace(".",",")+" M€" : Math.round(v/1e3)+" k€");
const replNum = (t,v) => v==null ? "–"
  : t==="pct" ? Math.round(v)+" %" : t==="1f" ? (+v).toFixed(1) : (+v).toFixed(2);

function drawRepl(){
  const box = document.getElementById("replBox");
  const slot = TACT && TACT.slots.find(s=>s.key===(REPL_FOR&&REPL_FOR.slot));
  // Liegen Kandidaten im Vergleich, führt ein Knopf direkt hinein – die
  // Vergleichsleiste selbst liegt unter diesem Fenster.
  const vglKnopf = COMPARE.length && REPL_FOR
    ? `<button class="wbtn on" onclick="openCompare('${REPL_FOR.slot}')">Vergleichen (${COMPARE.length})</button>` : "";
  const kopf = `<div class="dhead">
      <h2>Ersatz suchen${slot?` – ${esc2(slot.label)}`:""}</h2>
      ${vglKnopf}<button class="xbtn" onclick="closeRepl()">✕</button></div>${
      slot && slot.rolle ? `<div class="replrolle">${esc2(slot.rolle)}${rolleKurz(slot)} · ${esc2(slot.duty||"")}</div>` : ""}`;
  if(!REPL){
    box.innerHTML = kopf + `<div class="empty"><span class="spin"></span>
      suche im gesamten Datenbestand…</div>`;
    return;
  }
  if(!REPL.ok){
    box.innerHTML = kopf + `<div class="dsub">${esc2(REPL.error
      || (REPL.kein_kader ? "Erst einen Kader auswählen." : "Keine Auswertung möglich."))}</div>`
      + replSteuerung();
    return;
  }
  const o = REPL.original;
  const modus = REPL_MODI.find(m=>m[0]===REPL.modus) || REPL_MODI[0];

  const zeilen = REPL.treffer.map(c=>{
    const marken =
      (c.umschulung ? `<span class="rbadge um"
          title="Spielt bisher: ${esc2(c.umschulung)} – Umschulung kostet ${c.abzug} Punkte">umschulen −${c.abzug}</span>` : "")
      + (c.im_kader ? `<span class="rbadge kader">eigener Kader</span>` : "")
      + fussMarke(c.fuss_passung)
      + (c.stale ? `<span class="rbadge" title="Zahlen aus einem älteren Scan${
          c.stand?" ("+esc2(String(c.stand).slice(0,10))+")":""}">alt</span>` : "");
    const pos = (c.gruppen||[]).slice(0,3).map(g=>g.toUpperCase()).join(" ")
      + ((c.gruppen||[]).length>3 ? "…" : "");
    const info = [c.club ? esc2(c.club) : "", replVal(c.value),
      c.stand ? `<span class="muted" title="Import-Datum dieser Zeile">Stand ${String(c.stand).slice(8,10)}.${String(c.stand).slice(5,7)}.</span>` : ""
    ].filter(Boolean).join(" · ");
    const det = c.id===REPL_PID
      ? `<tr class="rdet"><td colspan="11">${replDetail(c)}</td></tr>` : "";
    const imVgl = COMPARE.includes(c.id);
    return `<tr class="${c.id===REPL_PID?"rsel":""}" onclick="replPick(${c.id})">
      <td>${scorePill(c)}</td>
      <td class="muted" style="font-family:var(--mono)">${c.fit??"–"}</td>
      <td>${dnaCell(c)}</td>
      ${persTd(c)}
      <td class="${c.delta_score>0?"pos":c.delta_score<0?"neg":"muted"}">${c.delta_score>0?"+":""}${c.delta_score}</td>
      <td class="${REPL.modus==="spezialist"?"":"muted"}"${
        REPL.modus==="spezialist"
          ? ` title="Perzentil in ${esc2(REPL.archetyp_label||"")} – danach ist sortiert"`
          : ""}>${REPL.modus==="spezialist"
            ? (c.archetyp_pct==null?"–":c.archetyp_pct)
            : (c.aehnlichkeit==null?"–":c.aehnlichkeit)}</td>
      <td class="name">${esc2(c.name)}${marken}</td>
      <td class="muted" style="font-family:var(--mono);font-size:10.5px">${pos}</td>
      <td>${c.age==null?"–":Math.round(c.age)}${
        c.delta_age!=null&&c.delta_age<0?`<span class="muted" style="font-size:10px"> ${c.delta_age}</span>`:""}</td>
      <td class="muted">${Math.round(c.minutes||0)}</td>
      <td class="info">${info}</td>
      <td class="vgl" onclick="event.stopPropagation()"><input type="checkbox"${imVgl?" checked":""}
        aria-label="${esc2(c.name)} in den Slot-Vergleich" title="${imVgl
        ? "aus dem Vergleich nehmen" : "in den Slot-Vergleich legen – gegen Stamm und Backup"}"
        onchange="replVergleich(${c.id})"></td></tr>${det}`;
  }).join("");

  const leer = `<div class="empty" style="padding:26px 8px">
    <h2>Kein Treffer</h2>
    <div class="muted" style="font-size:12.5px;max-width:62ch;margin:0 auto">
      ${esc2(modus[2])} Darauf passt im Datenbestand niemand.
      ${REPL.geprueft} Spieler wurden geprüft – mehr werden es, wenn die
      Mindestminuten sinken oder der Scouting-Modus weitere Spieler einliest.</div></div>`;

  box.innerHTML = kopf
    + `<div class="dsub">Zu ersetzen: <b>${esc2(o.name)}</b> · Gesamt ${o.score}
        · Fit ${o.fit??"–"} · Charakter ${o.charakter??"ungescoutet"}
        · ${o.age==null?"Alter unbekannt":Math.round(o.age)+" Jahre"}
        · ${Math.round(o.minutes||0)} Minuten</div>`
    + replSteuerung()
    + `<div class="muted" style="font-size:11.5px;margin:8px 0 2px;max-width:74ch">
        ${esc2(modus[2])} Positionsfremde Spieler sind dabei – ihr Fit ist um
        den Umschulungsaufwand gemindert. Gesamt = Fit^0,7 × Charakter^0,3;
        ohne gescoutete Persönlichkeit zählt der Fit allein.
        Kandidaten: ${REPL.pool||REPL.geprueft} Export-Spieler${REPL.stand
          ? `, importiert seit ${REPL.stand.slice(8,10)}.${REPL.stand.slice(5,7)}.${REPL.stand.slice(0,4)}` : " aus allen Importen"}.
        <b>${REPL.gefunden}</b> von ${REPL.geprueft} geprüften Spielern passen,
        Perzentile gegen ${REPL.vergleichsbasis} Spieler dieser Position.</div>`
    + (REPL.treffer.length ? `<table class="repl"><thead><tr>
        <th title="Fit^0,7 × Charakter^0,3 nach Abzug für Umschulung – ohne gescoutete Persönlichkeit nur der Fit">Gesamt</th>
        <th title="Positions-Fit nach Abzug für Umschulung – die Ersatzsuche ist eine Slot-Suche">Fit</th>
        <th title="Vereins-DNA: passstark × Ballgewinner">DNA</th>
        <th title="Persönlichkeit aus dem Spielerprofil">Charakter</th>
        <th title="Unterschied zum aktuellen Spieler">Δ</th>
        ${REPL.modus==="spezialist"
          ? `<th title="Wie stark der Spieler in ${esc2(REPL.archetyp_label||"dieser Teildisziplin")} ist (Perzentil)">${esc2(REPL.archetyp_label||"Spezial")}</th>`
          : `<th title="Übereinstimmung der Kennzahlen-Perzentile, 100 = deckungsgleich">Ähnl</th>`}
        <th style="text-align:left">Spieler</th>
        <th title="Positionen, die er heute schon spielt">Pos</th>
        <th>Alter</th><th>Min</th><th style="text-align:left">Verein / Wert</th>
        <th title="In den Slot-Vergleich legen – bis zu drei Kandidaten gegen Stamm und Backup">Vgl</th>
      </tr></thead><tbody>${zeilen}</tbody></table>
      <div class="muted" style="font-size:11px;margin-top:8px">
        Zeile anklicken: Kennzahl für Kennzahl gegen ${esc2(o.name)}.</div>` : leer);
}

function replSteuerung(){
  const seg = REPL_MODI.map(([k,l])=>
    `<button class="${k===REPL_MODE?"on":""}" onclick="setReplMode('${k}')">${l}</button>`).join("");
  const opt = [90,180,270,450].map(v=>
    `<option value="${v}"${v===REPL_MIN?" selected":""}>ab ${v} Min</option>`).join("");
  // Die Archetypen-Leiste erscheint nur im Spezialisten-Modus – in den anderen
  // Modi waere sie ohne Wirkung und wuerde nur Platz kosten.
  const arch = (TACT_ARCH && REPL_FOR && TACT_ARCH[REPL_FOR.slot]) || [];
  const archSeg = (REPL_MODE==="spezialist" && arch.length)
    ? `<div class="seg archseg">` + arch.map(a =>
        `<button class="${a.key===REPL_ARCH?"on":""}"`
        + ` title="${esc2(a.stats.join(', '))}"`
        + ` onclick="setReplMode('spezialist','${a.key}')">${esc2(a.label)}</button>`
      ).join("") + `</div>` : "";
  return `<div class="replhead">
    <div class="seg">${seg}</div>
    <select onchange="setReplMin(this.value)" title="Unter dieser Spielzeit sind die /90-Werte Rauschen">${opt}</select>
    <select onchange="setReplAlle(this.value)" title="Welche Importe als Kandidaten zählen. Aktuell = seit dem letzten Kader-Import (3 Tage Toleranz)">
      <option value="aktuell"${REPL_ALLE?"":" selected"}>nur aktuelle Importe</option>
      <option value="alle"${REPL_ALLE?" selected":""}>alle Importe</option>
    </select>
    <label class="muted" style="font-size:11.5px;margin-left:8px;cursor:pointer"
      title="Kandidaten ohne gescoutete Persönlichkeit ausblenden – sonst steht ein Ungescouteter mit nacktem Fit neben einem Gescouteten mit Charakterfaktor">
      <input type="checkbox" onchange="setReplNurChar(this.checked)"${REPL_NUR_CHAR?" checked":""}> nur mit Persönlichkeit</label>
  </div>${archSeg}`;
}

// Gegenüberstellung: je Kennzahl der zu ersetzende Spieler (grau) über dem
// Kandidaten (Hitzefarbe). Zwei Balken statt einer Differenz, weil erst die
// Lage beider Werte zeigt, WOHER der Unterschied kommt.
function replDetail(c){
  const o = {}; (REPL.original.teile||[]).forEach(t=>o[t.stat]=t);
  const rows = c.teile.map(t=>{
    const ot = o[t.stat] || {};
    const col = (t.pct||0)>=50 ? "var(--heat-pos)" : "var(--heat-neg)";
    const bar = (pct,wert,fill) => `<div class="rline">
      <span class="rtrack"><i style="width:${pct==null?0:pct}%;background:${fill}"></i></span>
      <b>${pct==null?"–":pct}</b>
      <span class="rval">${replNum(t.format, wert)}</span></div>`;
    return `<div class="rcmp" title="Gewicht ${t.gewicht}">
      <span class="rlab">${esc2(t.label)}</span>
      <span>${bar(ot.pct, ot.wert, "var(--dim)")}${bar(t.pct, t.wert, `rgba(${col},.85)`)}</span>
    </div>`;
  }).join("");
  const hin = c.abzug
    ? `<div class="muted" style="font-size:11.5px;margin-top:8px">
        Spielt bisher <b>${esc2(c.umschulung)}</b>: Positions-Fit
        ${c.score_pos} minus ${c.abzug} Punkte Umschulung = ${c.fit}.</div>` : "";
  const chr = c.charakter!=null
    ? `<div class="muted" style="font-size:11.5px;margin-top:4px">
        Gesamt ${c.score} = Fit ${c.fit} und Charakter ${c.charakter}
        (Gewicht 0,3, geometrisch).</div>`
    : `<div class="muted" style="font-size:11.5px;margin-top:4px">
        Persönlichkeit ungescoutet – Gesamt ist der Fit allein.</div>`;
  const duenn = c.verlaesslich<DUENN
    ? `<div class="muted" style="font-size:11.5px;margin-top:4px">
        Nur ${Math.round(c.minutes||0)} Minuten – der Score wird nicht
        heruntergerechnet, kann aber auf wenigen Spielen beruhen.</div>` : "";
  return `<div class="muted" style="font-size:11px;margin-bottom:6px">
      oben <b>${esc2(REPL.original.name)}</b> (grau) · unten
      <b>${esc2(c.name)}</b> · Perzentil unter allen Spielern dieser Position,
      rechts der Wert</div>${rows}${hin}${chr}${duenn}`;
}

document.addEventListener("keydown", e=>{
  if(e.key!=="Escape") return;
  if(document.getElementById("rueckModal")){ kaderRueckfrageAntwort(false); return; }
  if(CTX){ closeCtx(); return; }

function setCardView(v){ CARD_VIEW=v; renderCards(); }

// ---- Spielersuche fuer die Dossier-Auswahl -------------------------------
// Der Pool hat mehrere tausend Eintraege; ein reines Dropdown ist damit nicht
// mehr bedienbar. Diakritika werden weggefaltet, damit "estevao" auch
// "Estêvão" findet und "velickovic" auch "Veličković".
let CARD_FILTER = "";
// eigener Helfer: das esc() in cardEditor() ist dort lokal, hier nicht sichtbar
const escAttr = s => (s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;")
  .replace(/</g, "&lt;");
const cardNorm = s => (s || "").normalize("NFD")
  .replace(/[\u0300-\u036f]/g, "").toLowerCase();

function cardMatches(){
  const field = PLAYERS.filter(p => p.id != null)
    .sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
  const q = cardNorm(CARD_FILTER).trim();
  const matches = q ? field.filter(p => cardNorm(p.name).includes(q)) : field;
  // Der gerade gezeigte Spieler bleibt waehlbar, auch wenn er nicht zur Suche
  // passt - sonst zeigt die Karte jemanden, der nicht in der Liste steht.
  // Er zaehlt aber NICHT als Treffer, sonst meldet die Suche bei null Treffern
  // faelschlich einen.
  let list = matches;
  if(CARD_PID != null && !list.some(p => p.id === CARD_PID)){
    const cur = field.find(p => p.id === CARD_PID);
    if(cur) list = [cur].concat(list);
  }
  return {field, list, matches};
}
function cardOptionsHtml(list){
  return list.map(q => `<option value="${q.id}"${q.id===CARD_PID?" selected":""}>`
    + `${q.name}${q.score!=null?" · "+q.score:""}${q.age?" · "+Math.round(q.age)+"J":""}`
    + `</option>`).join("");
}
function cardCountHtml(field, matches){
  if(!cardNorm(CARD_FILTER).trim()) return `${field.length} Spieler im Pool`;
  return matches.length
    ? `${matches.length} von ${field.length} · Enter wählt den ersten Treffer`
    : `kein Treffer – die Suche geht nur über den Namen`;
}
function cardFilter(v){
  CARD_FILTER = v;
  const {field, list, matches} = cardMatches();
  const sel = document.getElementById("cardPlayer");
  if(sel) sel.innerHTML = cardOptionsHtml(list);
  const info = document.getElementById("cardCount");
  if(info) info.textContent = cardCountHtml(field, matches);
}
function cardSearchKey(ev){
  if(ev.key !== "Enter") return;
  ev.preventDefault();
  const {matches} = cardMatches();
  if(matches.length) cardSelectPlayer(matches[0].id);
}

function renderCards(){
  const host=document.getElementById("tableHost");
  const nav=`<div class="seg" style="margin:0 0 14px">
    <button class="${CARD_VIEW==='edit'?'on':''}" onclick="setCardView('edit')">Dossier erstellen</button>
    <button class="${CARD_VIEW==='gallery'?'on':''}" onclick="setCardView('gallery')">Hall of Fame</button></div>`;
  if(CARD_VIEW==="gallery"){ host.innerHTML=nav+`<div id="galHost" class="muted">lade…</div>`;
    renderGallery(document.getElementById("galHost")); return; }
  const all=PLAYERS.filter(p=>p.id!=null).sort((a,b)=>(b.score??-1)-(a.score??-1));

  const p=PLAYERS.find(q=>q.id===CARD_PID);
  if(!CARD || CARD.pid!==p.id) CARD=cardConfigFor(p);
  const {field, list, matches}=cardMatches();
  host.innerHTML=nav+`<div class="cardwrap">
    <div class="cardstage">

  loadCardSources(p.id);
}

// SVG -> PNG (hochauflösend); eingebettete Bilder/Emoji sind data-URIs -> kein Taint
function cardToPng(cb){
  const svg=document.querySelector("svg.cardsvg"); if(!svg){ cb(null); return; }
  const xml=new XMLSerializer().serializeToString(svg);
  const src="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(xml)));
  const img=new Image();
  img.onload=()=>{ const s=3, cv=document.createElement("canvas");
    cv.width=340*s; cv.height=480*s; const x=cv.getContext("2d");
    x.drawImage(img,0,0,cv.width,cv.height);
    try{ cb(cv.toDataURL("image/png")); }catch(e){ cb(null); } };
  img.onerror=()=>cb(null); img.src=src;
}
async function cardExportPng(){
  cardToPng(async d=>{
    const st=document.getElementById("status");
    if(!d){ st.textContent="⚠ PNG-Export fehlgeschlagen."; return; }

      else if(r&&r.error) st.textContent="⚠ "+r.error; }

  });
}

// Zeilendeckel. Der Pool hat inzwischen 13.000 Spieler, die mit 19 Spalten
// eine Viertelmillion Zellen ergeben – innerHTML davon plus Layout blockiert
// die Oberfläche sekundenlang und fühlt sich wie ein Hänger an. Gezeigt werden
// die ersten TABLE_MAX nach Sortierung; das ist ohnehin, was man anschaut.
// Die Hitzefarben werden weiter über ALLE Zeilen skaliert, sonst hinge die
// Farbe eines Werts davon ab, ob gerade 300 oder 13.000 Zeilen stehen.
const TABLE_MAX = 300;
let TABLE_ALLE = false;
function tableAlle(){ TABLE_ALLE = true; render(); }

function renderTable(rows, C){
  rows = rows.slice().sort((a,b)=>{
    const x=a[sortKey]??0, y=b[sortKey]??0;
    return sortDesc ? (y>x?1:y<x?-1:0) : (x>y?1:x<y?-1:0);
  });
  HEAT = {};
  for(const [k] of C){
    if(!(k in HEAT_COLS)) continue;
    const vals = rows.map(p=>+p[k]).filter(v=>!isNaN(v));
    if(vals.length) HEAT[k] = [Math.min(...vals), Math.max(...vals)];
  }
  const th = C.map(([k,l])=>
    `<th class="${k===sortKey?'active':''}"${COL_TIPS[k]?` title="${COL_TIPS[k]}"`:""} onclick="sortBy('${k}')">${l}</th>`).join("");
  const gedeckelt = !TABLE_ALLE && rows.length > TABLE_MAX;
  const shown = gedeckelt ? rows.slice(0, TABLE_MAX) : rows;
  const body = shown.map(p=>
    `<tr${p.id!=null?` onclick="openDetail(${p.id})"`:""}>${C.map(([k])=>cell(p,k)).join("")}</tr>`).join("");
  const rest = gedeckelt ? `<div class="muted" style="font-size:12px;padding:10px 8px 18px">
      Die ersten ${TABLE_MAX} von ${rows.length} nach Sortierung.
      <button class="linkbtn" onclick="tableAlle()">alle ${rows.length} anzeigen</button>
      – oder über Suche, Minuten und Filter eingrenzen.</div>` : "";
  document.getElementById("tableHost").innerHTML =
    `<table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table>${rest}`;
}

function niceStep(raw){
  const p = Math.pow(10, Math.floor(Math.log10(raw||1)));
  const n = raw/p; return (n<1.5?1:n<3?2:n<7?5:10)*p;
}

function renderChart(rows){
  const host = document.getElementById("tableHost");
  const mx = metricsFor(), lab = k => (mx.find(m=>m[0]===k)||[k,k])[1];
  const xk=xKey, yk=yKey;
  const xs = rows.map(p=>+(p[xk]??0)), ys = rows.map(p=>+(p[yk]??0));
  const W=1180,H=560,mg={l:60,r:30,t:26,b:50}, iw=W-mg.l-mg.r, ih=H-mg.t-mg.b;
  function dom(a){ let lo=Math.min(...a), hi=Math.max(...a);
    if(lo>0) lo=0; if(hi<0) hi=0; if(lo===hi){lo-=1;hi+=1;}
    const pad=(hi-lo)*0.08; return [lo-pad, hi+pad]; }
  const [x0,x1]=dom(xs), [y0,y1]=dom(ys);
  const X=v=>mg.l+(v-x0)/(x1-x0)*iw, Y=v=>mg.t+ih-(v-y0)/(y1-y0)*ih;
  const mean=a=>a.reduce((s,v)=>s+v,0)/a.length, ax=mean(xs), ay=mean(ys);
  function ticks(lo,hi){ const st=niceStep((hi-lo)/6), out=[];
    for(let v=Math.ceil(lo/st)*st; v<=hi+1e-9; v+=st) out.push(+v.toFixed(4)); return out; }
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  ticks(x0,x1).forEach(v=>{ const px=X(v);
    s+=`<line class="grid" x1="${px}" y1="${mg.t}" x2="${px}" y2="${mg.t+ih}"/>`;
    s+=`<text x="${px}" y="${mg.t+ih+16}" text-anchor="middle">${+v.toFixed(2)}</text>`; });
  ticks(y0,y1).forEach(v=>{ const py=Y(v);
    s+=`<line class="grid" x1="${mg.l}" y1="${py}" x2="${mg.l+iw}" y2="${py}"/>`;
    s+=`<text x="${mg.l-8}" y="${py+3}" text-anchor="end">${+v.toFixed(2)}</text>`; });
  s+=`<line class="axis" x1="${mg.l}" y1="${mg.t}" x2="${mg.l}" y2="${mg.t+ih}"/>`;
  s+=`<line class="axis" x1="${mg.l}" y1="${mg.t+ih}" x2="${mg.l+iw}" y2="${mg.t+ih}"/>`;
  s+=`<line class="avg" x1="${X(ax)}" y1="${mg.t}" x2="${X(ax)}" y2="${mg.t+ih}"/>`;
  s+=`<line class="avg" x1="${mg.l}" y1="${Y(ay)}" x2="${mg.l+iw}" y2="${Y(ay)}"/>`;
  s+=`<text class="avglab" x="${X(ax)+4}" y="${mg.t+11}">Ø ${ax.toFixed(2)}</text>`;
  s+=`<text class="avglab" x="${mg.l+iw-4}" y="${Y(ay)-4}" text-anchor="end">Ø ${ay.toFixed(2)}</text>`;
  // Punktfarbe = Positionsgruppe, dieselbe Rampe wie im Leitschild links.
  // Damit sieht man auf einen Blick, ob ein Ausreisser ein Stuermer oder ein
  // Innenverteidiger ist – vorher waren alle Punkte gleich blau.
  rows.forEach((p,i)=>{
    const g = p.is_gk ? "tw" : ((p.pos_groups||[])[0] || "unk");
    const f = g==="unk" ? "var(--dim)" : `var(--pg-${g})`;
    s+=`<circle class="dot" data-i="${i}" cx="${X(xs[i]).toFixed(1)}" cy="${Y(ys[i]).toFixed(1)}" r="5" style="fill:${f}"/>`; });
  s+=`<text class="axlabel" x="${mg.l+iw/2}" y="${H-8}" text-anchor="middle">${lab(xk)} →</text>`;
  s+=`<text class="axlabel" transform="translate(16 ${mg.t+ih/2}) rotate(-90)" text-anchor="middle">${lab(yk)} →</text>`;
  s+=`</svg>`;
  host.innerHTML = `<div class="chartwrap">${s}<div class="tip" id="tip"></div></div>`;
  const tip=document.getElementById("tip"), wrap=host.querySelector(".chartwrap");
  host.querySelectorAll("circle.dot").forEach(c=>{
    c.addEventListener("mouseenter",()=>{ const i=+c.dataset.i, p=rows[i];
      c.classList.add("hot"); c.setAttribute("r","7");
      tip.innerHTML=`<b>${p.name}</b>${p.pos_label?' · '+p.pos_label:''}<br>`
        +`${lab(xk)}: ${fmt(xs[i])}<br>${lab(yk)}: ${fmt(ys[i])}<br>`
        +`<span class="muted">${p.minutes||0} Min</span>`;
      tip.style.display="block"; });
    c.addEventListener("mousemove",e=>{ const r=wrap.getBoundingClientRect();
      tip.style.left=Math.min(e.clientX-r.left+14, r.width-tip.offsetWidth-6)+"px";
      tip.style.top=(e.clientY-r.top+14)+"px"; });
    c.addEventListener("mouseleave",()=>{ c.classList.remove("hot"); c.setAttribute("r","5"); tip.style.display="none"; });
    c.addEventListener("click",()=>{ const p=rows[+c.dataset.i]; if(p&&p.id!=null) openDetail(p.id); });
  });
}
