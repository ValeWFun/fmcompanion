  applyTheme(cur==="dark"?"light":"dark");
}

// Excel-Heat: Metrik-Zellen relativ zur Spalte einfaerben (0=weniger ist besser)
const HEAT_COLS = {goals:0,assists:0,xg:0,xa:0,shots_on:0,dribbles:0,duels:0,
  prog_passes:0,press_win:0,interceptions:0,clearances:0,headers_won:0,apps:0,
  pass_pct:0,duel_pct:0,header_pct:0,shot_acc:0,xga:0,
  losses:1,fouls:1,conceded:1};
let HEAT = {};
function heatStyle(v,lo,hi,invert){
  if(hi<=lo) return "";
  let t=(v-lo)/(hi-lo); if(invert) t=1-t;
  // Deckung bewusst niedrig: Gruen und Violett sind gesaettigt, bei der alten
  // Obergrenze (0.5) wird die Tabelle zum Flickenteppich statt zur Messreihe.
  const a=(Math.abs(t-0.5)*0.34).toFixed(2);
  return `background:rgba(var(${t>=0.5?"--heat-pos":"--heat-neg"}),${a})`;
}
function heatTd(key, inner, v){
  if(key in HEAT_COLS && HEAT[key])
    return `<td style="${heatStyle(+v||0, HEAT[key][0], HEAT[key][1], HEAT_COLS[key])}">${inner}</td>`;
  return `<td>${inner}</td>`;
}

function cell(p, key){
  if(key==="name"){
    const rel = p.reliability!=null ? p.reliability : 1;
    const dim = rel < 0.34 ? ' title="kleine Stichprobe" style="opacity:.6"' : '';
    // im Pool-Modus: aeltere Staende mit "Stand vom"-Datum kennzeichnen
    const stale = (SRC==="pool" && p.stale && p.taken_at)
      ? ` <span class="muted" style="font-size:11px" title="Stand vom ${p.taken_at.replace('T',' ')}">· ${p.taken_at.slice(8,10)}.${p.taken_at.slice(5,7)}.</span>`
      : "";
    // Exp = der Spieler steht nur im Export. Exp↑ = er steht in beiden, aber
    // der Export hat mehr Minuten und gewinnt deshalb bei den Zahlen.
    const badge = p.source==="export"
      ? ` <span class="srcbadge" title="aus FM-Export (nicht im RAM), Stand ${(p.exp_at||'').slice(0,10)}">Exp</span>`
      : p.stat_quelle==="export"
      ? ` <span class="srcbadge" title="Zahlen aus dem FM-Export (Stand ${(p.stat_stand||'').slice(0,10)}) – der Speicher hatte weniger Minuten, also einen unvollständigen Stand">Exp↑</span>` : "";
    return `<td class="name">${starHtml(p)}<span${dim}>${p.name}</span>${badge}${stale}</td>`;
  }
  if(key==="pos_label"){
    const g = p.is_gk ? "tw" : ((p.pos_groups||[])[0] || "unk");
    return `<td><span class="pospill pg-${g}">${p.pos_label||"?"}</span></td>`;
  }
  if(key==="age") return `<td>${p.age?Math.round(p.age):"–"}</td>`;
  if(key==="value_m") return `<td>${p.value_m!=null?p.value_m+" M€":'<span class="muted">–</span>'}</td>`;
  if(key==="value_score"){
    if(p.value_score==null) return `<td class="muted">–</td>`;
    const v=p.value_score, a=Math.min(0.5, v/6*0.5).toFixed(2);
    return `<td style="background:rgba(var(--heat-pos),${a})">${v}</td>`;
  }
  // Kein Wert = kein Marktwert im Export, Torhüter, oder das Modell trägt
  // (noch) nicht. Alles ehrlicher als eine Zahl ohne Deckung.
  if(key==="value_delta_pct") return fairTd(p);
  if(key==="pers_score") return persTd(p);
  if(key==="note_resid"){
    const v = p.note_resid;
    if(v==null) return `<td class="muted" title="nur für Torhüter mit Export-Zahlen">–</td>`;
    const cls = v>0.1?"pos":(v<-0.1?"neg":"muted");
    return `<td class="${cls}">${v>0?"+":""}${v.toFixed(2)}</td>`;
  }
  if(key==="save_pct" || key==="gp_shot"){
    const v = p[key];
    if(v==null) return `<td class="muted" title="keine Paraden im Export – Liga ohne Detailstatistik oder älterer Import">–</td>`;
    return `<td>${key==="save_pct" ? Math.round(v)+" %" : (v>0?"+":"")+v.toFixed(1)}</td>`;
  }
  if(key==="sot_faced") return `<td>${p.sot_faced==null?'<span class="muted">–</span>':p.sot_faced}</td>`;
  if(key==="score"){
    if(p.score==null) return `<td class="muted" title="Keine Positionsgruppe – kein Score">–</td>`;
    const v=p.score, col = v>=50 ? "var(--heat-pos)" : "var(--heat-neg)";
    const a = (0.14 + Math.abs(v-50)/50*0.50).toFixed(2);
    // pct null = Kennzahl fehlt (z.B. Chancen kreiert bei RAM-Spielern) und
    // wurde uebersprungen; das steht im Tooltip, statt "P null" zu zeigen.
    const parts=(p.score_parts||[]).map(sp=>sp.pct==null
      ? `${sp.label}: fehlt (übersprungen)` : `${sp.label}: P${sp.pct} × ${sp.w}`).join("&#10;");
    const liga = p.league ? `${p.league} (Koeff. ${p.league_coeff})` : "unbekannt (Koeff. 1.0)";
    const tip = `Profil: ${p.profile_label||"?"}&#10;${parts}&#10;Liga: ${liga}&#10;Perzentile relativ zum Pool, /90-Raten geshrinkt (min/(min+180)) × Liga-Koeffizient`;
    return `<td><span class="pill" title="${tip}" style="background:rgba(${col},${a})">${v}</span></td>`;
  }
  if(key==="dna"){
    // Wie der Score als Pill – aber ohne diesen Zweig fiele 'dna' in den
    // Standardzweig und zeigte bei Torhütern eine 0 statt eines Strichs.
    if(p.dna==null) return `<td class="muted" title="Keine Vereins-DNA – Torhüter oder zu wenig Daten">–</td>`;
    const v=p.dna, col = v>=50 ? "var(--heat-pos)" : "var(--heat-neg)";
    const a = (0.14 + Math.abs(v-50)/50*0.50).toFixed(2);
    // Die Einzelkennzahlen kommen in der Tabelle nicht mehr mit (Paketgröße,
    // siehe load_saved) – wenn sie da sind, zeigen wir sie, sonst nur die Formel.
    const teile=(p.dna_teile||[]).filter(t=>t.pct!=null)
      .map(t=>`${t.label}: P${t.pct} × ${t.w}`).join("&#10;");
    const tip = `Vereins-DNA ${v} = √(passstark ${p.dna_pass} × Ballgewinner ${p.dna_ball})`
      + (teile ? `&#10;${teile}` : "")
      + `&#10;Perzentile je Positionsgruppe, Raten × Liga-Koeffizient. `
      + `Geometrisches Mittel: wer beides kann, liegt vorn.`;
    return `<td><span class="pill" title="${tip}" style="background:rgba(${col},${a})">${v}</span></td>`;
  }
  if(key==="reason") return `<td class="reason">${p.reason||""}</td>`;
  if(key==="finishing" || key==="goals_prevented"){
    const v = p[key] ?? 0;
    const cls = v>0.3?"pos":(v<-0.3?"neg":"muted");
    const s = v>0?`+${v.toFixed(2)}`:v.toFixed(2);
    return `<td class="${cls}">${s}</td>`;
  }
  if(key==="pen_saved"){
    // Abzeichen, kein Score-Bestandteil: die Stichprobe ist zu klein, um zu
    // rechnen, aber gross genug, um sie zu zeigen.
    if(p.pen_faced==null) return `<td class="muted">–</td>`;
    if(!p.pen_faced) return `<td class="muted" title="keinen Elfmeter gegen sich gehabt">0/0</td>`;
    return `<td title="parierte Elfmeter / Elfmeter gegen sich">${p.pen_saved??0}/${p.pen_faced}</td>`;
  }
  if(key==="xga") return `<td>${(p.xga??0).toFixed(2)}</td>`;
  if(key==="rating"){
    const v = p.rating ?? 0;
    if(!v) return `<td class="muted">–</td>`;
    const cls = v>=7.5?"pos":(v<6.5?"neg":"");
    return `<td class="${cls}">${v.toFixed(2)}</td>`;
  }
  if(key==="talent"||key==="prospect"){
    // ohne Geburtsdatum kein Altersvergleich – das ist "unbekannt", nicht 0
    if(p[key]==null) return `<td class="muted" title="Kein Geburtsdatum im RAM gefunden – ohne Alter kein Vergleich mit dem Jahrgang">–</td>`;
    const v=p[key], a=(0.10+v/100*0.45).toFixed(2);
    return `<td><span class="pill" title="Perzentil im Altersband ${p.age_band||"?"} auf seiner Position (${p.age||"?"} Jahre)" style="background:rgba(var(--heat-pos),${a})">${v}</span></td>`;
  }
  if(key==="conceded"||key==="apps"||key==="fouls") return heatTd(key, p[key]??0, p[key]);
  if(key==="pass_pct"||key==="duel_pct"||key==="shot_acc"||key==="header_pct"||key==="press_pct")
    return heatTd(key, (p[key]??0)+"%", p[key]);
  return heatTd(key, fmt(p[key]??0), p[key]);
}

function filteredRows(){
  const q = (document.getElementById("search").value||"").toLowerCase();
  return PLAYERS.filter(p => tabMatch(p)
    && (p.name.toLowerCase().includes(q) || (p.pers_label||"").toLowerCase().includes(q))
    && (p.minutes||0) >= MINMIN
    && (!WATCHFILTER || WATCH[p.id])
    && (!U21ONLY || (p.age && p.age<=21)));
}

function toggleWatchFilter(){
  WATCHFILTER = !WATCHFILTER;
  document.getElementById("watchFilter").classList.toggle("on", WATCHFILTER);
  render();
}
function toggleU21(){
  U21ONLY = !U21ONLY;
  document.getElementById("u21Filter").classList.toggle("on", U21ONLY);
  render();
}
// Fehlt die Bruecke zum Backend, laeuft die Seite im Browser statt in der App.
// Das gehoert in die Statuszeile wie jede andere Meldung auch – ein natives
// alert() reisst den Anwender aus der Oberflaeche und sieht nach nichts aus.
function nurInApp(){
  const st=document.getElementById("status");
  if(st) st.textContent="Geht nur im App-Fenster – dort liegt die Verbindung zu FM.";
  return null;
}
async function doImport(){
  const api=API(); if(!api) return nurInApp();
  const st=document.getElementById("status");
  st.innerHTML='<span class="spin"></span> Import läuft…';
  const r=await api.import_export();
  if(r&&r.ok){
    // Mehrere Dateien auf einmal: Zeilen ueber alle Dateien, davon eindeutige
    // Spieler (wer in zwei Positionslisten steht, zaehlt einmal).
    const nd = (r.dateien||[]).length;
    let txt = nd > 1
      ? `${r.count} Spieler aus ${nd} Dateien importiert (${r.zeilen} Zeilen, Doppelte zusammengeführt).`
      : `${r.count} Export-Spieler importiert.`;
    if(r.fehler && r.fehler.length) txt += ` ⚠ ${r.fehler.length} Datei(en) übersprungen: ${r.fehler.join(" · ")}`;
    st.textContent = txt;
    await loadData();
  }
  else st.textContent="⚠ "+((r&&r.error)||"Import abgebrochen");
}

const STAR_COL = {kaufen:"var(--pos)", verkaufen:"var(--neg)", beobachten:"var(--accent)"};
function starHtml(p){
  if(p.id==null) return "";
  const w = WATCH[p.id];
  const col = w ? STAR_COL[w.status]||"var(--accent)" : "var(--border)";
  const t = w ? `Merkliste: ${w.status}` : "zur Merkliste (beobachten)";
  return `<span class="star" title="${t}" style="color:${col}" onclick="event.stopPropagation();toggleStar(${p.id})">★</span> `;
}
async function toggleStar(id){
  if(WATCH[id]) delete WATCH[id]; else WATCH[id]={status:"beobachten", note:""};
  const api=API(); if(api) await api.watchlist_set(id, WATCH[id]?"beobachten":"", "");
  if(DETAIL_ID===id) renderDetail();
  render();
}

function render(){
  if(MODE === "cards"){ document.getElementById("count").textContent=""; renderCards(); return; }
  if(MODE === "signals"){ document.getElementById("count").textContent=""; renderSignals(); return; }
  if(MODE === "tactic"){ document.getElementById("count").textContent=""; renderTactic(); return; }
  const t = TABS[TAB];
  const host = document.getElementById("tableHost");
  const rows = filteredRows();
  maxDuels = Math.max(1,...PLAYERS.map(p=>p.duels||0));
  if(!rows.length){
    const hint = !PLAYERS.length
      ? "Starte Football Manager, lade dein Savegame und klicke „Spiel scannen\"."
      : t.gk ? "Keine Torhüter im Scan. Öffne im Spiel deine Keeper (Kader/Profil) und scanne erneut."
      : TAB==="unk" ? "Alle Spieler konnten einer Position zugeordnet werden."
      : "Keine Spieler in dieser Gruppe (Position wird aus dem RAM gelesen, sobald sie gespielt haben).";
    host.innerHTML = `<div class="empty"><h2>Keine Daten</h2>${hint}</div>`;
    document.getElementById("count").textContent = "";
    return;
  }
  document.getElementById("count").textContent = `${rows.length} · ${t.title}`;
  if(MODE === "chart") renderChart(rows);
  else renderTable(rows, t.cols);
}

const SIG_COLS = [NAME,POS,MIN,C_SC,C_NOTE,C_GOALS,["xg","xG"],["finishing","Δ xG"],
                  ["reason","Begründung"]];
async function renderSignals(){

    <div class="dsec" style="border:0;margin:0">Handels-Signale

      Mindest-Minuten <b id="sigVal">${SIG_MIN}</b>

             style="width:200px;min-width:200px;padding:0"
             oninput="document.getElementById('sigVal').textContent=this.value"
             onchange="setSigMin(this.value)">
    </label></div>
    <div id="sigBody" class="muted" style="padding:20px 0">lade…</div>`;
  if(!api){ document.getElementById("sigBody").textContent="nur in der App verfügbar."; return; }

      ~${Math.round(s.max_minutes/90)} Spiele). Das ist Absicht: Über-/Unterperformance nach wenigen
      Spielen ist meist Glück oder Pech. Schiebe den Regler zum Ausprobieren nach unten – für echte
      Kauf-/Verkaufsentscheidungen lass ihn bei ~900+.</div>`;
    return;
  }
  const tbl = (title, hint, rows, kind) => {
    if(!rows.length) return `<div class="dsec">${title}</div>
      <div class="muted" style="padding:6px 0 16px">Keine Kandidaten über ${SIG_MIN} Min.</div>`;
    const head = SIG_COLS.map(([k,l])=>`<th>${l}</th>`).join("");
    const trs = rows.map(p=>{

// ------------------------- Karten-Generator (FC-inspiriert, Eigenstil) -------
let CARD = null, CARD_PID = null, CARD_SEASONS = [], CARD_VIEW = "edit";
// Tier = Wissensstand über den Spieler (nicht Metall): steigt mit dem Score
// Die vier Stufen sind eine echte Reihenfolge, also laeuft auch die Farbe als
// Reihe: Silber -> Blau -> Gruen -> Orange, dieselben Signalfarben wie in der
// Oberflaeche. Kein Verlauf, kein Metallic – nur Grund, Schrift und Linie.
const TIERS = {
  roh:      {name:"Rohdaten",  paper:"#e4e7ea", txt:"#14171c", accent:"#6b7480", rule:"#c6ccd3"},
  gesichtet:{name:"Gesichtet", paper:"#dfeaf5", txt:"#12222f", accent:"#0a6cb4", rule:"#b6ccdf"},
  beobachtet:{name:"Beobachtet",paper:"#e0eddd", txt:"#16241a", accent:"#2f7a2b", rule:"#bcd4b8"},
  prioritaet:{name:"Priorität",paper:"#f6e7d6", txt:"#2a1c0e", accent:"#b25a06", rule:"#e2c6a4"},
};
const TIER_MIGRATE = {bronze:"roh", silber:"gesichtet", gold:"beobachtet", spezial:"prioritaet"};
const tierForOvr = o => o>=85?"prioritaet":o>=75?"beobachtet":o>=65?"gesichtet":"roh";
const to99 = pct => Math.max(40, Math.min(99, Math.round(40 + 0.59*(pct==null?50:pct))));
const initialsOf = n => (n||"?").split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();

function fieldCohort(){ return PLAYERS.filter(p=>!p.is_gk && (p.minutes||0)>=45); }
function pctlIn(co, key, v, inv){ return pctOf(co.map(q=>+q[key]||0), v, inv); }

function cardStats(p){
  if(p.is_gk){
    const gk = PLAYERS.filter(q=>q.is_gk);
    const one=(k,inv)=>to99(pctOf(gk.map(q=>+q[k]||0), +p[k]||0, inv));
    // Torwart nach dem Nachschärfen: je Schuss statt je Spiel, Note über
    // Erwartung statt Einsätze. Fehlende Werte (keine Paraden im Export)
    // stehen neutral, nicht bei null.
    const gkOne=(k,inv)=>{ const vals=gk.filter(q=>q[k]!=null).map(q=>+q[k]);
      return to99(p[k]==null ? null : pctOf(vals, +p[k], inv)); };
    return [{lab:"VER",val:gkOne("gp_shot")},{lab:"PAR",val:gkOne("save_pct")},
            {lab:"ERW",val:gkOne("note_resid")},{lab:"PAS",val:one("pass_pct")},
            {lab:"GEG",val:one("conceded_p90",true)},{lab:"FRM",val:one("rating")}];
  }
  const co = fieldCohort();
  const avg=(...ks)=>ks.reduce((s,k)=>s+(pctlIn(co,k,+p[k]||0)??50),0)/ks.length;
  const one=(k,inv)=>pctlIn(co,k,+p[k]||0,inv);
  return [{lab:"TOR",val:to99(avg("xg_p90","goals_p90","shots_p90"))},
          {lab:"KRE",val:to99(avg("xa_p90","assists_p90","keyp_p90"))},
          {lab:"TEC",val:to99(one("dribbles_p90"))},
          {lab:"PAS",val:to99(avg("pass_pct","prog_p90"))},
          {lab:"DEF",val:to99(avg("duels_p90","duel_pct"))},
          {lab:"FRM",val:to99(one("rating"))}];
}

// Persönlichkeitszeile der Dossier-Karte: Beschreibung · Medien · Stand. Wird
// sie zu lang, fällt der Medienumgang weg statt mitten im Wort abzubrechen.
function persZeile(c){
  const st = c.persStand ? "Stand " + c.persStand : "";
  let t = [c.pers, c.medien, st].filter(Boolean).join(" · ");
  if(t.length > 46) t = [c.pers, st].filter(Boolean).join(" · ");
  return t.toUpperCase().slice(0, 46);
}

function cardConfigFor(p, label){
  const stats = cardStats(p);
  const ovr = p.score!=null ? Math.round(50+45*(p.score/100))
                            : Math.round(stats.reduce((s,x)=>s+x.val,0)/stats.length);
  return {pid:p.id, name:p.name, pos:p.pos_label||(p.is_gk?"TW":"?"),
          ovr, tier:tierForOvr(ovr), flag:"", img:null, label:label||"aktuell", stats,
          // Scouting-Bericht: die sichtbare Persönlichkeit gehört auf die Karte
          pers:p.pers_label||"", persStufe:p.pers_stufe||"", medien:p.pers_medien||"",
          persStand:monatJahr(p.pers_stand)};
}

function enrichSeasonRecord(rec, base){
  const m=+rec.minutes||0, p90=v=>m?+(((v||0)*90/m).toFixed(2)):0, pt=+rec.pass_try||0;
  return Object.assign({}, base, {
    minutes:m, goals:+rec.goals||0, assists:+rec.assists||0, rating:+rec.rating||0, score:null,
    xg_p90:p90(rec.xg), xa_p90:p90(rec.xa), goals_p90:p90(rec.goals), assists_p90:p90(rec.assists),
    shots_p90:p90(rec.shots_on), dribbles_p90:p90(rec.dribbles), duels_p90:p90(rec.duels),
    prog_p90:p90(rec.prog_passes), keyp_p90:p90(rec.key_passes),
    pass_pct: pt?Math.round(100*(+rec.pass_ok||0)/pt):0,
    duel_pct: rec.duels_total?Math.round(100*(+rec.duels||0)/(+rec.duels_total)):0,
    conceded_p90:p90(rec.conceded), xga:+rec.xga||0, apps:+rec.apps||0, conceded:+rec.conceded||0,
    goals_prevented:(+rec.xga||0)-(+rec.conceded||0)});
}

function cardSVG(c){
  let tk=c.tier; if(!TIERS[tk]) tk=TIER_MIGRATE[tk]||"roh";
  const t=TIERS[tk], W=340, H=480;
  const MONO="JetBrains Mono, ui-monospace, monospace";
  // Anzeigeschrift wie in der Oberflaeche: DIN-Grotesk, leicht schmal gestellt.
  // Die Karte ist ein Schild, kein Kartonbogen – deshalb kein Serifensatz mehr.
  const DIS="Bahnschrift, 'DIN Alternate', 'Segoe UI Variable Display', 'Segoe UI', sans-serif";
  const nm=(c.name||""), nsz = nm.length>24 ? 15 : nm.length>18 ? 18 : 22;
  // Radar (Perzentil-Hexagon) bleibt das Herzstueck, jetzt als Tuschezeichnung
  // auf Karton statt als leuchtendes Sammelkartenmotiv.
  const N=c.stats.length, cx=170, cy=236, R=90, LR=111;
  const pt=(i,rad)=>{ const a=-Math.PI/2 + i*2*Math.PI/N;
    return [cx+rad*Math.cos(a), cy+rad*Math.sin(a)]; };
  let grid="";
  [0.34,0.67,1].forEach(f=>{
    const pts=c.stats.map((s,i)=>pt(i,R*f).map(n=>n.toFixed(1)).join(",")).join(" ");
    grid+=`<polygon points="${pts}" fill="none" stroke="${t.rule}" stroke-opacity="${f===1?1:.75}" stroke-width="1"/>`;
  });
  let spokes="", dots="", labels="";
  const valPts=c.stats.map((s,i)=>{
    const [ox,oy]=pt(i,R);
    spokes+=`<line x1="${cx}" y1="${cy}" x2="${ox.toFixed(1)}" y2="${oy.toFixed(1)}" stroke="${t.rule}" stroke-width="1"/>`;
    const [vx,vy]=pt(i, R*Math.max(0.05,Math.min(1,(s.val||0)/99)));
    dots+=`<circle cx="${vx.toFixed(1)}" cy="${vy.toFixed(1)}" r="2.4" fill="${t.accent}"/>`;
    const [lx,ly]=pt(i,LR);
    labels+=`<text x="${lx.toFixed(1)}" y="${(ly-1).toFixed(1)}" text-anchor="middle" font-family="${MONO}" font-size="9" font-weight="700" letter-spacing="1" fill="${t.txt}" opacity=".8">${s.lab}</text>`
          +`<text x="${lx.toFixed(1)}" y="${(ly+10).toFixed(1)}" text-anchor="middle" font-family="${MONO}" font-size="9" fill="${t.txt}" opacity=".5">${s.val}</text>`;
    return `${vx.toFixed(1)},${vy.toFixed(1)}`;
  }).join(" ");
  const poly=`<polygon points="${valPts}" fill="${t.accent}" fill-opacity=".14" stroke="${t.accent}" stroke-width="1.8" stroke-linejoin="round"/>`;
  const ghost = c.img
    ? `<clipPath id="cclip"><circle cx="${cx}" cy="${cy}" r="${R-3}"/></clipPath>
       <image href="${c.img}" x="${cx-R}" y="${cy-R}" width="${2*R}" height="${2*R}" preserveAspectRatio="xMidYMid slice" clip-path="url(#cclip)" opacity=".16"/>`
    : "";
  // Klassifizierung als aufgedrueckter Stempel – die einzige schraege Marke
  const sw = Math.max(84, t.name.length*8.4 + 26), sh=26, sx=W-26-sw, sy=44, ch=9;
  const stamp=`<g>
    <path d="M${sx} ${sy}h${sw-ch}l${ch} ${ch}v${sh-ch}h${-sw}z" fill="${t.accent}"/>
    <text x="${sx+sw/2}" y="${sy+17.5}" text-anchor="middle" font-family="${MONO}"
          font-size="10" font-weight="700" letter-spacing="2"
          fill="${t.paper}">${t.name.toUpperCase()}</text></g>`;
  // Passermarke und Doppelrahmen sind mit dem Papier weggefallen – ein Schild
  // hat einen Rand, keine Druckvorstufe.
  const cross="";
  return `<svg viewBox="0 0 ${W} ${H}" class="cardsvg" font-family="${DIS}" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="${W}" height="${H}" fill="${t.paper}" stroke="${t.rule}" stroke-width="1.5"/>
    <text x="26" y="60" font-size="11" font-family="${MONO}" letter-spacing="2" fill="${t.txt}" opacity=".55">BEWERTUNG</text>
    <text x="26" y="102" font-size="42" font-weight="700" fill="${t.txt}">${c.ovr}</text>
    <text x="${26+String(c.ovr).length*24}" y="102" font-size="11" font-family="${MONO}" letter-spacing="1.4" fill="${t.txt}" opacity=".65">${(c.pos||"").split(",")[0].trim()}</text>
    ${c.flag?`<text x="26" y="128" font-size="18">${c.flag}</text>`:""}
    ${stamp}
    <line x1="26" y1="118" x2="314" y2="118" stroke="${t.rule}" stroke-width="1"/>
    ${ghost}${grid}${spokes}${poly}${dots}${labels}
    <line x1="26" y1="374" x2="314" y2="374" stroke="${t.rule}" stroke-width="1"/>
    <text x="26" y="398" font-size="${nsz}" font-weight="600" fill="${t.txt}">${nm}</text>
    <text x="26" y="416" font-size="10" font-family="${MONO}" letter-spacing=".6" fill="${t.txt}" opacity=".6">${(c.label||"").slice(0,40)}</text>
    ${c.pers
      ? `<text x="26" y="432" font-size="9" font-family="${MONO}" letter-spacing=".8" fill="${t.accent}">${esc2(persZeile(c))}</text>`
      : `<text x="26" y="432" font-size="9" font-family="${MONO}" letter-spacing=".8" fill="${t.txt}" opacity=".4">PERSÖNLICHKEIT: NICHT GESCOUTET</text>`}
    <line x1="26" y1="440" x2="314" y2="440" stroke="${t.rule}" stroke-width="1"/>
    <text x="26" y="458" font-size="8" font-family="${MONO}" letter-spacing="1.8" fill="${t.txt}" opacity=".42">FM COMPANION · MONEYBALL</text>
    ${cross}
  </svg>`;
}

// ======================= Taktik-Analyse ====================================
// Spielfeld mit den elf Positionen. Klick auf eine Position -> alle Kader-
// spieler, die sie spielen koennen, mit Score. Klick auf einen Spieler ->
// die Kennzahlen, aus denen der Score entsteht, je mit Perzentil und Rohwert.
let TACT = null, TACT_SLOT = null, TACT_PID = null, TACT_SQUADS = null;

// Laufender Ladevorgang des Taktikbretts – Schutz gegen Mehrfachstart.
//
// render() ruft renderTactic() OHNE await auf, und render() feuert beim Start
// aus mehreren Stellen (loadData, setTab, setMode, updateControls). TACT wird
// aber erst NACH dem Await gesetzt: alle diese Aufrufe sahen TACT === null und
// starteten je eine eigene Kette mit tactic_board() – einem Aufruf, der
// sekundenlang rechnet. Solange das Brett nur per Klick erreichbar war, fiel
// das nicht auf; seit es die Startseite ist, stapelten sich die Ketten und die
// App war beim Öffnen minutenlang blockiert. Wer während des Ladens dazukommt,
// fährt deshalb auf demselben Promise mit, statt einen neuen zu starten.
let TACT_LADEN = null;

// Ansicht unter „mein team": das Brett oder der Ligavergleich
// (tactics.liga_vergleich). Der Vergleich rechnet sekundenlang und wird
// deshalb erst beim ersten Umschalten geholt, dann aufgehoben.
let TACT_VIEW = "brett", LIGA = null, LIGA_SORT = "platz", LIGA_OFFEN = null;

function ladeTaktik(api){
  if(TACT_LADEN) return TACT_LADEN;
  TACT_LADEN = (async () => {
    const r = await api.tactic_board();
    if(r && r.kein_kader) return {kaderwahl: true};
    if(!r || !r.ok) return {fehler: "Kein Board"};
    TACT = r;
    if(!TACT_SLOT) TACT_SLOT = TACT.slots[0].key;
    // Archetypen kommen mit dem Brett mit – kein Nachladen je Position.
    TACT_ARCH = {};
    for(const s of TACT.slots) TACT_ARCH[s.key] = s.archetypen_liste || [];
    return {};
  })().finally(() => { TACT_LADEN = null; });
  return TACT_LADEN;
}

async function renderTactic(){
  const host = document.getElementById("tableHost");
  const api = API();
  if(!api){ host.innerHTML = `<div class="empty"><h2>Nur in der App</h2></div>`; return; }
  if(TACT_SQUADS){ renderSquadPicker(host); return; }
  if(!TACT){
    LIGA = null; CLV = null;  // neues Brett = neue Elf, die Vergleiche rechnen neu
    if(!TACT_LADEN)
      host.innerHTML = `<div class="empty"><span class="spin"></span> lade Taktik…</div>`;
    let e;
    try{ e = await ladeTaktik(api); }
    catch(err){ host.innerHTML = `<div class="empty"><h2>Fehler</h2>${err}</div>`; return; }
    if(e.kaderwahl){ renderKaderwahl(host); return; }
    if(e.fehler){ host.innerHTML = `<div class="empty"><h2>${e.fehler}</h2></div>`; return; }
    if(!TACT) return;
  }
  if(TACT_VIEW==="liga"){ drawLigaHost(host); return; }
  drawTactic(host);
}
