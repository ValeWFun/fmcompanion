  /* ==================================================================
     FM Companion – Leitsystem
     ------------------------------------------------------------------
     Entwurfsrichtung: Otl Aicher, München 1972. Sport als Leitsystem
     statt als Pathos – silbergrauer Grund, wenige gesättigte
     Signalfarben, DIN-Grotesk, und Piktogramme, die ausschließlich aus
     Senkrechten, Waagerechten und 45°-Diagonalen bestehen. Das passt
     zur Sache: das Werkzeug misst, es verehrt nicht.

     Vier Regeln tragen den ganzen Entwurf:

       1. 45° ist die einzige erlaubte Schräge – aber nur für Möbel:
          Piktogramme, die Abschrägung aktiver Kacheln, die Schraffur
          während des Scans. Datenlinien im Diagramm gehorchen den
          Daten, nicht dem Raster.
       2. Kein Rot. Aicher hatte es aus der Münchner Palette gestrichen;
          hier zahlt sich das doppelt aus: Kauf und Verkauf laufen über
          Grün und Violett und bleiben damit auch bei Rot-Grün-Schwäche
          unterscheidbar – das ist der folgenreichste Blick im Werkzeug.
       3. Das System ist eckig, die Figuren sind rund. Flächen haben
          keine Radien, Piktogramme runde Enden.
       4. Die Positionsfarben laufen als Rampe über den Platz: kalt am
          eigenen Tor, warm am gegnerischen. Die Farbe sagt etwas über
          die Position aus, sie schmückt sie nicht.

     Schriften, drei Aufgaben:
       --display  Bahnschrift, Microsofts DIN 1451. Liegt auf jedem
                  Windows 10/11 – kein Nachladen, keine externe Datei.
                  Nur für Navigation und Marke, klein geschrieben wie
                  auf einem Leitschild.
       --sans     Segoe UI Variable Text: Namen, Fließtext, Formulare.
       --mono     JetBrains Mono (oben eingebettet): alles Zahlenhafte.
                  Tabellenköpfe, Messwerte, Kennungen.

     Hinweis für spätere Änderungen: Es gibt hier nur EINEN Stilblock,
     keinen Override-Block darunter mehr. Farben und Typografie also
     genau an dieser Stelle ändern.
     ================================================================== */
  :root{
    --display:"Bahnschrift","DIN Alternate","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
    --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
    --rail:74px;          /* Breite der Positionsleiste */
    --chamfer:11px;       /* 45°-Anschnitt aktiver Kacheln */

    /* Hell = Leitschild bei Tageslicht. Silbergrau, kein Creme. */
    --bg:#d2d5da; --surface:#ffffff; --surface2:#e7eaee; --border:#b4bac2;
    --rule:#dee1e6;
    --text:#14171c; --muted:#5b6470; --dim:#6e7681;   /* --dim traegt 10-px-Text: 4.5:1 */
    --accent:#0a6cb4; --on-accent:#ffffff;   /* Lichtblau = Interaktion */
    --pos:#2f7a2b;                            /* Grün   = Kauf, gut     */
    --neg:#8b4bb0;                            /* Violett= Verkauf, schwach */
    --mark:#b25a06;                           /* Orange = gemerkt       */
    --blue:#0a6cb4;
    --zebra:#f4f5f7; --rowhover:#e2eaf2;
    /* Schatten tragen den Blaustich des Grundes, nicht neutrales Schwarz –
       sonst sitzt ein warmer Grauschleier auf einer kühlen Fläche. */
    --shadow:0 1px 0 rgba(28,42,64,.08);
    --lift:0 10px 30px rgba(18,30,48,.22);
    --heat-pos:47,122,43; --heat-neg:139,75,176;

    /* Positionsrampe: eigenes Tor -> gegnerisches Tor */
    --pg-tw:#3a5aa8; --pg-def:#0f7d84; --pg-mid:#2f7a2b;
    --pg-off:#8a6a05; --pg-st:#b3510a;
  }
  :root[data-theme="dark"]{
    /* Dunkel = dasselbe Schild bei Flutlicht. Kühl, nicht warm. */
    --bg:#0b0e12; --surface:#161a20; --surface2:#1f242c; --border:#333a45;
    --rule:#252b34;
    --text:#e7eaef; --muted:#98a1af; --dim:#7b8592;
    --accent:#57adf2; --on-accent:#0b0e12;
    --pos:#7cc86c;
    --neg:#c193e8;
    --mark:#f0982f;
    --blue:#57adf2;
    --zebra:#1b1f26; --rowhover:#23303d;
    --shadow:0 1px 0 rgba(0,4,10,.4);
    --lift:0 10px 34px rgba(0,4,12,.58);
    --heat-pos:124,200,108; --heat-neg:193,147,232;

    --pg-tw:#90a8e8; --pg-def:#4ac6cf; --pg-mid:#7cc86c;
    --pg-off:#d9ad3a; --pg-st:#f5913a;
  }

  /* ---------- Grundlagen ---------- */
  *{box-sizing:border-box}
  *{scrollbar-color:var(--border) transparent;scrollbar-width:thin}
  ::-webkit-scrollbar{width:12px;height:12px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border:4px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted)}
  ::-webkit-scrollbar-corner{background:transparent}

  html{height:100%}
  body{margin:0;height:100dvh;display:flex;overflow:hidden;
    background:var(--bg);color:var(--text);
    font-family:var(--sans);font-size:13.5px;-webkit-font-smoothing:antialiased}

  /* Sichtbarer Tastaturfokus – überall, nicht nur wo es zufällig passt. */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  :focus-visible:not(:focus-visible){outline:none}
  ::selection{background:var(--accent);color:var(--on-accent)}
  /* Fließtext bricht ohne Schusterjungen um. Nur die Stil-Eigenschaft: die
     Kurzform text-wrap setzt auch den Umbruch-Modus zurück und hob damit das
     nowrap jeder Tabellenzelle mit .muted auf (POS-Spalte dreizeilig). */
  p,li,.dsub,.empty,.muted{text-wrap-style:pretty}

  /* Absprung ins Datenfeld: liegt außerhalb des Bildes, bis er Fokus bekommt. */
  .skip{position:fixed;left:-999px;top:0;z-index:60;background:var(--accent);
    color:var(--on-accent);font-family:var(--mono);font-size:11px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;padding:10px 16px;text-decoration:none}
  .skip:focus{left:0}
  .wrap:focus{outline:none}

  /* ---------- Positionsleiste: das Leitschild ----------
     Sieben Kacheln, jede ein Piktogramm nach Aicher-Grammatik. Aktive
     Kachel füllt sich in der Positionsfarbe und bekommt den 45°-Anschnitt. */
  .rail{flex:none;width:var(--rail);background:var(--surface);
    border-right:1px solid var(--border);display:flex;flex-direction:column;
    gap:1px;padding:8px 0;overflow-y:auto;overflow-x:hidden;
    transition:opacity .15s linear}
  .rail button{background:transparent;border:0;color:var(--muted);cursor:pointer;
    padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:5px;
    transition:background .12s linear,color .12s linear}
  .rail button em{font-family:var(--display);font-style:normal;font-size:10.5px;
    font-weight:600;font-variation-settings:"wght" 600,"wdth" 78;
    letter-spacing:.08em;line-height:1}
  .rail .ico svg{width:28px;height:28px}
  .rail button:hover{color:var(--text);background:var(--surface2)}
  .rail button.on{color:var(--on-accent);background:var(--grp,var(--accent));
    clip-path:polygon(0 0,calc(100% - var(--chamfer)) 0,100% var(--chamfer),100% 100%,0 100%)}
  .rail button[data-tab="tw"] {--grp:var(--pg-tw)}
  .rail button[data-tab="def"]{--grp:var(--pg-def)}
  .rail button[data-tab="mid"]{--grp:var(--pg-mid)}
  .rail button[data-tab="off"]{--grp:var(--pg-off)}
  .rail button[data-tab="st"] {--grp:var(--pg-st)}
  .rail .sep{flex:none;height:1px;background:var(--rule);margin:6px 12px}
  .rail .gap{flex:1 1 auto;min-height:8px}

  /* ---------- Arbeitsfläche ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}

  /* ---------- Kopfband ---------- */
  header{flex:none;display:flex;align-items:center;gap:12px;height:52px;
    padding:0 18px;background:var(--surface);border-bottom:1px solid var(--border)}
  .grow{flex:1}
  .brand{display:flex;align-items:center;gap:9px}
  .logomark{width:26px;height:26px;background:var(--accent);color:var(--on-accent);
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:700;font-size:13px;line-height:1;
    font-variation-settings:"wght" 700,"wdth" 78;letter-spacing:.04em;
    clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,0 100%)}
  .wordmark{font-family:var(--display);font-size:19px;color:var(--text);
    font-variation-settings:"wght" 500,"wdth" 84;letter-spacing:.01em}
  .badge{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.16em;
    color:var(--accent);border:1px solid var(--accent);padding:2px 5px;
    text-transform:uppercase}
  .status{color:var(--muted);font-size:12px}
  header .status{font-family:var(--mono);font-size:11px;letter-spacing:.01em;
    max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- Schaltflächen ---------- */
  button{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);
    font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;padding:8px 14px;cursor:pointer;border-radius:0;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    transition:filter .15s ease,background .15s ease,color .15s ease,
               border-color .15s ease,transform .06s ease;
    clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,0 100%)}
  button:hover{filter:brightness(1.1)}
  /* Gedrückt = einen Pixel tiefer. Reicht, um den Klick körperlich zu machen;
     ein Skalieren würde die 45°-Anschnitte verwaschen. */
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.45;cursor:default;filter:none}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--border);
    font-weight:500;letter-spacing:.06em;padding:7px 10px;clip-path:none;
    display:inline-flex;align-items:center;gap:6px}
  button.ghost:hover{color:var(--text);border-color:var(--muted);filter:none}
  button.ghost.on{color:var(--accent);border-color:var(--accent)}
  #themeBtn{padding:7px 8px}
  .ico{display:inline-flex;align-items:center;flex:none}
  .ico svg{width:13px;height:13px;display:block}

  /* Der Scan-Balken. Der einzige bewegte Punkt der Oberfläche – und er
     bewegt sich nur, solange wirklich aus dem RAM gelesen wird. */
  .spin{display:inline-block;width:26px;height:9px;vertical-align:-1px;border:0;
    background-image:repeating-linear-gradient(45deg,
      var(--accent) 0 3px,transparent 3px 6px);
    background-size:8.49px 8.49px;   /* 6px × √2 = eine volle Schraffurperiode */
    animation:lauf .55s linear infinite}
  @keyframes lauf{to{background-position:8.49px 0}}

  /* ---------- Steuerleisten ---------- */
  .controls{flex:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    padding:9px 18px;background:var(--surface);border-bottom:1px solid var(--border)}
  .controls.sub{padding:7px 18px;gap:16px;background:var(--surface2);
    border-bottom:1px solid var(--border)}
  .controls .status{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .controls label.status{color:var(--muted);font-family:var(--sans);font-size:12px}
  #count{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.04em}
  #search{margin-left:auto;min-width:190px}
  #seasonInfo{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:700}

  /* Ansichtswechsel: Beschriftung klein geschrieben, aktive mit Unterstrich.
     Bewusst leiser als das Leitschild links – nur ein mutiges Element. */
  .viewnav{display:flex;gap:2px}
  .viewnav button{background:transparent;border:0;clip-path:none;color:var(--muted);
    font-family:var(--display);font-size:14.5px;font-weight:500;text-transform:lowercase;
    font-variation-settings:"wght" 500,"wdth" 88;letter-spacing:.005em;
    padding:5px 11px 6px;box-shadow:inset 0 -2px 0 transparent}
  .viewnav button:hover{color:var(--text);filter:none}
  .viewnav button.on{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent);
    font-variation-settings:"wght" 700,"wdth" 88}

  /* Segmentschalter (Quelle, Dossier-Umschalter) */
  .seg{display:inline-flex;border:1px solid var(--border);background:var(--surface)}
  .seg button{background:transparent;color:var(--muted);border:0;clip-path:none;
    border-left:1px solid var(--border);padding:6px 12px;font-size:10.5px;
    font-weight:500;letter-spacing:.08em}
  .seg button:first-child{border-left:0}
  .seg button:hover{color:var(--text);filter:none}
  .seg button.on{background:var(--accent);color:var(--on-accent);font-weight:700}

  /* ---------- Eingaben ---------- */
  select,input{background:var(--surface);color:var(--text);border:1px solid var(--border);
    border-radius:0;font-family:var(--sans);font-size:12.5px;padding:6px 9px}
  select{min-width:230px} input{min-width:150px}
  #xAxis,#yAxis{min-width:148px}
  select:focus,input:focus{outline:none;border-color:var(--accent);
    box-shadow:inset 0 -2px 0 var(--accent)}
  input[type=range]{accent-color:var(--accent);background:transparent;border:0;padding:0}
  input[type=checkbox]{min-width:0;width:auto;padding:0;margin:0;
    accent-color:var(--accent);vertical-align:middle}
  input[type=number]{font-family:var(--mono)}

  /* ---------- Der Datenbogen ---------- */
  .wrap{flex:1;min-height:0;overflow:auto;padding:16px 18px 40px}
  #tableHost{background:var(--surface);border:1px solid var(--border);
    box-shadow:var(--shadow)}
  table{width:100%;border-collapse:separate;border-spacing:0;
    font-variant-numeric:tabular-nums lining-nums;background:var(--surface)}
  th,td{padding:7px 11px;text-align:right;white-space:nowrap;
    border-bottom:1px solid var(--rule)}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0}
  th{position:sticky;top:0;z-index:2;background:var(--surface);color:var(--muted);
    font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.11em;
    text-transform:uppercase;cursor:pointer;user-select:none;padding:9px 11px;
    border-bottom:1.5px solid var(--border)}
  th:first-child{z-index:3}
  th:hover{color:var(--text)}
  th.active{color:var(--accent);font-weight:700}
  tbody tr{background:var(--surface);cursor:pointer}
  tbody tr:nth-child(even){background:var(--zebra)}
  tbody td:first-child{background:inherit}
  tbody tr:hover,tbody tr:hover td:first-child{background:var(--rowhover)}
  tbody tr:last-child td{border-bottom:0}
  .name{font-weight:600;color:var(--text)}
  .pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}
  .cur{color:var(--accent);font-weight:700}

  /* Fair Value – das Urteil in Worten, dahinter Markt → Fair in Mio.
     Das nackte „+208 %" wurde fünfmal verkehrt herum gelesen; ein Wort hat
     keine Richtung, die man umdrehen kann, und die zwei Beträge machen es
     nachprüfbar. Die Farbe hängt am Urteil (fair_urteil, fünf Stufen aus der
     Modellstreuung), nicht am Vorzeichen: „deutlich" trägt die volle
     Tönung, „leicht" eine schwache, „marktgerecht" bleibt ungefärbt.
     Grün = unterbewertet (Kauf), Violett = überbewertet – kein Rot
     (Regel 2). Dünne Stichprobe: gedämpft, ungefärbt, „?" am Wort. */
  td.fair{font-size:11.5px}
  td.fair .fw{font-weight:600}
  td.fair .fz{font-family:var(--mono);font-size:10.5px;color:var(--muted);
    margin-left:9px;display:inline-block;min-width:78px}
  .u-dunter{background:rgba(var(--heat-pos),.34)}
  .u-lunter{background:rgba(var(--heat-pos),.12)}
  .u-lueber{background:rgba(var(--heat-neg),.12)}
  .u-dueber{background:rgba(var(--heat-neg),.34)}
  .u-lunter .fw,.urteil.u-lunter{color:var(--pos)}
  .u-lueber .fw,.urteil.u-lueber{color:var(--neg)}
  .u-dunter .fw,.u-dueber .fw{font-weight:700}
  .u-markt .fw{font-weight:400;color:var(--muted)}
  td.fair.unsicher{background:none}
  td.fair.unsicher .fw{font-weight:400;color:var(--muted)}
  td.fair.leer{color:var(--dim)}
  /* Das Urteil als Marke außerhalb der Tabelle (Preislot, Slot-Vergleich) */
  .urteil{display:inline-block;padding:1px 6px;font-size:12px;font-weight:600;
    white-space:nowrap}
  .urteil.u-markt{color:var(--muted);font-weight:400;padding-left:0}
  .urteil.unsicher{background:none;color:var(--muted);font-weight:400;padding-left:0}
  /* Charakter: das Wort in Stufenfarbe (Inline-Stil aus persTd), knapp
     gehalten, damit die Spalte nicht die Tabelle sprengt. */
  td.pers{font-size:11.5px;white-space:nowrap;max-width:132px;overflow:hidden;text-overflow:ellipsis}
  td.pers.leer{color:var(--dim)}

  /* Kennzahl-Plakette. Die Fläche kommt als Inline-Stil aus cell(); hier
     steht nur, wie sie aussieht, nicht welche Farbe sie hat. */
  .pill{display:inline-block;min-width:24px;text-align:center;padding:2px 8px;
    font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--text)}
  /* Dünne Stichprobe: der Wert bleibt unangetastet, nur die Plakette bekommt
     eine gestrichelte Unterkante. Als inset-Schatten, damit nichts verrutscht,
     und ohne eigene Farbe – Rot ist im Leitsystem nicht vorgesehen. */
  .pill.duenn{box-shadow:inset 0 -2px 0 var(--dim)}

  /* Positionskürzel: getönte Marke in der Positionsfarbe. */
  .pospill{display:inline-block;padding:1px 6px;font-family:var(--mono);font-size:10px;
    font-weight:700;letter-spacing:.08em;white-space:nowrap;
    border:1px solid currentColor;background:transparent}
  @supports (background:color-mix(in srgb,red 10%,transparent)){
    .pospill{border-color:transparent;
      background:color-mix(in srgb,currentColor 16%,transparent)}
  }
  .pg-tw{color:var(--pg-tw)}   .pg-def{color:var(--pg-def)}
  .pg-mid{color:var(--pg-mid)} .pg-off{color:var(--pg-off)}
  .pg-st{color:var(--pg-st)}   .pg-unk{color:var(--dim)}

  .bar{height:6px;background:var(--surface2);width:52px;display:inline-block;
    vertical-align:middle;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--blue)}
  .srcbadge{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--blue);
    border:1px solid var(--blue);padding:0 3px;vertical-align:middle}
  .star{cursor:pointer;font-size:13px;user-select:none;color:var(--mark);
    transition:transform .1s}
  .star:hover{transform:scale(1.25)}

  /* Erklärtexte im Leerzustand: Zeilenlänge begrenzen, sonst laufen sie über
     die ganze Fensterbreite und werden unlesbar. */
  .empty{padding:64px 20px;text-align:center;color:var(--muted);
    max-width:68ch;margin:0 auto;line-height:1.6}
  .empty h2{color:var(--text);margin:0 0 8px;font-family:var(--display);
    font-variation-settings:"wght" 600,"wdth" 88;font-size:19px;font-weight:600}

  /* ---------- Diagramm ---------- */
  .chartwrap{position:relative;padding:12px 0 4px}
  svg.chart{width:100%;height:auto;display:block}
  svg.chart text{fill:var(--muted);font-family:var(--mono);font-size:10.5px}
  svg.chart .axis{stroke:var(--border);stroke-width:1}
  svg.chart .grid{stroke:var(--rule);stroke-width:1}
  svg.chart .avg{stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3;opacity:.6}
  svg.chart .dot{fill:var(--blue);fill-opacity:.7;stroke:var(--surface);stroke-width:1;
    cursor:pointer}
  svg.chart .dot.hot{fill:var(--accent);fill-opacity:1}
  svg.chart text.axlabel{fill:var(--text);font-family:var(--display);font-size:12.5px;
    font-variation-settings:"wght" 600,"wdth" 88}
  svg.chart text.avglab{fill:var(--accent);font-size:9.5px;opacity:.9}
  .tip{position:absolute;display:none;background:var(--text);color:var(--surface);
    border:0;padding:6px 9px;font-family:var(--mono);font-size:11px;
    pointer-events:none;z-index:9;white-space:nowrap;box-shadow:var(--lift)}
  .tip b{color:var(--surface);font-weight:700}

  /* ---------- Beobachtungsbogen (Drawer) ---------- */
  .overlay{position:fixed;inset:0;background:rgba(11,14,18,.5);display:none;z-index:20}
  .overlay.on{display:block}
  /* Schiebt über transform statt über right: das läuft auf der GPU und ruckelt
     nicht, wenn der Bogen gleichzeitig 200 Tabellenzeilen überlagert. */
  .drawer{position:fixed;top:0;right:0;width:470px;max-width:94vw;height:100dvh;
    background:var(--surface);border-left:1px solid var(--border);z-index:21;
    transform:translateX(100%);transition:transform .22s ease;
    overflow-y:auto;padding:18px 22px 30px;box-shadow:var(--lift)}
  .drawer.open{transform:translateX(0)}
  .dhead{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
  .dhead h2{margin:0;flex:1;font-family:var(--display);font-size:25px;font-weight:600;
    font-variation-settings:"wght" 600,"wdth" 86;letter-spacing:0;line-height:1.15}
  .dsub{color:var(--muted);font-family:var(--mono);font-size:11px;margin-bottom:14px;
    letter-spacing:.03em}
  .dsec{margin:18px 0 6px;font-family:var(--mono);font-size:10px;text-transform:uppercase;
    letter-spacing:.14em;color:var(--muted);font-weight:500;
    border-bottom:1px solid var(--border);padding-bottom:5px}
  .xbtn{background:var(--surface2);color:var(--muted);border:1px solid var(--border);
    padding:4px 9px;clip-path:none;font-size:10.5px}
  .xbtn:hover{color:var(--text);filter:none}
  /* Textschalter statt <a href="#">: es fuehrt nirgendwohin, es tut etwas. */
  .linkbtn{background:none;border:0;clip-path:none;padding:0;color:var(--accent);
    font-family:inherit;font-size:inherit;font-weight:inherit;letter-spacing:inherit;
    text-transform:none;text-decoration:underline;text-underline-offset:2px}
  .linkbtn:hover{filter:none;color:var(--text)}
  .pbar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12.5px}
  .pbar .plab{width:132px;color:var(--muted);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .pbar .ptrack{flex:1;height:9px;background:var(--surface2);overflow:hidden}
  /* Auch der Vergleich braucht das: sein <i> steht sonst als Inline-Element
     ohne Hoehe da und die Balken bleiben unsichtbar. */
  .pbar .ptrack i,.cmpbar .ptrack i{display:block;height:100%}
  .pbar b{width:34px;text-align:right;font-family:var(--mono);font-size:11.5px}
  .pbar .tval{width:64px;text-align:right;font-family:var(--mono);font-size:11px;
    color:var(--muted)}
  /* Preislot – Marktwert und geschätzter Fair Value als zwei Balken auf
     GEMEINSAMER Skala, damit der Abstand ablesbar ist statt errechnet.
     Baut vollständig auf .pbar auf: keine eigenen Radien (Flächen bleiben
     eckig, Regel 3), keine 45°-Schraffur (die gehört den Möbeln, Regel 1).
     Fehlt der Marktwert, entfällt der Block ganz – Abwesenheit statt
     Platzhalter. */
  .lot .pbar .plab{width:104px}
  .lot .pbar .tval{width:78px;color:var(--text)}
  .lotdelta{font-family:var(--mono);font-size:13px;font-weight:700;margin:8px 0 2px}
  .lotnote{color:var(--muted);font-size:11.5px}
  .lotwarn{color:var(--dim);font-size:11.5px;margin-top:2px}
  /* Eigengewächs (D2): nur anzeigen, nicht bewerten – die Meldelisten-Logik
     kommt mit D4 aus dem Backend */
  .dhg{font-family:var(--mono);font-size:11px;margin:-6px 0 12px;color:var(--text)}
  .sparkrow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
  .sparkrow .plab{width:70px;color:var(--muted)}
  .sparkrow svg{background:var(--surface2)}
  .sparkrow b{font-family:var(--mono);font-size:11.5px}
  .seas{width:100%;font-size:12.5px;border-collapse:collapse}
  .seas th,.seas td{padding:4px 7px;border-bottom:1px solid var(--rule);text-align:right;
    position:static}
  .seas th{font-family:var(--mono);font-size:10px;top:auto;background:transparent;
    cursor:default;border-bottom:1px solid var(--border)}
  .seas th:first-child,.seas td:first-child{text-align:left;position:static;
    background:transparent}
  .wbtns{display:flex;gap:6px;margin:8px 0}
  .wbtn{background:var(--surface2);color:var(--muted);border:1px solid var(--border);
    padding:6px 11px;font-family:var(--mono);font-size:10.5px;font-weight:500;
    letter-spacing:.08em;clip-path:none}
  .wbtn:hover{color:var(--text);filter:none}
  .wbtn.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);
    font-weight:700}
  #watchFilter.on{background:var(--mark);border-color:var(--mark);color:var(--on-accent)}
  .wnote{width:100%;margin-top:6px;min-height:58px;font-family:var(--sans)}

  /* ---------- Vergleich ---------- */
  .comparebar{position:fixed;bottom:18px;left:calc(50% + var(--rail)/2);
    transform:translateX(-50%);z-index:19;background:var(--surface);
    border:1px solid var(--border);padding:8px 12px;display:none;gap:8px;
    align-items:center;box-shadow:var(--lift)}
  .comparebar.on{display:flex}
  .chip{background:var(--surface2);border:1px solid var(--border);padding:3px 9px;
    font-family:var(--mono);font-size:11px;display:inline-flex;gap:6px;align-items:center}
  .chip i{font-style:normal;cursor:pointer;color:var(--muted)}
  .chip i:hover{color:var(--neg)}
  .cmpmodal{position:fixed;inset:0;z-index:22;display:none;align-items:center;
    justify-content:center;background:rgba(11,14,18,.5)}
  .cmpmodal.on{display:flex}
  .cmpbox{background:var(--surface);border:1px solid var(--border);width:640px;
    max-width:94vw;max-height:88vh;overflow-y:auto;padding:20px 24px;
    box-shadow:var(--lift)}
  .cmpbox h2{margin:0 0 4px;font-family:var(--display);font-size:21px;font-weight:600;
    font-variation-settings:"wght" 600,"wdth" 86}
  .cmpbar{display:flex;align-items:center;gap:8px;margin:2px 0;font-size:12px}
  .cmpbar .plab{width:132px;color:var(--muted)}
  .cmpbar .ptrack{flex:1;height:7px;background:var(--surface2);overflow:hidden}
  .cmpbar b{width:30px;text-align:right;font-family:var(--mono);font-size:11px}
  .legend{display:flex;gap:12px;margin:8px 0 14px;font-size:12.5px;flex-wrap:wrap}
  .legend .dotc{display:inline-block;width:10px;height:10px;margin-right:5px;
    vertical-align:-1px}

  /* ---------- Slot-Vergleich ----------
     Die häufigste Frage im Scouting: „Wie steht Spieler X auf Position Y
     gegen unsere Leute?" Spalten = Stamm, Backup, bis zu drei Kandidaten;
     Zeilen = Leistung, Kennzahlen der Rolle, Preis, Profil. Der Stamm ist
     die Messlatte: seine Spalte ist hinterlegt, jede andere trägt den
     Abstand zu ihm (Δ in Perzentilpunkten). Die Positionskachel im Kopf ist
     das einzige Möbel mit 45°-Anschnitt (Regel 1) und trägt die
     Positionsfarbe (Regel 4). */
  /* Breite folgt dem Inhalt: feste Spalten, damit Balken bei zwei Spielern
     nicht über die halbe Fensterbreite laufen */
  .cmpbox.slotcmp{width:auto;min-width:760px;max-width:96vw;max-height:92vh;
    padding:0 22px 16px}
  /* Kein Innenabstand oben: der mitlaufende Spaltenkopf (sticky) haftet an
     der Oberkante – sonst scrollen Zeilen im Abstand darüber sichtbar weg */
  .cmhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:18px}
  .cmtile{background:var(--grp,var(--accent));color:var(--on-accent);flex:none;
    font-family:var(--display);font-size:16px;font-weight:700;line-height:1;
    font-variation-settings:"wght" 700,"wdth" 80;letter-spacing:.07em;
    padding:11px 20px 10px 13px;
    clip-path:polygon(0 0,calc(100% - var(--chamfer)) 0,100% var(--chamfer),100% 100%,0 100%)}
  .cmtitel{flex:1;min-width:280px}
  .cmtitel h2{margin:0}
  .cmtitel .dsub{margin:3px 0 0}
  .cmhead select{min-width:200px}
  table.cmx{width:auto;border-collapse:separate;border-spacing:0;table-layout:fixed;
    margin-top:12px;font-variant-numeric:tabular-nums lining-nums}
  table.cmx col.lab{width:184px}
  table.cmx col.sp{width:188px}
  table.cmx th,table.cmx td{text-align:left;white-space:normal;vertical-align:top;
    padding:6px 10px;border-bottom:1px solid var(--rule);cursor:default}
  table.cmx thead th{text-transform:none;letter-spacing:0;font-family:var(--sans);
    font-size:12.5px;font-weight:400;color:var(--text);vertical-align:bottom;
    padding:4px 10px 9px;border-bottom:1.5px solid var(--border);position:sticky;top:0}
  table.cmx tbody tr,table.cmx tbody tr:nth-child(even),table.cmx tbody tr:hover,
  table.cmx tbody tr:hover td:first-child{background:transparent;cursor:default}
  table.cmx tbody td:first-child{color:var(--muted);font-size:12px;
    background:var(--surface);line-height:1.35}
  table.cmx td:first-child small{display:block;font-family:var(--mono);font-size:10px;
    color:var(--dim);letter-spacing:.02em}
  /* Die Messlatte: Spalte des Stammspielers durchgehend hinterlegt */
  table.cmx .stamm{background:var(--surface2)}
  table.cmx thead th.stamm{background:var(--surface2)}
  table.cmx tr.cmsec td{white-space:nowrap;overflow:visible;
    font-family:var(--mono);font-size:10px;text-transform:uppercase;
    letter-spacing:.14em;color:var(--muted);padding:16px 10px 5px;
    border-bottom:1px solid var(--border);background:var(--surface)}
  table.cmx tr.cmsec td.stamm{background:var(--surface2)}
  /* Spaltenkopf: Rolle, Name, Eckdaten */
  .cmrolle{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;margin-bottom:6px;
    color:var(--muted);border:1px solid var(--border)}
  th.stamm .cmrolle{background:var(--text);color:var(--surface);border-color:var(--text)}
  .cmrolle em{font-style:normal;font-weight:500;opacity:.75;margin-left:5px}
  .cmname{display:block;background:none;border:0;clip-path:none;padding:0;
    font-family:var(--display);font-size:16.5px;font-weight:600;letter-spacing:0;
    font-variation-settings:"wght" 600,"wdth" 86;text-transform:none;color:var(--text);
    text-align:left;line-height:1.15;cursor:pointer}
  .cmname:hover{color:var(--accent);filter:none}
  .cmmeta{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.45}
  .cmx .cmweg{position:absolute;top:2px;right:4px;background:none;border:0;clip-path:none;
    padding:2px 4px;color:var(--dim);font-size:12px;letter-spacing:0}
  .cmx .cmweg:hover{color:var(--text);filter:none}
  /* Kennzahl: Balken = Perzentil, Zahl, Abstand zum Stamm; darunter der Rohwert */
  .cmkpi{display:flex;align-items:center;gap:7px}
  .cmkpi .cmtrack{flex:1;height:7px;background:var(--surface2);overflow:hidden}
  td.stamm .cmkpi .cmtrack{background:var(--surface)}
  .cmkpi .cmtrack i{display:block;height:100%}
  .cmkpi b{width:24px;text-align:right;font-family:var(--mono);font-size:11.5px}
  .cmd{width:30px;text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
  .cmd.pos{color:var(--pos)} .cmd.neg{color:var(--neg)}
  .cmraw{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:1px}
  .cmwert{font-family:var(--mono);font-size:12px}
  .cmbilanz{font-size:12px}
  .cmbilanz b{font-family:var(--mono);font-size:13px}
  .cmleer{color:var(--dim)}
  /* Kandidat ohne Bewertung („fehlt" aus dem Backend): Grund lesbar, kein Rot */
  .cmfehlt{font-size:11px;color:var(--muted);line-height:1.35;margin-top:3px;
    white-space:normal;max-width:170px}
  /* Kandidat hinzufügen: Suchfeld im Kopf der letzten Spalte */
  table.cmx th.cmadd{vertical-align:bottom}
  .cmadd .cmrolle{border-style:dashed}
  .cmadd input{width:100%;min-width:0;font-size:12px;padding:5px 7px}
  /* rechtsbündig: die Suchspalte ist die letzte, links ist Platz */
  .cmsugg{position:absolute;z-index:5;right:0;margin-top:2px;width:250px;background:var(--surface);
    border:1px solid var(--border);box-shadow:var(--lift);max-height:300px;overflow-y:auto}
  .cmsugg button{display:flex;justify-content:space-between;gap:10px;width:100%;
    background:none;border:0;clip-path:none;padding:7px 10px;text-align:left;
    font-family:var(--sans);font-size:12.5px;font-weight:400;letter-spacing:0;
    text-transform:none;color:var(--text)}
  .cmsugg button span{color:var(--muted);font-family:var(--mono);font-size:10.5px;
    white-space:nowrap}
  .cmsugg button:hover,.cmsugg button.on{background:var(--accent);color:var(--on-accent);filter:none}
  .cmsugg button:hover span,.cmsugg button.on span{color:var(--on-accent)}
  .cmfuss{color:var(--muted);font-size:11.5px;margin-top:12px;line-height:1.5;max-width:120ch}
  /* Vergleichsleiste: der Knopf nennt die Position, auf der verglichen wird */
  .comparebar .cmpos{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  /* Der Vergleich lässt sich aus der Ersatzsuche heraus öffnen und muss dann
     über ihr liegen – beide Fenster teilen sich sonst z-index 22. */
  #cmpModal{z-index:23}
  .tcmp{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:11.5px}
  /* Umschalter unter „mein team": Brett | Ligavergleich */
  .tactnav{padding:14px 16px 0}
  /* Rollenkürzel wie im Spiel (StS, BsV …): Groß-/Kleinschreibung bleibt */
  .rkurz{display:inline-block;margin-left:6px;padding:0 5px;font-family:var(--mono);font-size:10px;
    font-weight:500;letter-spacing:.04em;color:var(--muted);border:1px solid var(--border);vertical-align:1px}
  .replrolle{font-size:12px;margin:-2px 0 6px}
  /* Fuß zur Rolle im Slot-Vergleich: Grün passt, Violett dagegen – kein Rot */
  .fusszeile{font-size:11px;margin-top:2px}
  .fusszeile.fpasst{color:var(--pos)} .fusszeile.fgegen{color:var(--neg)}
  .fusszeile.fneutral{color:var(--muted)}
  /* Rückfrage beim Kader-Import (D10): Frage als Überschrift, Abbrechen gefüllt */
  #rueckModal{z-index:30}
  .rueckbox{width:560px}
  .rueckbox h2{font-size:19px;line-height:1.3;margin:0 0 8px}
  .rueckbox p{margin:0 0 10px;font-size:12.5px;line-height:1.5}
  .rueckmeta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:18px}
  .rueckknoepfe{display:flex;gap:12px;align-items:center}
  /* Meldeliste am Brett (D4): eine Zeile unter dem Platz */
  .tmelde{font-family:var(--mono);font-size:10.5px;color:var(--text);margin-top:4px}
  .tmelde .tmlab{color:var(--muted);text-transform:uppercase;letter-spacing:.11em;font-size:9.5px;margin-right:4px}
  .tmelde.riss{color:var(--neg)}
  .tmelde.cl{color:var(--muted);margin-top:1px}
  /* Zwei Stände im Kopf des Ligavergleichs: Daten und Kader veralten getrennt */
  .lstand{display:flex;gap:14px;margin-top:3px;font-family:var(--mono);font-size:11px;color:var(--text)}
  .lvereine{font-size:11.5px;margin-top:3px}
  .lfehlen{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
  /* „Vorläufig": gestrichelt wie jede dünne Datenbasis im Werkzeug, keine Warnfarbe */
  .lvorl{border:1px dashed var(--dim);padding:7px 12px;margin:8px 0 0;font-size:12.5px;line-height:1.5}
  .lgescoutet{text-decoration:underline dashed var(--dim);text-underline-offset:3px}
  .clopt .clname{display:flex;flex-direction:column;gap:1px;min-width:0}
  .clopt em{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--pos)}
  .clopt em.gesc{color:var(--muted)}
  .clopt.on em{color:var(--on-accent)}
  /* Vereinsauswahl für das CL-Niveau: gewählte als Chips, Angebot als Raster */
  .clwahl{background:var(--surface2);border:1px solid var(--border);padding:12px 14px 14px;margin:6px 0 14px}
  .clchips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
  .clwahl input{min-width:260px;margin-bottom:8px}
  .clliste{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px;
    max-height:220px;overflow-y:auto}
  .clopt{display:flex;justify-content:space-between;gap:8px;background:var(--surface);color:var(--text);
    border:1px solid var(--border);clip-path:none;padding:6px 9px;font-family:var(--sans);font-size:12px;
    font-weight:400;letter-spacing:0;text-transform:none;text-align:left}
  /* die Zahl rechts – nur das letzte Kind, sonst erbt der Vereinsname die Monoschrift */
  .clopt > span:last-child{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .clopt:hover{border-color:var(--accent);filter:none}
  .clopt.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .clopt.on > span:last-child{color:var(--on-accent)}

  /* ---------- Ligavergleich ----------
     Je Position ein Streifen: Striche = je ein Ligaverein, senkrechte Linie =
     Top-4-Schwelle, Punkt = wir (Figuren sind rund, Regel 3). Grün auf,
     Violett unter Top-4-Niveau – kein Rot (Regel 2). Unter acht Vereinen mit
     Daten ist ein Rang keine Aussage: Zeile gedämpft, Kachel nur als Kontur,
     hohler Punkt, gestrichelte Unterkante am Hinweis wie bei dünner
     Stichprobe. */
  .ligawrap{padding:14px 16px 26px;max-width:1240px}
  .ligakopf{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px}
  .ligakopf .ltitel{flex:1;min-width:340px}
  .lbefund{font-size:12.5px;line-height:1.7;margin:8px 0 14px;padding:8px 12px;
    background:var(--surface2);border-left:3px solid var(--accent)}
  .lbefund b{font-weight:600}
  table.liga{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
  table.liga th,table.liga td{position:static}
  table.liga th{background:transparent;font-family:var(--mono);font-size:10px;font-weight:500;
    letter-spacing:.11em;color:var(--muted);text-transform:uppercase;padding:6px 8px;
    border-bottom:1.5px solid var(--border);cursor:default;text-align:right;vertical-align:bottom}
  table.liga td{padding:8px 8px;border-bottom:1px solid var(--rule);font-size:12.5px;
    text-align:right;cursor:pointer;vertical-align:middle;background:transparent}
  table.liga td.lname{text-align:left;white-space:normal}
  table.liga tbody tr{background:transparent}
  table.liga tbody tr:hover td{background:var(--rowhover)}
  table.liga tr.lsel td{background:var(--surface2)}
  table.liga tr.ldet td{background:var(--surface);cursor:default;padding:4px 8px 16px;text-align:left}
  table.liga tr.ldet:hover td{background:var(--surface)}
  table.liga tr.duenn td{color:var(--muted)}
  .ltile{display:inline-block;min-width:40px;text-align:center;background:var(--grp);
    color:var(--on-accent);font-family:var(--display);font-size:12.5px;font-weight:700;
    font-variation-settings:"wght" 700,"wdth" 80;letter-spacing:.06em;padding:5px 6px 4px}
  tr.duenn .ltile{background:transparent;color:var(--grp);box-shadow:inset 0 0 0 1px var(--grp)}
  .lpos{font-weight:600}
  .leig{font-size:11.5px;color:var(--muted);margin-top:1px}
  .lwert{font-family:var(--mono);font-size:14px;font-weight:700}
  .ldim{color:var(--dim)}
  .lkeine{color:var(--dim);text-decoration:underline dashed var(--dim);text-underline-offset:3px}
  .lachse{position:relative;height:12px}
  .lachse span{position:absolute;transform:translateX(-50%);letter-spacing:0}
  /* Randbeschriftungen nach innen, sonst ragen sie in die Nachbarspalten */
  .lachse span:first-child{transform:none}
  .lachse span:last-child{transform:translateX(-100%)}
  .lstrip{position:relative;height:24px}
  .lstrip::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--rule)}
  .lt{position:absolute;top:6px;width:2px;height:12px;margin-left:-1px;background:var(--muted);opacity:.45}
  .lt.vor{opacity:.95;background:var(--text)}
  .lt4{position:absolute;top:0;height:24px;margin-left:-1px;border-left:2px solid var(--accent)}
  .lme{position:absolute;top:5px;width:14px;height:14px;margin-left:-7px;border-radius:50%;
    background:var(--pos);box-shadow:0 0 0 2px var(--surface)}
  .lme.unter{background:var(--neg)}
  .lme.leer{background:var(--surface);box-shadow:inset 0 0 0 2px var(--dim)}
  .lleg{display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}
  .lleg span{display:inline-flex;align-items:center;gap:6px}
  .lleg .lt,.lleg .lt4,.lleg .lme{position:static;display:inline-block;margin:0}
  .lleg .lt4{height:12px}
  table.lclub{border-collapse:collapse;font-size:12px;width:100%}
  table.lclub td{padding:3px 8px;border-bottom:1px solid var(--rule);text-align:left;cursor:default;
    white-space:normal;background:transparent}
  table.lclub td:first-child{width:28px;text-align:right;position:static}
  table.lclub td:last-child{width:60px;text-align:right;font-family:var(--mono)}
  table.lclub tr.wir td{background:var(--surface2)}
  table.lclub .lsp{color:var(--text)}
  /* Ersatzsuche: Häkchen legt den Kandidaten in den Slot-Vergleich, ohne die
     Zeile aufzuklappen – schmal, damit die Tabelle ins Fenster passt */
  table.repl td.vgl{width:1%;text-align:center;cursor:default}
  table.repl td.vgl input{cursor:pointer}

  /* ---------- Signale ----------
     Kauf = Grün, Verkauf = Violett. Zusätzlich zur Farbe trägt jede Zeile
     eine Kante links, damit das Zeichen nicht allein an der Farbe hängt. */
  .sighead{display:flex;align-items:center;justify-content:space-between;gap:20px;
    flex-wrap:wrap;padding:14px 16px 4px}
  table.sigtbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;
    margin-bottom:8px}
  table.sigtbl th,table.sigtbl td{padding:8px 12px;text-align:right;
    border-bottom:1px solid var(--rule);white-space:nowrap}
  table.sigtbl th{position:static;color:var(--muted);font-family:var(--mono);
    font-size:10px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;
    background:transparent;border-bottom:1.5px solid var(--border)}
  table.sigtbl th:first-child,table.sigtbl td:first-child{text-align:left;position:static}
  table.sigtbl tbody tr:hover{background:var(--rowhover)}
  /* Die Zeilen tragen die Klassen .pos/.neg – ohne diese Ruecknahme faerbt der
     Erbgang jede Zahl der Zeile gruen bzw. violett, und die Farbe der einzelnen
     Kennzahl saegt sich damit selbst ab. Die Zugehoerigkeit steht in der Kante
     links und in der Ueberschrift; das reicht. */
  table.sigtbl tr.sigrow{color:var(--text)}
  table.sigtbl tr.sigrow.pos td:first-child{box-shadow:inset 4px 0 0 var(--pos)}
  table.sigtbl tr.sigrow.neg td:first-child{box-shadow:inset 4px 0 0 var(--neg)}
  .sigdot{display:inline-block;width:9px;height:9px;vertical-align:-1px;margin-right:6px}
  .sigdot.buy{background:var(--pos)}
  .sigdot.sell{background:var(--neg)}
  /* Zwei Elemente + Klasse: muss die Regel `table.sigtbl td` schlagen, sonst
     landet die Begruendung rechtsbuendig – dieselbe Falle wie im alten Bogen. */
  table.sigtbl td.reason{white-space:normal;text-align:left;width:34%;
    font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.55;
    border-left:0}

  /* ---------- Dossier ---------- */
  .cardwrap{display:flex;gap:26px;flex-wrap:wrap;padding:16px}
  .cardstage{display:flex;flex-direction:column;gap:12px;align-items:center}
  .cardsvg{width:340px;max-width:88vw;filter:drop-shadow(0 8px 20px rgba(11,14,18,.28))}
  .cardpanel{flex:1;min-width:300px;max-width:520px}
  .cardpanel .dsec:first-child{margin-top:0}
  .cardpick{display:flex;flex-direction:column;gap:6px;width:340px;max-width:88vw}
  .cardpick input,.cardpick select{width:100%;min-width:0}
  .cardpick #cardCount{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em}
  .fieldrow{display:flex;gap:10px;align-items:center;margin:7px 0;font-size:12.5px}
  .fieldrow label{width:118px;color:var(--muted)}
  .fieldrow input[type=text],.fieldrow input[type=number],.fieldrow select{flex:1;min-width:0}
  .fieldrow input[type=range]{flex:1;min-width:0}
  .statedit{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:4px}
  .statedit .se{display:flex;gap:6px;align-items:center;font-size:12px}
  /* min-width:0 nötig: die Grundregel input{min-width:150px} würde die
     schmalen Felder aufblasen und die Editor-Zeile über den Rand schieben */
  .statedit .se input.lab{width:52px;min-width:0;text-transform:uppercase}
  .statedit .se input.val{width:52px;min-width:0;font-family:var(--mono)}
  .statedit .se input[type=range]{flex:1;min-width:40px}
  .tierpick{display:flex;gap:6px;flex-wrap:wrap}
  .tierpick button{padding:6px 11px;border:1px solid var(--border);clip-path:none;
    background:var(--surface2);color:var(--text);font-size:10.5px;font-weight:500}
  .tierpick button:hover{filter:none;border-color:var(--muted)}
  .tierpick button.on{border-color:var(--accent);color:var(--accent);font-weight:700;
    box-shadow:inset 0 -2px 0 var(--accent)}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:18px;padding:8px 16px 40px}
  .galitem{background:var(--surface);border:1px solid var(--border);padding:12px;
    display:flex;flex-direction:column;gap:8px}
  .galitem .cardsvg{width:100%;cursor:pointer}
  .galmeta{display:flex;flex-direction:column;gap:6px}
  .galmeta input{width:100%;font-weight:600;min-width:0}
  .galbtns{display:flex;gap:6px}
  .galbtns button{flex:1;font-size:10px;padding:5px 6px}
  .galsub{color:var(--muted);font-family:var(--mono);font-size:10px;letter-spacing:.04em}
  .ovrsync{display:flex;gap:10px;align-items:center;margin:7px 0;font-size:12.5px;
    color:var(--muted)}

  /* ---------- Taktik ---------- */
  .tactwrap{display:flex;gap:26px;flex-wrap:wrap;padding:16px;align-items:flex-start}
  .tactpitch{display:flex;flex-direction:column;gap:8px;width:430px;max-width:92vw}
  .pitchsvg{width:100%;height:auto;display:block}
  .tslot{cursor:pointer}
  .tslot:hover rect{stroke:var(--accent);stroke-width:1}
  .tactpanel{flex:1;min-width:340px;max-width:640px}
  .tactpanel .dsec:first-child{margin-top:0}
  .taufg{margin:6px 0 14px;padding-left:18px;font-size:12.5px;line-height:1.55}
  .taufg li{margin:3px 0}
  .tblind{margin:6px 0 0;padding-left:18px;font-size:11.5px;line-height:1.5;
    color:var(--muted)}
  table.tcand{width:100%;border-collapse:collapse;margin:6px 0 14px;
    font-variant-numeric:tabular-nums}
  table.tcand th{position:static;background:transparent;font-family:var(--mono);
    font-size:10px;font-weight:500;letter-spacing:.11em;color:var(--muted);
    text-align:right;padding:5px 8px;border-bottom:1.5px solid var(--border);
    text-transform:uppercase;cursor:default}
  table.tcand td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--rule);
    font-size:12.5px;cursor:pointer}
  table.tcand td.name{text-align:left;font-weight:600}
  table.tcand tr:hover td{background:var(--rowhover)}
  table.tcand tr.tsel td{background:var(--surface2)}
  /* Kante nur an der ersten Zelle – sonst bekommt jede Spalte einen Balken */
  table.tcand tr.tsel td:first-child{box-shadow:inset 4px 0 0 var(--accent)}

  /* ---------- Ersatzsuche ----------
     Kontextmenü am Zeiger, Ergebnis in einem eigenen Fenster. Das Menü liegt
     über dem Modal-Stapel (z-index 22), damit es auch aus dem Ersatzfenster
     heraus aufgehen kann. */
  .ctxmenu{position:fixed;z-index:40;min-width:190px;background:var(--surface);
    border:1px solid var(--border);box-shadow:var(--lift);padding:4px 0}
  .ctxmenu .ctxhead{padding:6px 12px 7px;color:var(--muted);font-family:var(--mono);
    font-size:10px;letter-spacing:.11em;text-transform:uppercase;
    border-bottom:1px solid var(--rule);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:280px}
  .ctxmenu button{display:block;width:100%;text-align:left;background:none;
    border:0;clip-path:none;padding:8px 12px;font-family:var(--sans);
    font-size:12.5px;font-weight:400;letter-spacing:0;color:var(--text);
    text-transform:none}
  .ctxmenu button:hover{background:var(--accent);color:var(--on-accent);filter:none}
  /* Untereintraege der Spezialistensuche: eingerueckt, damit die Staffelung
     ohne Trennlinie je Eintrag lesbar bleibt. */
  .ctxmenu button.ctxsub{padding-left:24px;color:var(--muted)}
  .ctxmenu button.ctxsub:hover{color:var(--on-accent)}
  .ctxmenu .ctxsep{padding:7px 12px 3px;color:var(--muted);font-family:var(--mono);
    font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
    border-top:1px solid var(--rule);margin-top:4px}
  .ctxmenu .ctxsep:empty{padding:0;margin-top:4px}
  .seg.archseg{margin:6px 0 2px}

  /* Formpfeil und Elf-Marken in der Kandidatenliste */
  .fpfeil{display:inline-flex;vertical-align:-1px;margin-left:5px}
  .telfmark,.tbusy{display:inline-block;margin-left:6px;padding:1px 5px;
    font-family:var(--mono);font-size:9px;letter-spacing:.08em;
    text-transform:uppercase;vertical-align:1px}
  .telfmark{background:var(--accent);color:var(--on-accent)}
  /* manuell gesetzt: umrandet statt gefuellt, damit man den Pin von der
     Automatik unterscheidet, ohne eine weitere Farbe einzufuehren */
  .telfmark.manuell{background:transparent;color:var(--accent);
    box-shadow:inset 0 0 0 1px var(--accent)}
  .tbusy{border:1px solid var(--rule);color:var(--muted)}
  table.tcand tr.telf td{background:var(--surface2)}
  table.tcand tr.telf td:first-child{box-shadow:inset 4px 0 0 var(--rule)}
  /* Auswahl schlaegt Elf-Markierung: gleiche Spezifitaet, deshalb MUSS diese
     Regel nach .telf stehen, sonst gewinnt die Elf-Kante. */
  table.tcand tr.tsel.telf td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
  /* 1020 statt 920: seit die Zellen nicht mehr umbrechen und die Spalte
     „Vgl" dazukam, braucht die Liste ~960 px; kleine Fenster deckelt 94vw */
  .replbox{width:1020px}
  .replhead{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;
    margin:10px 0 4px}
  table.repl{width:100%;border-collapse:collapse;margin:8px 0 0;
    font-variant-numeric:tabular-nums}
  table.repl th{position:static;background:transparent;font-family:var(--mono);
    font-size:10px;font-weight:500;letter-spacing:.11em;color:var(--muted);
    text-align:right;padding:5px 7px;border-bottom:1.5px solid var(--border);
    text-transform:uppercase;cursor:default}
  table.repl td{padding:5px 7px;text-align:right;font-size:12.5px;
    border-bottom:1px solid var(--rule);cursor:pointer}
  table.repl td.name{text-align:left;font-weight:600}
  table.repl td.info{text-align:left;font-size:11px;color:var(--muted)}
  table.repl tr.rsel td{background:var(--surface2)}
  table.repl tr:hover td{background:var(--rowhover)}
  table.repl tr.rsel td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
  /* Die Gegenüberstellung ist Fließtext plus Balken – die Rechtsbündigkeit
     der Tabellenzellen darf hier nicht durchschlagen. */
  table.repl tr.rdet td{background:var(--surface);cursor:default;
    padding:10px 8px 14px;text-align:left}
  table.repl tr.rdet:hover td{background:var(--surface)}
  /* Marken: eckige Flächen, kein Rot – Umschulung violett wie „Verkauf“,
     eigener Kader grün, veralteter Stand neutral grau. */
  .rbadge{display:inline-block;padding:1px 5px;margin-left:5px;font-family:var(--mono);
    font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
    border:1px solid var(--border);color:var(--muted);vertical-align:1px}
  .rbadge.um{border-color:rgba(var(--heat-neg),.6);color:rgb(var(--heat-neg))}
  .rbadge.kader{border-color:rgba(var(--heat-pos),.6);color:rgb(var(--heat-pos))}
  /* Gegenüberstellung: oben der zu ersetzende Spieler (grau), darunter der
     Kandidat (Hitze). Zwei Balken statt einer Differenzzahl, weil erst die
     Lage beider Werte zeigt, WO der Unterschied herkommt. */
  .rcmp{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;
    margin:6px 0}
  .rcmp .rlab{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .rline{display:flex;align-items:center;gap:7px;margin:2px 0}
  .rline .rtrack{flex:1;height:7px;background:var(--surface2);overflow:hidden}
  .rline .rtrack i{display:block;height:100%}
  .rline b{width:26px;text-align:right;font-family:var(--mono);font-size:10.5px}
  .rline .rval{width:70px;text-align:right;font-family:var(--mono);font-size:10.5px;
    color:var(--muted)}

  /* ---------- Schmale Fenster ----------
     Das Leitschild kippt vom Rand nach oben und wird zur Bandreihe. */
  @media (max-width:900px){
    body{flex-direction:column}
    .rail{width:auto;flex-direction:row;gap:0;padding:0;overflow-x:auto;
      overflow-y:hidden;border-right:0;border-bottom:1px solid var(--border)}
    .rail button{padding:7px 12px 6px;flex:none}
    .rail .ico svg{width:21px;height:21px}
    .rail .sep,.rail .gap{display:none}
    header{height:auto;padding:10px 14px;flex-wrap:wrap}
    header .status{max-width:100%;order:9;flex-basis:100%}
    .controls,.controls.sub{padding:8px 14px}
    #search,#count{margin-left:0}
    .wrap{padding:12px 14px 30px}
    .comparebar{left:50%}
  }

  /* ---------- Bewegung nur, wenn erwünscht ---------- */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important;
      animation-iteration-count:1 !important;transition-duration:.001ms !important}
    .spin{animation:none;opacity:.75}
  }
</style>
</head>
<body>

<!-- Vor dem Leitschild liegen sieben Schaltflächen. Ohne diesen Absprung tabbt
     man sich bei jedem Wechsel erst durch alle Positionen zur Tabelle durch. -->
<a class="skip" href="#daten">Zur Auswertung springen</a>

<!-- Leitschild: Positionsgruppen als Piktogramme. Die Kennungen bleiben
     dieselben wie bisher (data-tab), damit setTab() unverändert greift. -->
<nav class="rail" id="tabSeg" aria-label="Positionsgruppe">
  <button class="on" data-tab="all" onclick="setTab('all')" title="Alle Positionen">
    <span class="ico" data-ico="p_all"></span><em>alle</em></button>
  <div class="sep"></div>
  <button data-tab="tw"  onclick="setTab('tw')"  title="Torhüter">

  <button data-tab="def" onclick="setTab('def')" title="Abwehr">
    <span class="ico" data-ico="p_def"></span><em>abw</em></button>
  <button data-tab="mid" onclick="setTab('mid')" title="Mittelfeld">
    <span class="ico" data-ico="p_mid"></span><em>mit</em></button>
  <button data-tab="off" onclick="setTab('off')" title="Offensiv">
    <span class="ico" data-ico="p_off"></span><em>off</em></button>
  <button data-tab="st"  onclick="setTab('st')"  title="Sturm">
    <span class="ico" data-ico="p_st"></span><em>stu</em></button>
  <div class="gap"></div>
  <div class="sep"></div>
  <button data-tab="unk" onclick="setTab('unk')" title="Position nicht im RAM lesbar">
    <span class="ico" data-ico="p_unk"></span><em>ohne</em></button>
</nav>

<div class="main">

<header>
  <div class="brand">
    <span class="logomark">fm</span>
    <span class="wordmark">companion</span>
    <span class="badge">moneyball</span>
  </div>
  <div class="grow"></div>
  <span class="status" id="status">Bereit.</span>
  <button id="importBtn" class="ghost" onclick="doImport()" title="FM-HTML-Export importieren (Scouting-Ziele + Marktwerte)"><span class="ico" data-ico="import"></span>Import</button>
  <button id="collectBtn" class="ghost" onclick="toggleCollect()" title="Scouting-Modus für 10 Minuten: scannt alle 20 s statt alle 3 Minuten. Währenddessen in FM Listen (Liga-Statistik, Scouting, Kader) durchblättern – jeder dabei geladene Name wird dauerhaft gemerkt, seine Statistiken liegen ohnehin im RAM und aktualisieren sich danach von selbst."><span class="ico" data-ico="collect"></span><span class="lbl">Scouting</span></button>
  <button id="autoBtn" class="ghost" onclick="toggleAuto()" title="Auto-Scan: liest den RAM selbstständig – kein Klicken nötig"><span class="ico" data-ico="auto"></span><span class="lbl">Auto</span></button>
  <button id="themeBtn" class="ghost" onclick="toggleTheme()" title="Hell / Dunkel"><span class="ico" data-ico="sun"></span></button>
  <button id="scanBtn" onclick="doScan()">Kader scannen</button>
</header>

<div class="controls">
  <div class="viewnav" id="modeSeg">
    <button class="on" data-mode="tactic" onclick="setMode('tactic')">mein team</button>
    <button data-mode="table" onclick="setMode('table')">tabelle</button>
    <button data-mode="chart" onclick="setMode('chart')">chart</button>
    <button data-mode="signals" onclick="setMode('signals')">signale</button>
    <button data-mode="cards" onclick="setMode('cards')">dossier</button>
  </div>
  <button id="watchFilter" class="wbtn" onclick="toggleWatchFilter()" title="Nur Merkliste zeigen">★ Merkliste</button>
  <button id="u21Filter" class="wbtn" onclick="toggleU21()" title="Nur Spieler bis 21 Jahre. Das Alter kommt jetzt aus dem Geburtsdatum im RAM, nicht mehr nur aus Exporten.">U21</button>
  <select id="ranking" onchange="applyRanking()"></select>
  <span id="axisSel" style="display:none;gap:6px;align-items:center">
    <label class="status" style="display:flex;gap:5px;align-items:center">X
      <select id="xAxis" onchange="setAxis()"></select></label>
    <label class="status" style="display:flex;gap:5px;align-items:center">Y
      <select id="yAxis" onchange="setAxis()"></select></label>
  </span>
  <input id="search" type="search" placeholder="Spieler suchen…" oninput="sucheGeaendert()">
</div>

<div class="controls sub">
  <div class="seg" id="srcSeg" title="Pool = je Spieler der neueste Stand aus allen Scans (wächst mit jedem Scouting-Scan)">
    <button class="on" data-src="last" onclick="setSrc('last')">Letzter Scan</button>
    <button data-src="pool" onclick="setSrc('pool')">Pool</button>
  </div>
  <label class="status" style="display:flex;gap:8px;align-items:center">
    ab <b id="minMinVal" style="min-width:26px;text-align:right;font-family:var(--mono)">45</b> Min
    <input type="range" id="minMin" min="0" max="450" step="15" value="45"
           style="width:130px;min-width:130px;padding:0"
           oninput="minMinInput(this.value)" onchange="minMinCommit(this.value)">
  </label>
  <label class="status" id="curMaxWrap" style="display:flex;gap:6px;align-items:center"
         title="Obergrenze je Wettbewerb. FM legt die Statistik getrennt nach Liga, Pokal und Europa ab; die Saison eines Spielers ist die Summe daraus. Ein einzelner Wettbewerb mit mehr Minuten als hier eingestellt gilt als Altsaison – 3600 entspricht einer vollen Liga-Saison.">
    Wettbewerb max.
    <input type="number" id="curMax" min="90" max="6000" step="90"
           style="width:84px;min-width:84px" onchange="curMaxChanged(this.value)">
    Min
  </label>
  <label class="status" id="autoPauseWrap" style="display:none;gap:6px;align-items:center"
         title="Pause zwischen den automatischen Scans (kürzer = aktueller, aber mehr Last)">
    Auto-Scan alle
    <input type="number" id="autoPause" min="3" max="600" step="5"
           style="width:64px;min-width:64px" onchange="setAutoPause(this.value)"> s
  </label>
  <span class="status" id="count"></span>
</div>

<main class="wrap" id="daten" tabindex="-1">
  <div id="tableHost"></div>
</main>

</div><!-- /.main -->

<div id="overlay" class="overlay" onclick="closeAll()"></div>
<aside id="drawer" class="drawer"></aside>
<div id="compareBar" class="comparebar"></div>

  <div class="cmpbox" id="cmpBox"></div>
</div>
<div id="replModal" class="cmpmodal" onclick="if(event.target===this)closeRepl()">

</div>

<script>
// Strichzeichnungen statt Emoji – Emoji-Icons sind der auffaelligste Bruch mit
// dem Papier-Entwurf (und der deutlichste Generator-Verdacht). currentColor,
// damit sie die Tinte des jeweiligen Zustands uebernehmen.
const SVG = (d,extra="") => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" `
  + `stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
const ICON = {
  import: SVG(`<path d="M8 2v7m0 0 2.8-2.8M8 9 5.2 6.2"/><path d="M2.5 11v2.5h11V11"/>`),
  collect: SVG(`<circle cx="8" cy="8" r="5.6"/><circle cx="8" cy="8" r="1.7"/><path d="M8 .8v1.8M8 13.4v1.8M.8 8h1.8M13.4 8h1.8"/>`),
  auto:   SVG(`<path d="M13.4 8a5.4 5.4 0 1 1-1.75-4"/><path d="M13.6 2.5v3.1h-3.1"/>`),
  sun:    SVG(`<circle cx="8" cy="8" r="3"/><path d="M8 1.1v1.5M8 13.4v1.5M1.1 8h1.5M13.4 8h1.5M3.1 3.1l1.1 1.1M11.8 11.8l1.1 1.1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1"/>`),
  moon:   SVG(`<path d="M13.4 9.7A5.9 5.9 0 0 1 6.3 2.6a5.9 5.9 0 1 0 7.1 7.1Z"/>`),
  save:   SVG(`<path d="M2.5 2.5h8.6L13.5 5v8.5h-11z"/><path d="M5 2.5v4h5v-4M5 13.5v-4h6v4"/>`),
  png:    SVG(`<path d="M2.2 3.2h11.6v9.6H2.2z"/><path d="m2.2 10.4 3.4-3.4 3 3 2-2 3.2 3.2"/><circle cx="10.4" cy="5.8" r="1"/>`),
};

// ---- Positionspiktogramme (Leitschild links) ----------------------------
// Aicher-Grammatik: jede Figur besteht nur aus Senkrechten, Waagerechten und
// exakten 45°-Diagonalen, Enden rund, Ball als volle Scheibe. Das ist keine
// Zierde – im Raster von 200 Zeilen erkennt man die Positionsgruppe daran
// schneller als an drei Buchstaben. Die Kuerzel stehen trotzdem darunter.
// Aicher zeichnete Silhouetten, keine Strichmaennchen: Kopf und Ball sind volle
// Scheiben, Gliedmassen breite Balken mit runden Enden. Das haelt die Figuren
// auch bei 28 px zusammen – duenne Linien mit offenem Kopf laufen bei der
// Groesse zu.
const PIKTO = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" `
  + `stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const KOPF = (x,y) => `<circle cx="${x}" cy="${y}" r="2.9" fill="currentColor" stroke="none"/>`;
const BALL = (x,y,r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="currentColor" stroke="none"/>`;
Object.assign(ICON, {
  // Kein Filter: das Aufgebot als Raster, bewusst keine Figur
  p_all: PIKTO(BALL(7.4,7.4,2.5)+BALL(16.6,7.4,2.5)+BALL(7.4,16.6,2.5)+BALL(16.6,16.6,2.5)),
  // Torhueter: weites V nach oben, Ball in der Luft – als Einziger greift er hoch
  p_tw:  PIKTO(KOPF(9,7) + `<path d="M9 9.9v5.6"/>`
             + `<path d="M9 11.5 2.5 5M9 11.5 15.5 5"/>`
             + `<path d="M9 15.5 5 19.5M9 15.5l4 4"/>` + BALL(19.4,3.4,2.3)),
  // Abwehr: Arme waagerecht, breiter Stand, kein Ball – der Riegel
  p_def: PIKTO(KOPF(12,6.6) + `<path d="M12 9.5v6"/>`
             + `<path d="M5.5 11.5h13"/>`
             + `<path d="M12 15.5 7.5 20M12 15.5l4.5 4.5"/>`),
  // Mittelfeld: enger Stand, Arme gleich, Ball links am Fuss – verteilen.
  // Die drei Feldspieler-Zeichen unterscheiden sich vor allem durch die Lage
  // des Balls: links unten (verteilen), rechts voraus (laufen), rechts oben
  // (schiessen). Das ist bei 28 px der einzige Unterschied, der wirklich traegt.
  p_mid: PIKTO(KOPF(13,6.6) + `<path d="M13 9.5v5.5"/>`
             + `<path d="M13 11.5 16.5 15M13 11.5 9.5 15"/>`
             + `<path d="M13 15v4.8M13 15l-3.5 3.5"/>` + BALL(5.4,19.6,2.2)),
  // Offensiv: voller Laufschritt, Ball weit voraus
  p_off: PIKTO(KOPF(10,6.6) + `<path d="M10 9.5v5.5"/>`
             + `<path d="M10 11.5 14.5 7M10 11.5 5.5 16"/>`
             + `<path d="M10 15 5 20M10 15l5 5"/>` + BALL(19.6,20,2.2)),
  // Sturm: Schussbein vor, Flugbahn und Ball auf derselben 45°-Geraden
  p_st:  PIKTO(KOPF(9,6.6) + `<path d="M9 9.5v5.5"/>`
             + `<path d="M9 11.5 4.5 16M9 11.5l4.5-4.5"/>`
             + `<path d="M9 15 5 19M9 15l4.5 4.5"/>`
             + `<path d="m15.6 17.4 2-2" stroke-width="1.7"/>` + BALL(20.4,12.6,2.3)),
  // Position nicht im RAM lesbar
  p_unk: PIKTO(`<path d="M8 8.4a4 4 0 1 1 4 4v2.2"/>` + BALL(12,19,1.5)),
});
/** Fuellt alle <span class="ico" data-ico="…"> mit ihrer Zeichnung. */
function paintIcons(root){
  (root||document).querySelectorAll(".ico[data-ico]").forEach(s=>{
    s.innerHTML = ICON[s.dataset.ico] || ""; });
}
/** Beschriftung einer Kopfzeilen-Schaltflaeche aendern, ohne das Icon zu verlieren. */
function setBtnLabel(id, text){
  const b=document.getElementById(id), l=b&&b.querySelector(".lbl");
  if(l) l.textContent = text;
}

let PLAYERS = [];
let RANKINGS = [];
let TAB = "all";
// Startseite ist der eigene Kader, nicht die Tabelle: die Frage beim Oeffnen
// lautet "wer steht gerade wie da", nicht "zeig mir 7000 Zeilen". Die Tabelle
// bleibt als Tab erreichbar.
let MODE = "tactic";
let SRC = "last";          // "last" = letzter Snapshot, "pool" = akkumulierter Pool
let MINMIN = 45;           // Minuten-Untergrenze (Slider)
let WATCHFILTER = false;   // nur Merkliste-Spieler zeigen
let U21ONLY = false;       // nur Spieler bis 21 (Talente)
let SIG_MIN = 900;         // Mindest-Minuten fuer Signale (Glueck/Pech raus)
let sortKey = "score", sortDesc = true, maxDuels = 1;
let xKey = "finishing", yKey = "goals_p90";

// Kennzahlen fuer die Chart-Achsen (Moneyball: Effizienz & Produktion pro 90)
const METRICS_FIELD = [
  ["score","Moneyball-Score"],
  ["dna","Vereins-DNA"],
  ["finishing","xG-Überperformance"], ["goals_p90","Tore/90"], ["xg_p90","xG/90"],
  ["xa_p90","xA/90"], ["assists_p90","Vorlagen/90"], ["rating","Ø-Note"],
  ["attack_p90","Angriff/90"], ["shots_p90","Schüsse/90"],
  ["shot_acc","Trefferquote %"], ["dribbles_p90","Dribblings/90"],
  ["duels_p90","Zweikämpfe/90"], ["duel_pct","Zweikampfquote %"],
  ["press_p90","Pressing/90"], ["press_pct","Pressing-Quote %"],
  ["prog_p90","Progr. Pässe/90"], ["int_p90","Abgefangen/90"],
  ["keyp_p90","Schlüsselpässe/90"], ["loss_p90","Ballverluste/90"],
  ["rec_p90","Ballgewinne/90"],
  ["header_pct","Kopfball %"], ["pass_pct","Pass %"],
  ["value_m","Marktwert (M€)"], ["value_score","Wert-Effizienz"], ["age","Alter"],
  ["talent","Talent (Altersband)"], ["pers_score","Charakter"],
  ["goals","Tore"], ["xg","xG"], ["minutes","Minuten"],
];
const METRICS_GK = [
  ["score","Moneyball-Score"],
  ["note_resid","Note über Erwartung"], ["gp_shot","Verhindert je 100 Schüsse"],
  ["save_pct","Paradenquote %"], ["sot_faced","Schüsse aufs Tor"],
  ["goals_prevented","Goals Prevented"], ["xga","xGA"], ["conceded","Gegentore"],
  ["conceded_p90","Gegentore/90"], ["rating","Ø-Note"], ["pass_pct","Pass %"],
  ["pers_score","Charakter"], ["apps","Einsätze"], ["minutes","Minuten"],
];
const metricsFor = () => TABS[TAB].gk ? METRICS_GK : METRICS_FIELD;

const NAME=["name","Spieler"], POS=["pos_label","Pos"], MIN=["minutes","Min"];
const C_GOALS=["goals","Tore"], C_XG=["xg","xG"], C_FIN=["finishing","Δ xG"],
      C_XA=["xa","xA"], C_SH=["shots_on","Schüsse"], C_DU=["duels","Zweik."],
      C_DR=["dribbles","Dribbl."], C_PP=["pass_pct","Pass %"], C_FO=["fouls","Fouls"],
      C_NOTE=["rating","Note"], C_AS=["assists","Vorl."],
      C_DPCT=["duel_pct","ZWK %"], C_TS=["shot_acc","T-Sch %"],
      C_KGW=["headers_won","Kopfb."], C_KL=["clearances","Klär."],
      C_SC=["score","Score"], C_PRG=["prog_passes","Pr Päss."],
      C_PRW=["press_win","Pressing"], C_INT=["interceptions","Abgef."],
      C_LOSS=["losses","Ballverl."],
      C_AGE=["age","Alter"], C_VAL=["value_m","Wert M€"], C_VEFF=["value_score","€-Eff"],
      // Talent = Perzentil im eigenen Altersband auf der eigenen Position
      C_TAL=["talent","Talent"],
      // Fair Value = Urteil über den Abstand des Marktwerts zum
      // leistungsbasierten Schätzwert; sortiert wird weiter nach dem Abstand.
      // „Markt → Fair" im Kopf, sonst liest sich „108 → 40" als Verlauf.
      C_FAIR=["value_delta_pct","Fair Value · Markt → Fair"],
      // Charakter = Persönlichkeit aus dem Spielerprofil (charakter.py); die
      // Zelle zeigt das Wort, sortiert wird nach der Zahl 0-100
      C_PERS=["pers_score","Charakter"];
// Vereins-DNA: passstark × Ballgewinner, 0-100 (moneyball.add_dna)
const C_DNA=["dna","DNA"];
const ALL_COLS=[NAME,POS,C_AGE,MIN,C_SC,C_DNA,C_TAL,C_PERS,C_VAL,C_VEFF,C_FAIR,C_NOTE,C_GOALS,C_AS,C_XG,C_FIN,C_XA,C_SH,C_DU,C_DR,C_PP];

// Minutenschwelle, ab der ein Fair Value als belastbar gilt. Das Backend
// senkt sie, solange in der laufenden Saison noch niemand 450 Minuten hat,
// und meldet den tatsächlich benutzten Wert über load_saved zurück.
let FAIR_MIN_MIN = 450;

// Erklärungen für Spaltenköpfe – nur wo die Überschrift allein zu knapp ist.
const COL_TIPS = {
  value_delta_pct: "Marktwert gegen den Schätzwert aus Leistung, Alter, Liga und Position – als Urteil, dahinter Markt → Fair in Mio. "
    + "Unterbewertet = die Leistung ist mehr wert, als der Markt verlangt. Das Modell liegt typisch um Faktor 3,7 daneben; "
    + "es trennt nur Extremfälle, deshalb gibt es „leicht“ und „deutlich“. Torhüter: kein Wert. Sortiert nach dem Abstand in %.",
  pers_score: "Persönlichkeit aus dem Spielerprofil, übersetzt in Entwicklung und Mentalität (0–100). Steht neben dem Score, nicht darin. Sortiert nach der Zahl.",
  note_resid: "Ø-Note minus dem, was die Gegentore/90 der Mannschaft erwarten lassen (Note = 7,65 − 0,68 × GT/90). Der eigene Anteil des Torwarts – über Saisonhälften stabil.",
  gp_shot: "Verhinderte Tore (xGA − Gegentore) je 100 Schüsse aufs Tor – je Schuss statt je Spiel, damit der Keeper der Schießbude keinen Volumenvorteil hat.",
  save_pct: "Paraden ÷ (Paraden + Gegentore), aus den drei Paraden-Spalten des Exports gerechnet – FMs eigene Par % ist im Export kaputt.",
  sot_faced: "Schüsse aufs Tor gegen ihn = Paraden + Gegentore. Die Stichprobe hinter den Quoten.",
};

// Positions-Dashboards: eigene Spalten; Standard-Sortierung = Moneyball-Score
const TABS = {
  all:{title:"Feldspieler", sort:["score",true],           cols:ALL_COLS},
  def:{title:"Abwehr",      sort:["score",true], group:"def",
       cols:[NAME,POS,MIN,C_SC,C_DNA,C_PERS,C_FAIR,C_NOTE,C_DU,C_DPCT,C_KGW,C_KL,C_INT,C_PRG,C_PRW,C_PP,C_FO]},
  mid:{title:"Mittelfeld",  sort:["score",true],   group:"mid",
       cols:[NAME,POS,MIN,C_SC,C_DNA,C_PERS,C_FAIR,C_NOTE,C_PP,C_PRG,C_PRW,C_LOSS,C_DU,C_DPCT,C_XA,C_AS,C_GOALS]},
  off:{title:"Offensivspieler", sort:["score",true], group:"off",

  // Torwart nach dem Nachschärfen: Note über Erwartung, Paraden je Schuss und
  // die Stichprobe dahinter; "Verhindert gesamt" bleibt als Rohwert sichtbar.
  tw: {title:"Torhüter",    sort:["score",true], gk:true,
       // Kein Fair Value: das Modell belohnt Liga und Minuten, nicht Paraden –

       cols:[["name","Torhüter"],MIN,C_SC,C_PERS,C_NOTE,["note_resid","Note ü. Erw."],

             ["pen_saved","Elfer par."],C_PP]},
  unk:{title:"ohne Position", sort:["xg",true], group:"unk", cols:ALL_COLS},

function tabMatch(p){
  const t = TABS[TAB];
  if(t.gk) return !!p.is_gk;
  if(TAB === "all") return !p.is_gk;
  return (p.pos_groups||[]).includes(t.group);
}

function fmt(v){ return (typeof v==="number" && !Number.isInteger(v)) ? v.toFixed(2) : v; }
// Millionenbetrag mit Dezimalkomma, z.B. "9,0 Mio €"
function fmtMio(v){ return v==null ? "–" : v.toFixed(1).replace(".", ",") + " Mio €"; }

// Fair Value (D1): das Urteil kommt fertig aus dem Backend (fair_urteil,
// fünf Stufen aus der Modellstreuung). Die Farbe hängt am Urteil, nicht am
// Vorzeichen – siehe CSS „Fair Value". Torhüter bekommen überall null.
const URTEIL_KLASSE = {"deutlich unterbewertet":"u-dunter", "leicht unterbewertet":"u-lunter",
  "marktgerecht":"u-markt", "leicht überbewertet":"u-lueber", "deutlich überbewertet":"u-dueber"};
const urteilKlasse = p => (URTEIL_KLASSE[p.fair_urteil] || "u-markt")
  + (p.value_reliable===false ? " unsicher" : "");
// Kurzbetrag für enge Zellen: ab 10 Mio ganze Zahl, darunter eine Stelle
const mioKurz = v => v==null ? "–" : v>=10 ? String(Math.round(v)) : v.toFixed(1).replace(".", ",");
const marktMio = p => p.value_m!=null ? p.value_m : (p.value ? p.value/1e6 : null);
// Abstand als Satz statt als Vorzeichen: „Fair 98 % über Markt"
const fairSatz = d => d==null ? "" : d===0 ? "Fair = Markt"
  : `Fair ${Math.abs(d).toLocaleString("de-DE")} % ${d>0?"über":"unter"} Markt`;
// „2026-09-22T13:28:45" -> "09/2026" (Stand der sichtbaren Persönlichkeit, E2)
const monatJahr = s => s ? `${String(s).slice(5,7)}/${String(s).slice(0,4)}` : "";
const FAIR_LEER_GK = "Bei Torhütern kein Fair Value – das Modell belohnt Liga und Minuten, nicht Paraden";
// Eigener Spieler? Entscheidet, ob transfer_fee „Ablöseforderung" (fremd, was
// wir zahlen müssten) oder „unsere Forderung" (eigen) heißt.
const istEigen = p => p.im_kader!=null ? !!p.im_kader
  : !!(TACT && p.eid && TACT.slots.some(s=>s.kandidaten.some(k=>+k.id===+p.eid)));
function fairTd(p){
  if(p.fair_urteil==null)
    return `<td class="fair leer" title="${p.is_gk ? FAIR_LEER_GK
      : "Kein Schätzwert – ohne Marktwert im Export oder solange das Modell kein belastbares Signal findet"}">–</td>`;
  const tip = esc2(p.fair_text || p.fair_urteil) + (p.value_reliable===false
    ? " – unsichere Stichprobe, das Urteil behauptet nichts" : "");
  return `<td class="fair ${urteilKlasse(p)}" title="${tip}"><span class="fw">${p.fair_urteil}${
    p.value_reliable===false ? " ?" : ""}</span><span class="fz">${mioKurz(marktMio(p))} → ${mioKurz(p.fair_value_m)}</span></td>`;
}
// Modellstatus fürs Kleingedruckte, z.B. „R² 0,44 · Streuung ×3,7"
let VALUE_MODEL = null;
function modellStatus(){
  const m = VALUE_MODEL; if(!m || !m.ok) return "";
  return [m.text || "", m.n_train ? `${m.n_train.toLocaleString("de-DE")} Spieler` : ""]
    .filter(Boolean).join(" · ");
}
// Streuung als Faktor mit Dezimalkomma, z.B. „3,7" (Rückfall: Stand D1)
const streuung = () => ((VALUE_MODEL && VALUE_MODEL.streuung_faktor) || 3.7).toFixed(1).replace(".", ",");

// Persönlichkeit: Farbe nach Stufe – Grün für Vorbild/stark, Violett für
// Risiko, sonst Textfarbe (kein Rot, Regel 2). Tooltip mit beiden Achsen
// und den Hinweisen aus charakter.py. Kurzform spart Spaltenbreite.
const persInk = v => v==null ? "var(--dim)" : v>=65 ? "var(--pos)" : v<50 ? "var(--neg)" : "var(--text)";
const persKurz = l => (l||"").replace("Relativ ", "rel. ").replace("Führungspersönlichkeit","Führung");
function persTip(p){
  if(p.pers_score==null)
    return "Persönlichkeit noch nicht gescoutet" + (p.pers_medien ? ` · Medienumgang: ${esc2(p.pers_medien)}` : "");
  return [`${p.pers_label} · ${p.pers_stufe} (${p.pers_score})`,
    `Entwicklung ${p.pers_dev} · Mentalität ${p.pers_ment}`,
    p.pers_medien ? `Medienumgang: ${p.pers_medien}` : "",
    ...(p.pers_hinweise||[])].filter(Boolean).map(esc2).join("&#10;");
}
const persTd = p => p.pers_score==null
  ? `<td class="pers leer" title="${persTip(p)}">–</td>`
  : `<td class="pers" title="${persTip(p)}" style="color:${persInk(p.pers_score)}">${esc2(persKurz(p.pers_label))}</td>`;
// Statuskürzel aus der Info-Spalte des Exports, soweit bekannt
const INFO_KUERZEL = {Ver:"verletzt", Trn:"Transferliste", Lei:"Leihliste", Unz:"unzufrieden",
  Bit:"bittet um Wechsel", nEU:"Nicht-EU", Jug:"Jugend", Beo:"beobachtet", TL:"Transfer-/Leihliste"};
const infoText = s => (s||"").split(",").map(t=>t.trim()).filter(Boolean).map(t=>INFO_KUERZEL[t]||t).join(", ");

// Hell/Dunkel
function applyTheme(t){

}
function toggleTheme(){
